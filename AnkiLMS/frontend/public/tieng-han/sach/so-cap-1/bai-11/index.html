하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ethoái cần\u003c/td\u003e\u003ctd\u003etan làm (rời chỗ làm ra về)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e세수하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etẩy thủ\u003c/td\u003e\u003ctd\u003erửa mặt\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e점심\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eđiểm tâm\u003c/td\u003e\u003ctd\u003ebữa trưa\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2d:T2001,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;buteo-kkaji\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N부터 ~ N까지\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;시간을 나타내는 말 뒤에 사용해요. 시작 시간과 끝나는 시간을 말할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Gắn sau danh từ chỉ thời gian: 부터 = \\\u0026quot;từ\\\u0026quot; (lúc bắt đầu), 까지 = \\\u0026quot;đến\\\u0026quot; (lúc kết thúc).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;부터 ~ 까지\u0026quot;,\u0026quot;한 시~두 시\u0026quot;,\u0026quot;한 시부터 두 시까지\u0026quot;],[\u0026quot;부터 ~ 까지\u0026quot;,\u0026quot;월요일~금요일\u0026quot;,\u0026quot;월요일부터 금요일까지\u0026quot;],[\u0026quot;부터 ~ 까지\u0026quot;,\u0026quot;1월~3월\u0026quot;,\u0026quot;1월부터 3월까지\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;몇 시부터 몇 시까지 점심시간이에요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Giờ nghỉ trưa từ mấy giờ đến mấy giờ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;열두 시부터 한 시까지 점심시간이에요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Giờ nghỉ trưa từ 12 giờ đến 1 giờ.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;월요일부터 금요일까지 회사에 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi làm từ thứ Hai đến thứ Sáu.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Ba nhân viên (hai nữ áo trắng, một nam sơ mi trắng cà vạt đỏ) ngồi quanh bàn ăn cơm hộp bằng đũa; trên cửa sổ có đồng hồ số 12:00~13:00. Một cô hỏi \\\u0026quot;몇 시부터 몇 시까지 점심시간이에요?\\\u0026quot;, anh nam đáp \\\u0026quot;12시부터 1시까지 점심시간이에요.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Từ … đến …\\\u0026quot; – 부터 gắn sau lúc bắt đầu, 까지 gắn sau lúc kết thúc; tiếng Việt đặt \\\u0026quot;từ\\\u0026quot;, \\\u0026quot;đến\\\u0026quot; trước mốc giờ, tiếng Hàn gắn sau.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Lúc bắt đầu (giờ, ngày), có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;부터\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;아홉 시\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;아홉 시부터\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;월요일\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;월요일부터\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;오전\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;오전부터\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Lúc kết thúc (giờ, ngày), có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;까지\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;여섯 시\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;여섯 시까지\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;금요일\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;금요일까지\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;저녁\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;저녁까지\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;부터 ~ 까지\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;một khoảng: từ lúc … đến lúc …\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;아홉 시부터 여섯 시까지 일해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi làm việc từ 9 giờ đến 6 giờ.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;에 (Bài 10)\ 26quot;:54.04},{\u0026quot;ko\u0026quot;:\u0026quot;저녁에 운동해요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Buổi tối bạn có tập thể dục không?\u0026quot;,\u0026quot;start\u0026quot;:59.17,\u0026quot;end\u0026quot;:60.88},{\u0026quot;ko\u0026quot;:\u0026quot;아니요, 저녁에 운동 안 해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Không, buổi tối tôi không tập thể dục.\u0026quot;,\u0026quot;start\u0026quot;:61.55,\u0026quot;end\u0026quot;:65.19}],\u0026quot;names\u0026quot;:[],\u0026quot;source\u0026quot;:{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;file\u0026quot;:\u0026quot;6-P.mp3\u0026quot;}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e주말에 출근해요?\u003c/span\u003e – Cuối tuần bạn có đi làm không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아니요, 주말에 출근 안 해요.\u003c/span\u003e – Không, cuối tuần tôi không đi làm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e한국어 수업은 몇 시부터 몇 시까지예요?\u003c/span\u003e – Lớp tiếng Hàn từ mấy giờ đến mấy giờ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e9시부터 1시까지예요.\u003c/span\u003e – Từ 9 giờ đến 1 giờ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저녁에 운동해요?\u003c/span\u003e – Buổi tối bạn có tập thể dục không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아니요, 저녁에 운동 안 해요.\u003c/span\u003e – Không, buổi tối tôi không tập thể dục.\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e31:Tf50,\u003cfigure class=\"lesson-island\" data-island=\"cui-chao\" data-props=\"{\u0026quot;muc\u0026quot;:[],\u0026quot;canh\u0026quot;:[{\u0026quot;kind\u0026quot;:\u0026quot;chia-tay\u0026quot;,\u0026quot;cua\u0026quot;:{\u0026quot;who\u0026quot;:\u0026quot;후엔\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;먼저 가 보겠습니다.\u0026quot;},\u0026quot;trong\u0026quot;:{\u0026quot;who\u0026quot;:\u0026quot;지은\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;수고하셨습니다.\u0026quot;}}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cul\u003e\u003cli\u003eKhi chia tay: \u003cspan lang=\"ko\"\u003e먼저 가 보겠습니다.\u003c/span\u003e (người đi nói) · \u003cspan lang=\"ko\"\u003e수고하셨습니다.\u003c/span\u003e (người ở lại nói)\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eTừ 9 giờ đến 6 giờ.\u003c/strong\u003e Người Hàn thường làm từ thứ Hai đến thứ Sáu, mỗi ngày 8 tiếng; nhiều việc thì làm tới tối,\ncó khi cả cuối tuần. Luật giới hạn tối đa 52 tiếng một tuần, tính cả giờ làm thêm. \u003cspan lang=\"ko\"\u003e점심시간\u003c/span\u003e\nthường từ 12 giờ đến 1 giờ: cả nhóm hay đi ăn cùng nhau, ăn xong là quay lại làm việc – ít ai ngủ trưa như ở Việt Nam.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChào khi tan làm.\u003c/strong\u003e Về trước đồng nghiệp, nhất là người trên, thì nói \u003cspan lang=\"ko\"\u003e먼저 가 보겠습니다\u003c/span\u003e – tôi\nxin về trước. Người ở lại đáp \u003cspan lang=\"ko\"\u003e수고하셨습니다\u003c/span\u003e – anh/chị vất vả rồi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e회식\u003c/span\u003e.\u003c/strong\u003e Bữa ăn chung của cả phòng sau giờ làm, hay ở quán thịt nướng, thường do công ty trả.\nNgày nay nhiều nơi không ép uống rượu, có nơi chuyển \u003cspan lang=\"ko\"\u003e회식\u003c/span\u003e sang bữa trưa.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e안녕히 가세요\u003c/span\u003e là câu người ở lại nói với người đi (Bài 6). Bạn là người về trước\nthì nói \u003cspan lang=\"ko\"\u003e안녕히 계세요\u003c/span\u003e; còn ở công ty, câu \u003cspan lang=\"ko\"\u003e먼저 가 보겠습니다\u003c/span\u003e lịch sự hơn\n– nên dùng câu này khi về trước đồng nghiệp.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eỞ công ty\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu về giờ làm việc và lời chào khi tan làm.\u003c/p\u003e
