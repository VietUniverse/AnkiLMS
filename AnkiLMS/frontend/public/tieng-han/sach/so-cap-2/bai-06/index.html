ạc nhiên\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e겠네요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e맛있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e맛있겠네요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e재미있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e재미있겠네요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 생일 선물로 지갑을 받았어요.\u003c/span\u003e – A: Tôi được tặng chiếc ví làm quà sinh nhật.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 와, 정말 좋겠어요.\u003c/span\u003e – B: Ồ, chắc vui lắm nhỉ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 어제 밤 11시까지 일했어요.\u003c/span\u003e – A: Hôm qua tôi làm việc đến 11 giờ đêm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 많이 피곤하겠어요.\u003c/span\u003e – B: Chắc mệt lắm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e구름이 많이 꼈네요. 오후에 비가 오겠어요.\u003c/span\u003e – Trời nhiều mây quá. Chắc chiều nay mưa.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003caside class=\"sach-callout\" data-callout=\"meo\" role=\"note\" aria-label=\"Mẹo\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eMẹo\u003c/p\u003e\u003cp\u003eKể cảm xúc của \u003cstrong\u003engười thứ ba\u003c/strong\u003e (mẹ, con, bạn), tiếng Hàn đổi tính từ cảm xúc thành động từ: bỏ\n\u003cspan lang=\"ko\"\u003e요\u003c/span\u003e của dạng \u003cspan lang=\"ko\"\u003e-아요/어요\u003c/span\u003e rồi thêm \u003cspan lang=\"ko\"\u003e하다\u003c/span\u003e –\n\u003cspan lang=\"ko\"\u003e기뻐요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e기뻐하다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e행복해요\u003c/span\u003e →\n\u003cspan lang=\"ko\"\u003e행복해하다\u003c/span\u003e: \u003cspan lang=\"ko\"\u003e엄마가 행복해해요\u003c/span\u003e. \u003cspan lang=\"ko\"\u003e좋아하다\u003c/span\u003e,\n\u003cspan lang=\"ko\"\u003e싫어하다\u003c/span\u003e đã học cũng sinh ra như thế.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cp\u003eThử ngay: nghe chuyện của bạn rồi đoán – chắc vui, chắc hay, chắc vất vả hay chắc mệt? Xếp mỗi câu vào đúng ô.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-06/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;재미있겠어요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;chắc hay, chắc vui lắm\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;좋겠어요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;chắc thích lắm\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;힘들겠어요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;chắc vất vả lắm\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;피곤하겠어요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;chắc mệt lắm\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;오늘 새벽 네 시에 일어났어요.\u0026quot;,\u0026quot;o\u0026quot;:3,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Dậy từ 4 giờ sáng → chắc mệt.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;이번 주말에 노래방에 가요.\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Đi hát với bạn → chắc vui.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;다음 주부터 휴가예요.\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Sắp được nghỉ phép → chắc thích lắm.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;혼자 집안일을 다 해요.\u0026quot;,\u0026quot;o\u0026quot;:2,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Một mình làm hết việc nhà → chắc vất vả.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;어제 밤 열한 시까지 일했어요.\u0026quot;,\u0026quot;o\u0026quot;:3,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Làm đến 11 giờ đêm → chắc mệt.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;주말에 친구들하고 놀이공원에 가요.\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Đi chơi công viên giải trí → chắc vui, chắc hay.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;생일 선물로 꽃을 받았어요.\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Được tặng hoa → chắc thích lắm.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;오늘 일이 정말 많아요.\u0026quot;,\u0026quot;o\u0026quot;:2,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Việc nhiều quá → chắc vất vả.\u0026quot;}}],\u0026quot;luat\u0026quot;:\u0026quot;tu-do\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e오늘 새벽 네 시에 일어났어요. · 이번 주말에 노래방에 가요. · 다음 주부터 휴가예요. · 혼자 집안일을 다 해요. · 어제 밤 열한 시까지 일했어요. · 주말에 친구들하고 놀이공원에 가요. · 생일 선물로 꽃을 받았어요. · 오늘 일이 정말 많아요.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e재미있겠어요\u003c/span\u003e – chắc hay, chắc vui lắm\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e좋겠어요\u003c/span\u003e – chắc thích lắm\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e힘들겠어요\u003c/span\u003e – chắc vất vả lắm\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e피곤하겠어요\u003c/span\u003e – chắc mệt lắm\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T1fb5,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eul-ttae\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-(으)ㄹ 때\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;어떤 행위나 상황이 일어난 순간이나 동안을 나타내요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;khi…, lúc…\\\u0026quot;: gắn sau động từ / tính từ để chỉ khoảnh khắc hay khoảng thời gian một hành động, tình huống xảy ra. Gốc có patchim + -을 때; không có patchim (và gốc có ㄹ) + -ㄹ 때. ★ 힘들다 → 힘들 때 (ㄹ không thêm 을). Nói về quá khứ dùng -었을 때.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-을 때 (받침 O)\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹을 때\u0026quot;],[\u0026quot;-을 때 (받침 O)\u0026quot;,\u0026quot;많다\u0026quot;,\u0026quot;많을 때\u0026quot;],[\u0026quot;-ㄹ 때 (받침 X)\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;갈 때\u0026quot;],[\u0026quot;-ㄹ 때 (★ ㄹ 받침)\u0026quot;,\u0026quot;힘들다\u0026quot;,\u0026quot;힘들 때\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 언제 행복해요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Khi nào bạn thấy hạnh phúc?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 가족하고 맛있는 음식을 먹을 때 행복해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Tôi hạnh phúc khi ăn món ngon cùng gia đình.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;아플 때 부모님이 많이 보고 싶어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Lúc ốm tôi rất nhớ bố mẹ.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;숙제가 많아서 힘들 때 한국 친구가 도와줘요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Khi bài tập nhiều, vất vả, bạn người Hàn giúp tôi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;한국에 처음 왔을 때 정말 외로웠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Lần đầu đến Hàn Quốc, tôi thật sự cô đơn.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Chàng trai áo khoác thể thao xanh trắng chống tay lên bàn hỏi \\\u0026quot;후엔 씨는 언제 행복해요?\\\u0026quot;; Huyền tóc xoăn dài, áo len be, tay chạm cằm mỉm cười đáp \\\u0026quot;저는 가족들과 맛있는 음식을 먹을 때 행복해요.\\\u0026quot;, bong bóng nghĩ là cảnh ba người ăn cơm quanh bàn.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Khi …, lúc …\\\u0026quot; – gắn sau động từ, tính từ để nói lúc việc khác xảy ra: 맛있는 음식을 먹을 때 = lúc ăn món ngon.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;을 때\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹을 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;있을 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;읽을 때\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;ㄹ 때\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;갈 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;아프다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;아플 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;피곤하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;피곤할 때\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ (giữ ㄹ)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;때\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;힘들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;힘들 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만들 때\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Việc đã qua\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;았을 때 / 었을 때\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;왔을 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹었을 때\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄷ (듣다, 걷다): ㄷ đổi thành ㄹ trước 을\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;들을 때\u0026quot;}]},{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㅂ: ㅂ đổi thành 우, thêm ㄹ\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;외롭다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;외로울 때\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;무섭다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;무서울 때\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;힘들을 때\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;힘들 때\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Gốc đã có ㄹ thì chỉ thêm 때.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;듣을 때\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;들을 때\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;ㄷ của 듣다 đổi thành ㄹ trước 을.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-(으)ㄹ 때\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Khi …, lúc …\u0026quot; – gắn sau động từ, tính từ để nói lúc việc khác xảy ra: 맛있는 음식을 먹을 때 = lúc ăn món ngon.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e을 때\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹을 때\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e있을 때\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽을 때\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㄹ 때\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e가다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e갈 때\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e아프다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e아플 때\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e피곤하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e피곤할 때\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ (giữ ㄹ)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e때\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e힘들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e힘들 때\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들 때\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eViệc đã qua\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e았을 때 / 었을 때\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e오다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e왔을 때\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹었을 때\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 언제 행복해요?\u003c/span\u003e – A: Khi nào bạn thấy hạnh phúc?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 가족하고 맛있는 음식을 먹을 때 행복해요.\u003c/span\u003e – B: Tôi hạnh phúc khi ăn món ngon cùng gia đình.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아플 때 부모님이 많이 보고 싶어요.\u003c/span\u003e – Lúc ốm tôi rất nhớ bố mẹ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e숙제가 많아서 힘들 때 한국 친구가 도와줘요.\u003c/span\u003e – Khi bài tập nhiều, vất vả, bạn người Hàn giúp tôi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e한국에 처음 왔을 때 정말 외로웠어요.\u003c/span\u003e – Lần đầu đến Hàn Quốc, tôi thật sự cô đơn.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eThử ngay: gốc có patchim hay không? Xếp mỗi từ vào đúng ô – nhớ \u003cspan lang=\"ko\"\u003eㄹ\u003c/span\u003e và \u003cspan lang=\"ko\"\u003eㄷ\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-06/xep-cho-2\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;을 때\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;ㄹ 때\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;không patchim / patchim ㄹ\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;피곤하다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;많다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;아프다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;힘들다\u0026quot;,\u0026quot;o\u0026quot;:1}],\u0026quot;luat\u0026quot;:\u0026quot;goc\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e가다 · 먹다 · 보다 · 듣다 · 피곤하다 · 읽다 · 만들다 · 많다 · 아프다 · 힘들다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e을 때\u003c/span\u003e – gốc có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003eㄹ 때\u003c/span\u003e – không patchim / patchim ㄹ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T28f5,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eullae\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)ㄹ래요\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;어떤 일이나 선택에 대해 듣는 사람의 의사나 의향을 물음을 나타냅니다. 주로 비격식적인 구어에서 많이 사용합니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-을래(요)? – \\\u0026quot;(bạn) có muốn … không?\\\u0026quot;: hỏi ý muốn, ý định của người nghe về một việc hay một lựa chọn; trả lời bằng -을래(요) để nói ý muốn của mình. Chủ yếu dùng trong văn nói thân mật. Gốc có 받침 + -을래; không 받침 + -ㄹ래; gốc có ㄹ cuối + -래. Chú ý bất quy tắc: 돕다 → 도울래, 걷다 → 걸을래, 짓다 → 지을래.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹을래\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;갈래\u0026quot;],[\u0026quot;ㄹ 받침\u0026quot;,\u0026quot;만들다\u0026quot;,\u0026quot;만들래\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 주말에 같이 영화 볼래요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Cuối tuần cùng xem phim nhé?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 좋아요. 무서운 영화 볼래요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Được. Mình muốn xem phim kinh dị.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 뭐 먹을래요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Bạn muốn ăn gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 저는 비빔밥 먹을래요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Tôi muốn ăn bibimbap.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;오늘 같이 영화 볼래?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;(nói trống không) Hôm nay cùng xem phim không?\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Chàng trai áo sơ mi xanh nhạt (bong bóng có máy quay phim) chỉ tay về phía cô gái tóc đen áo khoác xanh lá; cô gái giơ ngón cái, bong bóng có hình đầu lâu (phim kinh dị).\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;(Bạn) có muốn … không?\\\u0026quot; – hỏi ý, rủ người quen; trả lời -(으)ㄹ래요 = \\\u0026quot;tôi muốn …\\\u0026quot;. Dùng với người thân quen, khi nói chuyện thường ngày.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;을래요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹을래요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;읽을래요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;ㄹ래요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;볼래요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;갈래요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;마시다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;마실래요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ (giữ ㄹ)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;래요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만들래요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nói trống không với bạn thân: bỏ 요\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;을래? / ㄹ래?\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹을래\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;볼래\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄷ (듣다, 걷다): ㄷ đổi thành ㄹ trước 을\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;들을래요\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㄹ래요?\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;hỏi ý, rủ người thân quen\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;주말에 같이 영화 볼래요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần cùng xem phim nhé?\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㄹ까요?\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;rủ, đề nghị – lịch sự hơn, dùng được với mọi người\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;주말에 같이 영화 볼까요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần mình cùng xem phim nhé?\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;보을래요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;볼래요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;보 không có patchim → ㄹ래요.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-(으)ㄹ래요\u003c/span\u003e\u003c/strong\u003e: \u0026quot;(Bạn) có muốn … không?\u0026quot; – hỏi ý, rủ người quen; trả lời -(으)ㄹ래요 = \u0026quot;tôi muốn …\u0026quot;. Dùng với người thân quen, khi nói chuyện thường ngày.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e을래요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹을래요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽을래요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㄹ래요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e보다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e볼래요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e가다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e갈래요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e마시다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e마실래요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ (giữ ㄹ)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e래요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들래요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNói trống không với bạn thân: bỏ 요\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e을래? / ㄹ래?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹을래\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e보다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e볼래\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 주말에 같이 영화 볼래요?\u003c/span\u003e – A: Cuối tuần cùng xem phim nhé?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 좋아요. 무서운 영화 볼래요.\u003c/span\u003e – B: Được. Mình muốn xem phim kinh dị.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 뭐 먹을래요?\u003c/span\u003e – A: Bạn muốn ăn gì?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 저는 비빔밥 먹을래요.\u003c/span\u003e – B: Tôi muốn ăn bibimbap.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e오늘 같이 영화 볼래?\u003c/span\u003e – (nói trống không) Hôm nay cùng xem phim không?\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e밖에\u003c/span\u003e – “chỉ …” (với phủ định)\u003c/h3\u003e\n\u003cp\u003e\u003cspan lang=\"ko\"\u003e지갑에 천 원밖에 없어요.\u003c/span\u003e – Trong ví tôi chỉ có một nghìn won.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;bakke\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N밖에\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;다른 선택을 할 가능성이 없거나 그것이 유일한 선택임을 나타냅니다. 반드시 뒤에 부정을 나타내는 말과 함께 사용합니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;밖에 – \\\u0026quot;chỉ …\\\u0026quot;: gắn sau danh từ, diễn tả không còn khả năng lựa chọn khác, đó là lựa chọn duy nhất. Luôn đi kèm phía sau với từ mang nghĩa phủ định (안, 못, 없다, 모르다…). Dùng giống nhau cho danh từ có hay không có 받침.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;주말\u0026quot;,\u0026quot;주말밖에\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;하나\u0026quot;,\u0026quot;하나밖에\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 시간이 얼마나 남았어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Còn bao nhiêu thời gian?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 조금밖에 안 남았어요. 빨리 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Chỉ còn một chút thôi. Đi nhanh lên.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;점심에 김밥 한 줄밖에 못 먹었어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trưa nay tôi chỉ ăn được một cuộn kimbap.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;지갑에 천 원밖에 없어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trong ví tôi chỉ có một nghìn won.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Sảnh rạp chiếu phim có khu trò chơi (ARCADE, GAMES): một người phụ nữ đứng cạnh biển phim, một gia đình với hai đứa trẻ đang đi vội.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Chỉ …\\\u0026quot; – gắn sau danh từ, luôn đi với phủ định (안, 못, 없다, 모르다); nghe tiếc, ít hơn mong muốn.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi danh từ, có hay không patchim (+ phủ định)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;밖에\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;하나\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;하나밖에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;물\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;물밖에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026q 3e) và chọn chỗ ngồi ngay trên sơ đồ\nphòng chiếu. Suất sớm buổi sáng (\u003cspan lang=\"ko\"\u003e조조\u003c/span\u003e) rẻ hơn. Từ tháng 4/2026, mỗi thứ Tư là\n\u003cspan lang=\"ko\"\u003e문화가 있는 날\u003c/span\u003e – \u0026quot;ngày có văn hoá\u0026quot;: nhiều bảo tàng, nhà hát giảm giá; rạp lớn giảm giá suất 17–21 giờ vào thứ Tư thứ hai và thứ Tư cuối tháng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrong rạp.\u003c/strong\u003e Để điện thoại chế độ im lặng (\u003cspan lang=\"ko\"\u003e매너 모드\u003c/span\u003e), không nói chuyện, không đá vào ghế\ntrước. Đến muộn thì cúi thấp người khi đi tìm ghế.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eVới người lớn tuổi, sếp, cô giáo, đừng nhắn \u003cspan lang=\"ko\"\u003eㅋㅋ\u003c/span\u003e hay \u003cspan lang=\"ko\"\u003eㅇㅇ\u003c/span\u003e –\nnghe suồng sã. \u003cspan lang=\"ko\"\u003e^^\u003c/span\u003e thì dùng được.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eTin nhắn của cô Kim\u003c/h3\u003e\n\u003cp\u003eRahman trượt kỳ thi bằng lái xe; cô Kim nhắn tin động viên. Chạm từng tin để nghe.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e운전면허 시험\u003c/span\u003e – thi bằng lái xe · \u003cspan lang=\"ko\"\u003e합격하다\u003c/span\u003e – đỗ ·\n\u003cspan lang=\"ko\"\u003e떨어지다\u003c/span\u003e – trượt · \u003cspan lang=\"ko\"\u003e꼭\u003c/span\u003e – nhất định · \u003cspan lang=\"ko\"\u003e힘내요\u003c/span\u003e – cố lên.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"hoi-thoai\" data-props=\"{\u0026quot;lines\u0026quot;:[{\u0026quot;who\u0026quo
