6quot;질문에 맞게 대답하세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Trả lời các câu hỏi.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;여기는 병원이에요. 지금 의사 선생님을 만났어요.\\n의사: 어디가 아파요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Đây là bệnh viện. Bạn vừa gặp bác sĩ. Bác sĩ: Bạn đau ở đâu?\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;배탈이 난 친구가 있어요.\\n친구에게 어떤 조언을 해야 할까요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Có một người bạn bị đau bụng. Bạn nên khuyên bạn ấy điều gì?\u0026quot;}]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · trả lời bác sĩ, khuyên bạn bị ốm\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e질문에 맞게 대답하세요.\u003c/span\u003e\u003c/strong\u003e – Trả lời các câu hỏi.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e여기는 병원이에요. 지금 의사 선생님을 만났어요.\n의사: 어디가 아파요?\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e배탈이 난 친구가 있어요.\n친구에게 어떤 조언을 해야 할까요?\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003e3 · Lần gần nhất bạn bị ốm\u003c/h3\u003e\n\u003cp\u003eLần gần nhất bạn bị ốm là khi nào, rồi bạn đã làm gì? Ví dụ\n\u003cspan lang=\"ko\"\u003e지난주에 감기에 걸려서 약을 먹었어요\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#15/ex-p201-speak-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p201-speak-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;듣고 말하기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;speak\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;질문을 읽고 이야기해 보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đọc câu hỏi và thử nói.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;여러분은 언제 아팠어요? 어디가 아팠어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Các bạn đã bị ốm khi nào? Đau ở đâu?\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;그래서 어떻게 했어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Rồi bạn đã làm gì?\u0026quot;}],\u0026quot;bank\u0026quot;:[\u0026quot;___에 ___이/가 아팠어요.\u0026quot;,\u0026quot;그래서 ___.\u0026quot;]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · lần gần nhất bạn bị ốm\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e질문을 읽고 이야기해 보세요.\u003c/span\u003e\u003c/strong\u003e – Đọc câu hỏi và thử nói.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e여러분은 언제 아팠어요? 어디가 아팠어요?\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e그래서 어떻게 했어요?\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e31:T1250,\u003cp\u003eChạm thẻ (hoặc tự gõ) bốn, năm câu về một lần bạn bị ốm: đau ở đâu, đi đâu, bác sĩ dặn gì, bạn đã làm gì.\nMẫu trong sách viết về giấc ngủ – bạn chỉ cần kể hôm mình bị ốm, dùng thẻ bên dưới.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#15/ex-p205-write-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p205-write-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;말하기·쓰기 과제 – 쓰기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;write\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;여러분은 건강에 대한 걱정이 있습니까? 그 문제를 어떻게 해결했습니까? \u0026lt;보기\u0026gt;와 같이 건강을 지키는 방법에 대해 쓰세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Bạn có lo lắng gì về sức khỏe không? Bạn đã giải quyết vấn đề đó thế nào? Viết về cách giữ gìn sức khỏe giống mẫu.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Viết về một vấn đề sức khỏe của bạn và cách bạn giữ gìn sức khỏe.\u0026quot;}],\u0026quot;bank\u0026quot;:[\u0026quot;여러분은 밤에 잠이 잘 옵니까? 자주 깨지 않습니까? 저는 스트레스를 많이 받아서 잠을 잘 못 잤습니다. 그래서 너무 피곤했습니다. 여러분, 잠을 푹 자고 싶습니까? 스트레스를 바로 푸세요. 그리고 커피를 많이 마시지 마세요. 자기 3시간 전에 식사하고 목욕한 후에 주무세요. 잠을 잘 잘 수 있을 겁니다.\u0026quot;]},\u0026quot;tiles\u0026quot;:[{\u0026quot;words\u0026quot;:[\u0026quot;머리가 아팠어요\u0026quot;,\u0026quot;배가 아팠어요\u0026quot;,\u0026quot;목이 아팠어요\u0026quot;,\u0026quot;감기에 걸렸어요\u0026quot;,\u0026quot;열이 났어요\u0026quot;,\u0026quot;병원에 갔어요\u0026quot;,\u0026quot;의사 선생님: \\\u0026quot;커피를 마시지 마세요.\\\u0026quot;\u0026quot;,\u0026quot;밥을 먹은 후에 약을 먹었어요\u0026quot;,\u0026quot;푹 쉬었어요\u0026quot;,\u0026quot;물을 많이 마시는 것이 좋아요\u0026quot;]}],\u0026quot;nhan\u0026quot;:\u0026quot;Viết · đoạn văn hôm tôi bị ốm\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e여러분은 건강에 대한 걱정이 있습니까? 그 문제를 어떻게 해결했습니까? \u0026lt;보기\u0026gt;와 같이 건강을 지키는 방법에 대해 쓰세요.\u003c/span\u003e\u003c/strong\u003e – Bạn có lo lắng gì về sức khỏe không? Bạn đã giải quyết vấn đề đó thế nào? Viết về cách giữ gìn sức khỏe giống mẫu.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eViết xong thì kể to hôm bạn bị ốm – thu thành băng giọng của bạn.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bang-gioi-thieu\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-20/bang-gioi-thieu\u0026quot;,\u0026quot;lesson\u0026quot;:\u0026quot;so-cap-1/bai-20\u0026quot;,\u0026quot;mau\u0026quot;:[\u0026quot;___에 ___이/가 아팠어요.\u0026quot;,\u0026quot;그래서 ___에 갔어요.\u0026quot;,\u0026quot;의사 선생님: \\\u0026quot;___지 마세요.\u0026quot;,\u0026quot;___(으)세요.\\\u0026quot; ___(으)ㄴ 후에 약을 먹었어요.\u0026quot;,\u0026quot;지금은 괜찮아요.\u0026quot;],\u0026quot;maxGiay\u0026quot;:90,\u0026quot;ngheLai\u0026quot;:{\u0026quot;takeKey\u0026quot;:\u0026quot;bang|so-cap-1/bai-06/bang-gioi-thieu|0\u0026quot;,\u0026quot;lesson\u0026quot;:\u0026quot;so-cap-1/bai-06\u0026quot;,\u0026quot;nhan\u0026quot;:{\u0026quot;vi\u0026quot;:\u00 ([1,"36:T28be,\u003ch3\u003e1 · Đoạn mẫu\u003c/h3\u003e\n\u003cp\u003eMột bạn trong lớp dán lên bảng đoạn văn của mình: một vấn đề sức khoẻ, vì sao, rồi lời khuyên. Đoạn của bạn cũng viết theo thứ tự đó.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;여러분은 밤에 잠이 잘 옵니까? 자주 깨지 않습니까? 저는 스트레스를 많이 받아서 잠을 잘 못 잤습니다. 그래서 너무 피곤했습니다. 그렇지만 지금은 잘 잡니다. 여러분 잠을 푹 자고 싶습니까? 스트레스를 바로 푸세요. 그리고 자기 전에 커피를 마시지 마세요. 자기 3시간 전에 식사하고 목욕한 후에 주무세요. 잠을 잘 수가 있을 겁니다. 여러분에게도 이 방법이 도움이 되기를 바랍니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Các bạn có ngủ ngon vào ban đêm không? Có hay bị thức giấc không? Tôi đã bị căng thẳng nhiều nên ngủ không ngon. Vì vậy tôi đã rất mệt. Nhưng bây giờ tôi ngủ ngon rồi. Các bạn có muốn ngủ thật ngon không? Hãy giải tỏa căng thẳng ngay. Và trước khi ngủ đừng uống cà phê. Hãy ăn tối trước khi ngủ 3 tiếng, tắm xong rồi hãy đi ngủ. Các bạn sẽ ngủ ngon được. Mong rằng cách này cũng giúp ích cho các bạn.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Trong khung tròn nền xanh ngọc: một người đàn ông tóc nâu nằm nghiêng trên gối xanh nhạt, mắt mở thao láo, quầng thâm dưới mắt, vẻ mệt mỏi vì mất ngủ.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;머리\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đầu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;목\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cổ, họng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;배\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bụng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;팔\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cánh tay\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;손\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bàn tay\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;다리\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chân (cẳng chân
