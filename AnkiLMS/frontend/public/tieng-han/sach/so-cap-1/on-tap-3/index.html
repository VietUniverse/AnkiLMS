0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;보내다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;gửi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;받다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhận\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;초대를 하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mời\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;초대를 받다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;được mời, nhận lời mời\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선물을 하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tặng quà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선물을 받다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhận quà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이야기를 하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nói chuyện, kể\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이야기를 듣다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nghe (nói, kể)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;전화를 하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;gọi điện thoại\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;전화를 받다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nghe điện thoại, nhận cuộc gọi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;어버이날\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày Cha Mẹ (8/5)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;스승의 날\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày Nhà giáo (15/5)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;졸업식\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lễ tốt nghiệp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;결혼식\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lễ cưới, đám cưới\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;생일/생신\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sinh nhật / sinh nhật (kính ngữ, cho người trên)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;생신을 축하드립니다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chúc mừng sinh nhật (ông, bà, người trên)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;여성의 날\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày Phụ nữ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;어린이날\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày Thiếu nhi (5/5)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;기분이 좋다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vui, tâm trạng tốt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선물\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;quà, món quà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;초대\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lời mời, sự mời\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;초대장\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thiệp mời\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;축하하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chúc mừng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;카드를 쓰다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;viết thiệp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;노래를 부르다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hát (bài hát)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;케이크\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bánh kem, bánh ngọt\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e어제는 제 졸업식이었습니다.\u003cbr\u003e친구들이 축하해 주었습니다.\u003cbr\u003e어머니는 저에게 꽃하고 시계를 선물해 주셨습니다.\u003cbr\u003e그리고 동생은 사진을 찍어 주었습니다.\u003cbr\u003e졸업식 후에 우리 가족은 한국 식당에 갔습니다.\u003cbr\u003e아버지께서 불고기를 사 주셨습니다.\u003cbr\u003e불고기가 정말 맛있었습니다.\u003cbr\u003e저는 기분이 아주 좋았습니다.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eHôm qua là lễ tốt nghiệp của tôi.\u003cbr\u003eCác bạn đã chúc mừng tôi.\u003cbr\u003eMẹ tặng tôi hoa và đồng hồ.\u003cbr\u003eCòn em tôi thì chụp ảnh cho tôi.\u003cbr\u003eSau lễ tốt nghiệp, gia đình tôi đi nhà hàng Hàn Quốc.\u003cbr\u003eBố đã mua bulgogi cho cả nhà.\u003cbr\u003eBulgogi thật sự rất ngon.\u003cbr\u003eTôi đã rất vui.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-islan 03cspan lang=\"ko\"\u003e못해요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e할 수 있어요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e했어요\u003c/span\u003e)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e영화\u003c/span\u003e – phim (ánh họa / thủy vịnh / sinh thần / vạn)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e할머니, 많이 ___.\u003c/span\u003e – Bà ăn nhiều vào ạ. (\u003cspan lang=\"ko\"\u003e먹었어요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e먹어요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e드세요\u003c/span\u003e)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저는 할머니께 책을 읽어 ___.\u003c/span\u003e – Tôi đọc sách cho bà nghe. (\u003cspan lang=\"ko\"\u003e주세요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e드려요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e싶어요\u003c/span\u003e)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e반\u003c/span\u003e (cho thêm ít món ăn kèm / sinh nhật / đồ uống, nước ngọt / rưỡi (= 30 phút))\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e___\u003c/span\u003e – 6 giờ chiều, bạn xong việc và về trước; trưởng phòng vẫn đang làm. Bạn nói: (\u003cspan lang=\"ko\"\u003e먼저 가 보겠습니다.\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e수고하셨습니다.\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e안녕히 가세요.\u003c/span\u003e)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e___\u003c/span\u003e – Ở quán ăn Hàn, xin thêm món ăn kèm thì phải trả thêm tiền – đúng không? (\u003cspan lang=\"ko\"\u003e네\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e아니요\u003c/span\u003e)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e수영\u003c/span\u003e – bơi lội (thoái cần / tản sách / nhân phân / thủy vịnh)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e___\u003c/span\u003e – Người Hàn đếm theo vạn. 50.000 won đọc là: (\u003cspan lang=\"ko\"\u003e오만 원\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e오십천 원\u003c/span\u003e)\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e___\u003c/span\u003e – Sáng thứ Hai, đồng ngh
