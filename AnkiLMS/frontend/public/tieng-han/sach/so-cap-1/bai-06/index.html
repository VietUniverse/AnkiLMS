 nói \\\u0026quot;후엔이에요.\\\u0026quot;, Angela nói \\\u0026quot;안젤라예요.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Là …\\\u0026quot; – gắn ngay sau danh từ để nói tên, nghề, nước (tiếng Việt đặt \\\u0026quot;là\\\u0026quot; trước, tiếng Hàn gắn đuôi sau); lên giọng cuối câu là thành câu hỏi.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ có patchim (phụ âm cuối)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;이에요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;후엔\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;후엔이에요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;학생\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;학생이에요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;선생님\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;선생님이에요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;예요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;안젤라\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;안젤라예요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;주부\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;주부예요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;친구\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;친구예요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;저는 후엔예요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;저는 후엔이에요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;후엔 có patchim ㄴ nên phải có 이: 이에요.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;저는 안젤라이에요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;저는 안젤라예요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;안젤라 hết bằng nguyên âm (라) nên chỉ thêm 예요.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\
