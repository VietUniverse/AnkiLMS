c/td\u003e\u003ctd lang=\"ko\"\u003e만두도 먹었어요.\u003c/td\u003e\u003ctd\u003eTôi cũng đã ăn há cảo.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T2240,\u003cp\u003eCô giáo mang đến lớp bài viết của một bạn du học sinh. Bài dùng đuôi \u003cspan lang=\"ko\"\u003e-습니다\u003c/span\u003e của Bài 13:\n\u003cspan lang=\"ko\"\u003e못합니다\u003c/span\u003e là \u003cspan lang=\"ko\"\u003e못해요\u003c/span\u003e. Chạm từ hoặc câu để xem nghĩa.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;제 친구 나타샤 씨는 러시아에서 왔습니다. 나타샤 씨는 농구를 좋아합니다. 저도 농구를 좋아합니다. 그래서 우리는 자주 학교 운동장에서 농구를 합니다. 나타샤 씨는 고향에서 농구 선수였습니다. 농구를 아주 잘합니다. 하지만 저는 잘 못합니다. 저는 나타샤 씨한테 농구를 많이 배웠습니다.\\n하지만 요즘 나타샤 씨하고 농구를 못합니다. 지난주부터 제 다리가 조금 아팠습니다. 그런데 지금은 다리가 괜찮습니다. 다음 주부터 나타샤 씨하고 농구를 합니다. 그래서 기분이 좋습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bạn tôi, Natasha, đến từ Nga. Natasha thích bóng rổ. Tôi cũng thích bóng rổ. Vì vậy chúng tôi hay chơi bóng rổ ở sân vận động của trường. Ở quê, Natasha từng là vận động viên bóng rổ. Cô ấy chơi bóng rổ rất giỏi. Nhưng tôi thì chơi không giỏi. Tôi đã học bóng rổ từ Natasha rất nhiều.\\nNhưng dạo này tôi không chơi bóng rổ với Natasha được. Từ tuần trước chân tôi hơi đau. Nhưng bây giờ chân tôi đã ổn rồi. Từ tuần sau tôi sẽ chơi bóng rổ với Natasha. Vì vậy tôi thấy vui.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Cô gái tóc vàng dài (Natasha), mặc đồng phục bóng rổ xanh lá số 7, đeo băng gối đen, đang dẫn bóng rổ trên nền sân xanh có vạch trắng.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;운동\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thể thao, tập thể dục\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;수영\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bơi lội\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;축구\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bóng đá\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;농구\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bóng rổ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;야구\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bóng chày\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;잘하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giỏi, làm tốt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;연습\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;luyện tập\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;시작하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bắt đầu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;자주\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thường, hay\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;매일\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mỗi ngày, hằng ngày\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;다시\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lại, một lần nữa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;하지만\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhưng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(운동)을 하다 = (운동)하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chơi / tập (môn thể thao): \\\u0026quot;(môn)을/를 하다\\\u0026quot; và \\\u0026quot;(môn)하다\\\u0026quot; cùng nghĩa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(연습)을 하다 = (연습)하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;luyện tập (môn gì): \\\u0026quot;(môn) 연습을 하다\\\u0026quot; = \\\u0026quot;(môn)을/를 연습하다\\\u0026quot;\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선수\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cầu thủ, vận động viên\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;아프다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đau, ốm\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e제 친구 나타샤 씨는 러시아에서 왔습니다. 나타샤 씨는 농구를 좋아합니다. 저도 농구를 좋아합니다. 그래서 우리는 자주 학교 운동장에서 농구를 합니다. 나타샤 씨는 고향에서 농구 선수였습니다. 농구를 아주 잘합니다. 하지만 저는 잘 못합니다. 저는 나타샤 씨한테 농구를 많이 배웠습니다.\u003cbr\u003e하지만 요즘 나타샤 씨하고 농구를 못합니다. 지난주부터 제 다리가 조금 아팠습니다. 그런데 지금은 다리가 괜찮습니다. 다음 주부터 나타샤 씨하고 농구를 합니다. 그래서 기분이 좋습니다.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eBạn tôi, Natasha, đến từ Nga. Natasha thích bóng rổ. Tôi cũng thích bóng rổ. Vì vậy chúng tôi hay chơi bóng rổ ở sân vận động của trường. Ở quê, Natasha từng là vận động viên bóng rổ. Cô ấy chơi bóng rổ rất giỏi. Nhưng tôi thì chơi không giỏi. Tôi đã học bóng rổ từ Natasha rất nhiều.\u003cbr\u003eNhưng dạo này tôi không chơi bóng rổ với Natasha được. Từ tuần trước chân tôi hơi đau. Nhưng bây giờ chân tôi đã ổn rồi. Từ tuần sau tôi sẽ chơi bóng rổ với Natasha. Vì vậy tôi thấy vui.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#9/ex-p130-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p130-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;fill\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;글을 잘 읽고 답하세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đọc kỹ bài và điền vào chỗ trống.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;친구는 무엇을 좋아합니까?\\n제 친구는 ___를 좋아합니다.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Bạn (của tôi) thích gì? – Bạn tôi thích ___.\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;농구\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;농구\u0026quot;,\u0026quot;축구\u0026quot;,\u0026quot;잘합니다\u0026quot;,\u0026quot;못합니다\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;나는 농구를 잘합니까?\\n저는 ___를 잘 ___.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Tôi có chơi bóng rổ giỏi không? – Tôi chơi ___ không giỏi.\u0026quot;,\u0026quot;blanks\u0026quot;:[{\u0026quot;answer\u0026quot;:[\u0026quot;농구\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;농구\u0026quot;,\u0026quot;축구\u0026quot;,\u0026quot;잘합니다\u0026quot;,\u0026quot;못합니다\u0026quot;]},{\u0026quot;answer\u0026quot;:[\u0026quot;못합니다\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;농구\u0026quot;,\u0026quot;축구\u0026quot;,\u0026quot;잘합니다\u0026quot;,\u0026quot;못합니다\u0026quot;]}]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · ai thích gì, ai chơi giỏi\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e글을 잘 읽고 답하세요.\u003c/span\u003e\u003c/strong\u003e – Đọc kỹ bài và điền vào chỗ trống.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e친구는 무엇을 좋아합니까?\n제 친구는 ___를 좋아합니다.\u003c/span\u003e \u003csmall\u003e(농구 / 축구 / 잘합니다 / 못합니다)\u003c/small\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나는 농구를 잘합니까?\n저는 ___를 잘 ___.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#9/ex-p130-3\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p130-3\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;알맞은 것을 고르세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Chọn câu đúng với nội dung bài đọc.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Câu nào đúng với bài đọc?\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;제 친구는 한국의 운동 선수입니다.\u0026quot;,\u0026quot;우리는 가끔 운동장에서 농구합니다.\u0026quot;,\u0026quot;저는 다음 주에 농구를 하지 못합니다.\u0026quot;,\u0026quot;제 친구는 저한테 농구를 가르쳤습니다.\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;제 친구는 저한테 농구를 가르쳤습니다.\u0026quot;]}]},\u0026quot;nhan\u0026
