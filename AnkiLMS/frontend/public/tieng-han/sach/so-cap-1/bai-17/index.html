c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"tu-vung\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;group\u0026quot;:\u0026quot;방향\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Phương hướng\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;오른쪽\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bên phải\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;빵집은 학교 오른쪽에 있어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Tiệm bánh ở bên phải trường học.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Trường học màu cam có cờ, mũi tên đỏ chỉ sang tiệm bánh \\\u0026quot;맛나 빵집\\\u0026quot; ở bên phải.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;방향\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Phương hướng\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;왼쪽\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bên trái\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;은행은 학교 왼쪽에 있어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Ngân hàng ở bên trái trường học.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Trường học màu cam có cờ, mũi tên đỏ chỉ sang ngân hàng ở bên trái.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;방향\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Phương hướng\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;똑바로\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thẳng\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;똑바로 가세요. 그럼 학교가 있어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Hãy đi thẳng. Rồi sẽ thấy trường học.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Mũi tên đỏ từ dưới đường chỉ thẳng lên phía trường học màu cam có cờ.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;방향\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Phương hướng\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;건너편\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phía bên kia (đường)\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;횡단보도 건너편에 버스 정류장이 있어요.\u0026quo 003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e로\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e지하철\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e지하철로\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ có patchim khác\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e으로\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e집\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e집으로\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e오른쪽\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e오른쪽으로\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e버스로 집에 가요?\u003c/span\u003e – Bạn về nhà bằng xe buýt à?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아니요, 지하철로 가요.\u003c/span\u003e – Không, tôi đi bằng tàu điện ngầm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 라민 씨, 학교에 어떻게 와요?\n나: 자전거로 와요.\u003c/span\u003e – A: Ramin, anh đến trường bằng gì?\nB: Tôi đến bằng xe đạp.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e공항에 택시로 가요.\u003c/span\u003e – Tôi đi taxi ra sân bay.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eHỏi \u0026quot;đi bằng gì?\u0026quot; là \u003cspan lang=\"ko\"\u003e어떻게 가요?\u003c/span\u003e Cùng chữ \u003cspan lang=\"ko\"\u003e(으)로\u003c/span\u003e còn chỉ hướng đi – \u0026quot;về\nphía …\u0026quot;: \u003cspan lang=\"ko\"\u003e오른쪽으로 가세요\u003c/span\u003e (đi sang bên phải), \u003cspan lang=\"ko\"\u003e3번 출구로 나오세요\u003c/span\u003e (ra lối\nsố 3). Chọn \u003cspan lang=\"ko\"\u003e으로\u003c/span\u003e hay \u003cspan lang=\"ko\"\u003e로\u003c/span\u003e theo đúng bảng trên.\u003c/p\u003e\n\u003cp\u003eThử ngay: xếp mỗi từ vào ô \u003cspan lang=\"ko\"\u003e으로\u003c/span\u003e hay \u003cspan lang=\"ko\"\u003e로\u003c/span\u003e – nhìn chữ cuối, nhớ ngoại lệ\n\u003cspan lang=\"ko\"\u003eㄹ\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-17/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;으로\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;có patchim (trừ ㄹ)\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;로\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;không patchim / patchim ㄹ\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;오른쪽\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;비행기\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;지하철역\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;지하철\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;왼쪽\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;자전거\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;정류장\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;버스\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;집\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;택시\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;공항\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;기차\u0026quot;,\u0026quot;o\u0026quot;:1}],\u0026quot;luat\u0026quot;:\u0026quot;goc\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e오른쪽 · 비행기 · 지하철역 · 지하철 · 왼쪽 · 자전거 · 정류장 · 버스 · 집 · 택시 · 공항 · 기차\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e으로\u003c/span\u003e – có patchim (trừ ㄹ)\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e로\u003c/span\u003e – không patchim / patchim ㄹ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T4af4,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eureo-gada\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)러 가다/오다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;이동의 목적을 나타낼 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Nói mục đích của việc đi lại — \\\u0026quot;đi để làm gì\\\u0026quot;, \\\u0026quot;đến để làm gì\\\u0026quot;. Thân động từ có patchim + -으러; không patchim hoặc patchim ㄹ (만들다) + -러; theo sau là 가다/오다.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-으러 가다\u0026quot;,\u0026quot;받다\u0026quot;,\u0026quot;받으러 가다\u0026quot;],[\u0026quot;-으러 가다\u0026quot;,\u0026quot;찾다\u0026quot;,\u0026quot;찾으러 가다\u0026quot;],[\u0026quot;-러 가다\u0026quot;,\u0026quot;사다\u0026quot;,\u0026quot;사러 가다\u0026quot;],[\u0026quot;-러 가다\u0026quot;,\u0026quot;타다\u0026quot;,\u0026quot;타러 가다\u0026quot;],[\u0026quot;-러 가다\u0026quot;,\u0026quot;만들다\u0026quot;,\u0026quot;만들러 가다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;공원에 가요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bạn đi công viên à?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;네, 자전거 타러 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vâng, tôi đi đạp xe.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 라흐만 씨, 한국에 왜 왔어요?\\n나: 일하러 왔어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Rahman, sao anh đến Hàn Quốc?\\nB: Tôi đến để làm việc.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;친구들과 식당에 점심을 먹으러 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi ăn trưa ở quán cùng bạn bè.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trước cổng công viên (biển “OO공원”), người phụ nữ đeo kính tóc ngắn vẫy tay chào cô gái áo khoác vàng đang dắt xe đạp hồng có giỏ phía trước.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Đi / đến để …\\\u0026quot; – nói mục đích của việc đi lại; gốc động từ + (으)러, rồi mới tới 가요 / 와요: 사러 가요 = đi (để) mua.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim (kể cả 하다)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;러 가요 / 러 와요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;사다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;사러 가요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;타다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;타러 가요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;일하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;일하러 와요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ: không thêm 으\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;러 가요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만들러 가요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim khác\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;으러 가요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹으러 가요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;찾다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;찾으러 가요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;N에 가요 (Bài 9)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;chỉ nói đi đâu\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;은행에 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi ngân hàng.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;V-(으)러 가요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói đi để làm gì – hay đi kèm nơi đến\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;은행에 환전하러 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi ngân hàng để đổi tiền.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;먹러 가요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;먹으러 가요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;먹 có patchim nên phải có 으.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;만들으러 가요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;만들러 가요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Patchim ㄹ không thêm 으.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-(으)러 가다/오다\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Đi / đến để …\u0026quot; – nói mục đích của việc đi lại; gốc động từ + (으)러, rồi mới tới 가요 / 와요: 사러 가요 = đi (để) mua.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim (kể cả 하다)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e러 가요 / 러 와요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e사다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e사러 가요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e타다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e타러 가요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e일하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e일하러 와요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ: không thêm 으\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e러 가요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들러 가요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim khác\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e으러 가요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹으러 가요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e찾다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찾으러 가요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e공원에 가요?\u003c/span\u003e – Bạn đi công viên à?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e네, 자전거 타러 가요.\u003c/span\u003e – Vâng, tôi đi đạp xe.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 라흐만 씨, 한국에 왜 왔어요?\n나: 일하러 왔어요.\u003c/span\u003e – A: Rahman, sao anh đến Hàn Quốc?\nB: Tôi đến để làm việc.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e친구들과 식당에 점심을 먹으러 가요.\u003c/span\u003e – Tôi đi ăn trưa ở quán cùng bạn bè.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e에서\u003c/span\u003e … \u003cspan lang=\"ko\"\u003e까지\u003c/span\u003e – “từ … đến …”\u003c/h3\u003e\n\u003cp\u003eTừ nơi này đến nơi kia. Bài 11 đã có \u003cspan lang=\"ko\"\u003e부터\u003c/span\u003e … \u003cspan lang=\"ko\"\u003e까지\u003c/span\u003e cho thời gian.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eseo-kkaji\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N에서 N까지\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;에서: 범위의 출발점을 나타내는 조사입니다. 까지: 범위의 끝 지점을 나타내는 조사입니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;에서 \\\u0026quot;từ\\\u0026quot; – trợ từ chỉ điểm xuất phát; 까지 \\\u0026quot;đến\\\u0026quot; – trợ từ chỉ điểm kết thúc của một phạm vi (quãng đường, thời gian). Gắn trực tiếp sau danh từ, không phụ thuộc 받침. Mẫu hay dùng: A에서 B까지 (từ A đến B).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;집\u0026quot;,\u0026quot;집에서\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;학교\u0026quot;,\u0026quot;학교에서\u0026quot;],[\u0026quot;받침 ○\u0026quot;,\u0026quot;집\u0026quot;,\u0026quot;집까지\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;학교\u0026quot;,\u0026quot;학교까지\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 집에서 학교까지 시간이 얼마나 걸려요?\\n나: 30분 걸려요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Từ nhà đến trường mất bao lâu?\\nB: Mất 30 phút.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Toà trường học màu vàng mái đỏ giữa hàng cây, chiếc xe buýt trường học vàng đỗ phía trước, hai em học sinh đeo cặp chạy trên con đường dẫn từ xe buýt đến trường.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Từ … đến …\\\u0026quot; – 에서 gắn sau nơi bắt đầu, 까지 gắn sau nơi đến; 에서부터 cũng nghĩa là \\\u0026quot;từ\\\u0026quot;.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi danh từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;에서 … 까지\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;집\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;집에서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;학교\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;학교까지\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;공항\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;공항까지\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;N에서 (Bài 9)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;\\\u0026quot;ở\\\u0026quot; – nơi làm việc gì\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;식당에서 밥을 먹어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi ăn cơm ở quán.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;N부터 N까지 (Bài 11)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;từ … đến … về thời gian\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;9시부터 6시까지 일해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi làm việc từ 9 giờ đến 6 giờ.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;N에서 N까지\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;từ … đến … về nơi chốn\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;집에서 회사까지 버스로 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi xe buýt từ nhà
