an lang=\"ko\"\u003e팔이 부러지다\u003c/span\u003e gãy tay · \u003cspan lang=\"ko\"\u003e다리를 다치다\u003c/span\u003e bị thương ở chân · \u003cspan lang=\"ko\"\u003e해열제\u003c/span\u003e thuốc hạ sốt · \u003cspan lang=\"ko\"\u003e두통약\u003c/span\u003e thuốc đau đầu · \u003cspan lang=\"ko\"\u003e감기약\u003c/span\u003e thuốc cảm · \u003cspan lang=\"ko\"\u003e소화제\u003c/span\u003e thuốc tiêu hoá · \u003cspan lang=\"ko\"\u003e기침약\u003c/span\u003e thuốc ho · \u003cspan lang=\"ko\"\u003e시럽\u003c/span\u003e siro, thuốc nước – 시럽을 흔들어서 드세요. Lắc siro rồi uống. · \u003cspan lang=\"ko\"\u003e파스를 붙이다\u003c/span\u003e dán miếng dán giảm đau (cao dán) · \u003cspan lang=\"ko\"\u003e밴드를 붙이다\u003c/span\u003e dán băng cá nhân · \u003cspan lang=\"ko\"\u003e소독약을 바르다\u003c/span\u003e bôi thuốc sát trùng · \u003cspan lang=\"ko\"\u003e연고를 바르다\u003c/span\u003e bôi thuốc mỡ · \u003cspan lang=\"ko\"\u003e하루에 세 번\u003c/span\u003e ngày ba lần – 이 약은 하루에 세 번 드세요. Thuốc này ngày uống ba lần. · \u003cspan lang=\"ko\"\u003e식전\u003c/span\u003e trước bữa ăn · \u003cspan lang=\"ko\"\u003e식후\u003c/span\u003e sau bữa ăn · \u003cspan lang=\"ko\"\u003e흔들다\u003c/span\u003e lắc – 잘 흔들어서 주세요. Lắc đều rồi cho uống. · \u003cspan lang=\"ko\"\u003e약을 짓다\u003c/span\u003e bốc thuốc, pha thuốc theo đơn – 약국에서 약을 지어요. Hiệu thuốc bốc thuốc. · \u003cspan lang=\"ko\"\u003e낫다\u003c/span\u003e khỏi (bệnh) – 빨리 나으면 좋겠어요. Mong bạn mau khỏi. · \u003cspan lang=\"ko\"\u003e잠을 충분히 자다\u003c/span\u003e ngủ đủ giấc · \u003cspan lang=\"ko\"\u003e음식을 골고루 먹다\u003c/span\u003e ăn uống đủ chất, ăn đa dạng các món · \u003cspan lang=\"ko\"\u003e식사를 규칙적으로 하다\u003c/span\u003e ăn uống đúng giờ, đều đặn · \u003cspan lang=\"ko\"\u003e운동을 꾸준히 하다\u003c/span\u003e tập thể dục đều đặn · \u003cspan lang=\"ko\"\u003e잠이 부족하다\u003c/span\u003e thiếu ngủ · \u003cspan lang=\"ko\"\u003e편식이 심하다\u003c/span\u003e kén ăn, ăn uống thiên lệch nặng · \u003cspan lang=\"ko\"\u003e식사가 불규칙하다\u003c/span\u003e ăn uống thất thường, không đúng giờ · \u003cspan lang=\"ko\"\u003e운동을 거 wer\u0026quot;:[\u0026quot;소화가 안 돼서 걱정해요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;잠을 잘 못 자서 걱정해요.\u0026quot;,\u0026quot;소화가 안 돼서 걱정해요.\u0026quot;,\u0026quot;머리가 아파서 걱정해요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;남자가 알려 준 방법으로 맞는 것은 O, 틀린 것은 X 하세요.\\n① 간식을 조금만 드세요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Cách người đàn ông chỉ: đúng ghi O, sai ghi X. ① Hãy chỉ ăn vặt một chút thôi.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;X\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;운동을 더 자주 하세요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Hãy tập thể dục thường xuyên hơn.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;물을 많이 드세요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Hãy uống nhiều nước.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]}]},\u0026quot;audio\u0026quot;:{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;file\u0026quot;:\u0026quot;17-L.mp3\u0026quot;,\u0026quot;start\u0026quot;:13.52,\u0026quot;end\u0026quot;:59.09,\u0026quot;text\u0026quot;:\u0026quot;안녕하세요? 서울에 사는 주부입니다. 저는 요즘 소화가 너무 안 돼서 걱정이에요. 네, 보통 운동을 자주 하십니까? 자주 하지 않지만 일주일에 한 번 2시간 정도 걸어요. 밤에 빵이나 과자 같은 간식을 드십니까? 네, 11시쯤 되면 배가 고파서 자주 먹게 돼요. 그렇군요. 밤에 뭘 드시면 소화에 안 좋습니다. 그러니까 될 수 있으면 안 드시는 게 좋고요. 또 운동은 한 번에 많이 하는 것보다 자주 하는 것이 중요합니다. 또 물을 많이 드시면 좋겠습니다.\u0026quot;},\u0026quot;nhan\u0026quot;:\u0026quot;Nghe · thính giả lo gì, chuyên gia khuyên gì?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e여자가 라디오에서 건강 고민을 이야기하고 있어요. 잘 듣고 답해 보세요.\u003c/span\u003e\u003c/strong\u003e – Một người phụ nữ đang kể nỗi lo về sức khoẻ trên radio. Hãy nghe kỹ và trả lời.\u003c/p\u003e\u003c
