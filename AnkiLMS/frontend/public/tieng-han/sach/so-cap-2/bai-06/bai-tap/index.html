ngủ được.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCô giáo\u003c/td\u003e\u003ctd lang=\"ko\"\u003e정말 고생했어요.\u003c/td\u003e\u003ctd\u003eEm vất vả nhiều rồi.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCô giáo\u003c/td\u003e\u003ctd lang=\"ko\"\u003e이사 잘하세요!\u003c/td\u003e\u003ctd\u003eChúc em chuyển nhà suôn sẻ!\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T2039,\u003cp\u003eBài đọc của giáo trình: một người bạn nhắn tin rủ Natasha đi xem phim. Chạm từ hoặc câu để xem nghĩa.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e이번에 하는 영화\u003c/span\u003e – phim đang chiếu đợt này · \u003cspan lang=\"ko\"\u003e함께\u003c/span\u003e – cùng ·\n\u003cspan lang=\"ko\"\u003e-(이)라서\u003c/span\u003e – vì là · \u003cspan lang=\"ko\"\u003e-아/어야 해요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e-아/어야 돼요\u003c/span\u003e –\nphải … · \u003cspan lang=\"ko\"\u003e오전에만\u003c/span\u003e – chỉ buổi sáng · \u003cspan lang=\"ko\"\u003e연락 주세요\u003c/span\u003e – liên lạc cho mình nhé.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;나타샤 씨, 우리 화요일에 영화 볼래요?\\n이번에 하는 영화를 나타샤 씨와 함께 보고 싶어요. 인기가 많은 영화라서 자리가 많이 안 남았어요. 휴일에는 자리가 없어서 평일에 봐야 해요.\\n평일에 같이 영화를 볼 수 있어요? 화요일 오전에만 자리가 있어요. 다섯 자리밖에 안 남아서 빨리 예매해야 돼요.\\n연락 주세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Natasha ơi, thứ Ba mình đi xem phim nhé?\\nMình muốn xem cùng Natasha bộ phim đang chiếu đợt này. Vì là phim được yêu thích nên không còn nhiều chỗ. Ngày nghỉ thì hết chỗ nên phải xem vào ngày thường.\\nNgày thường bạn đi xem phim cùng mình được không? Chỉ có buổi sáng thứ Ba là còn chỗ. Chỉ còn năm chỗ nên phải đặt vé nhanh.\\nLiên lạc cho mình nhé.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Cô gái da nâu, tóc búi cao, áo hồng tím đứng cạnh cửa sổ lớn nhìn ra các toà nhà cao tầng, tay cầm điện thoại nhắn tin; trên bậu cửa có chậu cây xanh màu đỏ và chồng sách có chữ \\\u0026quot;book\\\u0026quot;.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;예매\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;việc đặt mua (vé) trước\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;시간표\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lịch chiếu, thời gian biểu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;자리\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chỗ ngồi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;평일\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ngày thường (trong tuần)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;휴일\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ngày nghỉ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;무료\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;miễn phí\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;팔리다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;được bán, bán được\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;남다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;còn lại, còn dư\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;무섭다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đáng sợ, sợ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;지루하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chán, buồn tẻ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(그럼) 지금 바로\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;(vậy thì) ngay bây giờ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;얼른 가져올게요\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi sẽ mang (cái gì đó) đến ngay\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(표)를 예매하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đặt mua (vé) trước\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;찾아보다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tìm xem, tra tìm\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;표\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vé\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;인기\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sự được yêu thích, nổi tiếng\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e나타샤 씨, 우리 화요일에 영화 볼래요?\u003cbr\u003e이번에 하는 영화를 나타샤 씨와 함께 보고 싶어요. 인기가 많은 영화라서 자리가 많이 안 남았어요. 휴일에는 자리가 없어서 평일에 봐야 해요.\u003cbr\u003e평일에 같이 영화를 볼 수 있어요? 화요일 오전에만 자리가 있어요. 다섯 자리밖에 안 남아서 빨리 예매해야 돼요.\u003cbr\u003e연락 주세요.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eNatasha ơi, thứ Ba mình đi xem phim nhé?\u003cbr\u003eMình muốn xem cùng Natasha bộ phim đang chiếu đợt này. Vì là phim được yêu thích nên không còn nhiều chỗ. Ngày nghỉ thì hết chỗ nên phải xem vào ngày thường.\u003cbr\u003eNgày thường bạn đi xem phim cùng mình được không? Chỉ có buổi sáng thứ Ba là còn chỗ. Chỉ còn năm chỗ nên phải đặt vé nhanh.\u003cbr\u003eLiên lạc cho mình nhé.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#8/ex-p120-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p120-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;나타샤 씨가 영화를 볼 수 있는 날은 언제입니까?\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Ngày Natasha có thể xem phim là khi nào?\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;목요일 오전 9시 50분\u0026quot;,\u0026quot;일요일 오후 5시 10분\u0026quot;,\u00 cspan lang=\"ko\"\u003e힘들다\u003c/span\u003e vất vả, mệt (vì việc nặng, việc khó) – 일이 많아서 힘들어요. Việc nhiều nên vất vả. · \u003cspan lang=\"ko\"\u003e행복해하다\u003c/span\u003e (người khác) thấy hạnh phúc, vui – 엄마가 행복해해요. Mẹ đang vui. · \u003cspan lang=\"ko\"\u003e기뻐하다\u003c/span\u003e (người khác) vui mừng – 슬기가 기뻐해요. Seul-gi vui lắm. · \u003cspan lang=\"ko\"\u003e슬퍼하다\u003c/span\u003e (người khác) buồn – 친구가 슬퍼해요. Bạn tôi đang buồn. · \u003cspan lang=\"ko\"\u003e무서워하다\u003c/span\u003e (người khác) sợ – 동생은 개를 무서워해요. Em tôi sợ chó. · \u003cspan lang=\"ko\"\u003e힘들어하다\u003c/span\u003e (người khác) thấy vất vả – 안젤라 씨가 요즘 힘들어해요. Dạo này Angela thấy vất vả. · \u003cspan lang=\"ko\"\u003e예매\u003c/span\u003e việc đặt mua (vé) trước · \u003cspan lang=\"ko\"\u003e(표)를 예매하다\u003c/span\u003e đặt mua (vé) trước · \u003cspan lang=\"ko\"\u003e표\u003c/span\u003e vé · \u003cspan lang=\"ko\"\u003e시간표\u003c/span\u003e lịch chiếu, thời gian biểu · \u003cspan lang=\"ko\"\u003e자리\u003c/span\u003e chỗ ngồi · \u003cspan lang=\"ko\"\u003e평일\u003c/span\u003e ngày thường (trong tuần) · \u003cspan lang=\"ko\"\u003e휴일\u003c/span\u003e ngày nghỉ · \u003cspan lang=\"ko\"\u003e무료\u003c/span\u003e miễn phí · \u003cspan lang=\"ko\"\u003e팔리다\u003c/span\u003e được bán, bán được · \u003cspan lang=\"ko\"\u003e남다\u003c/span\u003e còn lại, còn dư · \u003cspan lang=\"ko\"\u003e(그럼) 지금 바로\u003c/span\u003e (vậy thì) ngay bây giờ · \u003cspan lang=\"ko\"\u003e찾아보다\u003c/span\u003e tìm xem, tra tìm · \u003cspan lang=\"ko\"\u003e인기\u003c/span\u003e sự được yêu thích, nổi tiếng · \u003cspan lang=\"ko\"\u003e무섭다\u003c/span\u003e đáng sợ, sợ · \u003cspan lang=\"ko\"\u003e지루하다\u003c/span\u003e chán, buồn tẻ · \u003cspan lang=\"ko\"\u003e행복\u003c/span\u003e hạnh phúc · \u003cspan lang=\"ko\"\u003e기분\u003c/span\u003e tâm trạng · \u003cspan lang=\"ko\"\u003e감정\u003c/span\u003e cảm xúc\u003c/p\u003e\u003cp\u003e\u003ca href=\"/tieng-han/sach/so-cap-2/bai-07\"\u003eBài 7 · 집들이니까 세제나 휴지를 가져갈게요 →\u003c/a\u003e\u003c/p\u00 03e\u003ctd lang=\"ko\"\u003e이 영화를 볼래요?\u003c/td\u003e\u003ctd\u003eAnh có muốn xem phim này không?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMin-guk\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그러면 제가 지금 바로 예매할게요. 아, 지금 두 자리밖에 안 남았어요.\u003c/td\u003e\u003ctd\u003eVậy thì để anh đặt vé ngay bây giờ. À, bây giờ chỉ còn hai chỗ thôi.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eXiaoyu\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그러면 얼른 영화표를 예매해요!\u003c/td\u003e\u003ctd\u003eVậy thì mau đặt vé đi!\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMin-guk\u003c/td\u003e\u003ctd lang=\"ko\"\u003e알겠어요. 그럼 지금 바로 예매할게요.\u003c/td\u003e\u003ctd\u003eĐược rồi. Vậy anh đặt ngay bây giờ.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e37:T313d,\u003ch3\u003e1 · Email của Jamshid\u003c/h3\u003e\n\u003cp\u003eJamshid – bạn cùng lớp của Huyền – viết email cho một người bạn, kể cảm xúc khi mới sang Hàn Quốc và bây giờ.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e받는 사람\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e보낸 사람\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e제목\u003c/span\u003e –\nngười nhận, người gửi, tiêu đề · \u003cspan lang=\"ko\"\u003e지내다\u003c/span\u003e – sống, trải qua · \u003cspan lang=\"ko\"\u003e처음\u003c/span\u003e – lần đầu ·\n\u003cspan lang=\"ko\"\u003e이해하다\u003c/span\u003e – hiểu · \u003cspan lang=\"ko\"\u003e사귀다\u003c/span\u003e – kết bạn · \u003cspan lang=\"ko\"\u003e함께\u003c/span\u003e – cùng ·\n\u003cspan lang=\"ko\"\u003e드림\u003c/span\u003e – kính thư (cuối thư).\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;titleKo\u0026quot;:\u0026quot;한국 생활이 정말 즐거워요\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;받는 사람: 나시르\u0026lt;nasir3792@tmail.com\u0026gt;\\n보낸 사람: 잠시드\u0026lt;jamshid@tmail.com\u0026gt;\\n제목: 한국 생활이 정말 즐거워요\\n\\n나시르 씨,\\n안녕하세요?\\n요즘 어떻게 지내요?\\n저는 아주 잘 지내요. 작년에 처음 한국에 왔을 때는 정말 힘들고 외로웠어요.\\n그리고 한국 사람의 이야기를 이해하지 못해서 답답했어요.\\n하지만 지금은 좋은 친구도 많이 사귀고 한국말도 잘해요.\\n그래서 요즘은 한국 생활이 정말 즐거워요.\\n다음 달에는 친구들과 제주도로 여행을 갈 거예요. 정말 재미있겠지요?\\n다음에 나시르 씨하고도 함께 여행하고 싶어요. 우리 꼭 같이 가요.\\n그럼 다음에 또 연락할게요.\\n잠시드 드림\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Người nhận: Nasir \u0026lt;nasir3792@tmail.com\u0026gt;\\nNgười gửi: Jamshid \u0026lt;jamshid@tmail.com\u0026gt;\\nTiêu đề: Cuộc sống ở Hàn Quốc thật sự vui\\n\\nAnh Nasir,\\nXin chào.\\nDạo này anh thế nào?\\nTôi thì rất ổn. Năm ngoái lần đầu sang Hàn Quốc, tôi thật sự vất vả và cô đơn.\\nVà vì không hiểu người Hàn nói gì nên tôi rất bức bối.\\nNhưng giờ tôi đã kết được nhiều bạn tốt và nói tiếng Hàn cũng khá.\\nVì vậy dạo này cuộc sống ở Hàn Quốc thật sự vui.\\nTháng sau tôi sẽ đi du lịch đảo Jeju cùng bạn bè. Chắc là vui lắm nhỉ?\\nLần tới tôi muốn đi du lịch cùng cả anh Nasir nữa. Nhất định chúng ta cùng đi nhé.\\nVậy nhé, lần sau tôi lại liên lạc.\\nJamshid\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Khung cửa sổ email trên trình duyệt (nền xanh nhạt): ô người nhận, người gửi, tiêu đề và nội dung thư.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;기분이 좋다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tâm trạng tốt, vui\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;기쁘다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vui mừng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;행복하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hạnh phúc\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;신나다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phấn khích, hào hứng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;반갑다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vui mừng (khi gặp ai), mừng gặp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;즐겁다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vui vẻ, thú vị\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;기분이 안 좋다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tâm trạng không tốt, không vui\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;슬프다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;buồn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;외롭다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cô đơn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;화나다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tức giận\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;걱정되다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lo lắng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;짜증나다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bực mình, khó chịu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;답답하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bức bối, ngột ngạt (vì không hiểu / không được hiểu)\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e한국 생활이 정말 즐거워요\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e받는 사람: 나시르\u0026lt;nasir3792@tmail.com\u0026gt;\u003cbr\u003e보낸 사람: 잠시드\u0026lt;jamshid@tmail.com\u0026gt;\u003cbr\u003e제목: 한국 생활이 정말 즐거워요\u003cbr\u003e\u003cbr\u003e나시르 씨,\u003cbr\u003e안녕하세요?\u003cbr\u003e요즘 어떻게 지내요?\u003cbr\u003e저는 아주 잘 지내요. 작년에 처음 한국에 왔을 때는 정말 힘들고 외로웠어요.\u003cbr\u003e그리고 한국 사람의 이야기를 이해하지 못해서 답답했어요.\u003cbr\u003e하지만 지금은 좋은 친구도 많이 사귀고 한국말도 잘해요.\u003cbr\u003e그래서 요즘은 한국 생활이 정말 즐거워요.\u003cbr\u003e다음 달에는 친구들과 제주도로 여행을 갈 거예요. 정말 재미있겠지요?\u003cbr\u003e다음에 나시르 씨하고도 함께 여행하고 싶어요. 우리 꼭 같이 가요.\u003cbr\u003e그럼 다음에 또 연락할게요.\u003cbr\u003e잠시드 드림\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eNgười nhận: Nasir \u0026lt;nasir3792@tmail.com\u0026gt;\u003cbr\u003eNgười gửi: Jamshid \u0026lt;jamshid@tmail.com\u0026gt;\u003cbr\u003eTiêu đề: Cuộc sống ở Hàn Quốc thật sự vui\u003cbr\u003e\u003cbr\u003eAnh Nasir,\u003cbr\u003eXin chào.\u003cbr\u003eDạo này anh thế nào?\u003cbr\u003eTôi thì rất ổn. Năm ngoái lần đầu sang Hàn Quốc, tôi thật sự vất vả và cô đơn.\u003cbr\u003eVà vì không hiểu người Hàn nói gì nên tôi rất bức bối.\u003cbr\u003eNhưng giờ tôi đã kết được nhiều bạn tốt và nói tiếng Hàn cũng khá.\u003cbr\u003eVì vậy dạo này cuộc sống ở Hàn Quốc thật sự vui.\u003cbr\u003eTháng sau tôi sẽ đi du lịch đảo Jeju cùng bạn bè. Chắc là vui lắm nhỉ?\u003cbr\u003eLần tới tôi muốn đi du lịch cùng cả anh Nasir nữa. Nhất định chúng ta cùng đi nhé.\u003cbr\u003eVậy nhé, lần sau tôi lại liên lạc.\u003cbr\u003eJamshid\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#6/ex-p69-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p69-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기 1\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;다음 글을 읽고 질문에 답해 보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đọc bài và trả lời câu hỏi.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;잠시드 씨는 처음 한국에 왔을 때 어땠어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Khi lần đầu đến Hàn Quốc, Jamshid thấy thế nào?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;정말 힘들고 외로웠어요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;정말 힘들고 외로웠어요.\u0026quot;,\u0026quot;정말 즐겁고 신났어요.\u0026quot;,\u0026quot;좀 지루했어요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;잠시드 씨는 요즘 생활이 어때요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Dạo này cuộc sống của Jamshid thế nào?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;정말 즐거워요.\u0026quot;],\u0026quot;options\u0026quot;:[\
