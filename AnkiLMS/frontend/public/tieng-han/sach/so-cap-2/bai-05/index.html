hé?</li><li><span lang="ko">아니요, 내가 갈게요!</span> – Không, để em đi!</li></ul><p><em>Hiệu thuốc đầu phố còn sáng đèn. Huyền hít một hơi rồi nói.</em></p><ul><li><span lang="ko">아이가 열이 나고 기침을 해요.</span> – Con tôi bị sốt và ho.</li><li><span lang="ko">여덟 살이에요.</span> – Cháu tám tuổi.</li></ul><p><em>Dược sĩ đặt hai chai thuốc lên quầy: một chai siro ho, một chai thuốc hạ sốt.</em></p><ul><li><span lang="ko">하루에 세 번, 잘 흔들어서 아이에게 주세요.</span> – Ngày ba lần, lắc đều rồi cho cháu uống.</li><li><span lang="ko">열이 많이 나면 이 약도 주세요.</span> – Nếu sốt cao thì cho cháu uống thêm thuốc này.</li></ul><p><em>Về nhà, Seul-gi uống thuốc xong, mắt liếc về que kem vừa lấy trong tủ lạnh ra, đặt trên bàn.</em></p><ul><li><span lang="ko">엄마, 아이스크림 먹어도 돼?</span> – Mẹ ơi, con ăn kem được không?</li><li><span lang="ko">아니, 아이스크림을 먹으면 안 돼. 목에 안 좋아.</span> – Không, ăn kem không được đâu. Không tốt cho họng.</li></ul><p><em>Seul-gi chui lại vào chăn. Huyền đứng nhìn con, khẽ nói.</em></p><ul><li><span lang="ko">빨리 나으면 좋겠어.</span> – Mong con mau khỏi.</li></ul><p><em>Đau ở đâu, uống thuốc thế nào, được và không được làm gì – học xong bài này, bạn tự mua thuốc được.</em></p></div></figure></div></div><div class="v2-body mt-8"><div data-sach-page="mo-bai" class="sach-prose prose max-w-none"><p>Ba việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.</p>

03c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아니요, 내가 갈게요!\u003c/span\u003e – Không, để em đi!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eHiệu thuốc đầu phố còn sáng đèn. Huyền hít một hơi rồi nói.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아이가 열이 나고 기침을 해요.\u003c/span\u003e – Con tôi bị sốt và ho.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e여덟 살이에요.\u003c/span\u003e – Cháu tám tuổi.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eDược sĩ đặt hai chai thuốc lên quầy: một chai siro ho, một chai thuốc hạ sốt.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e하루에 세 번, 잘 흔들어서 아이에게 주세요.\u003c/span\u003e – Ngày ba lần, lắc đều rồi cho cháu uống.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e열이 많이 나면 이 약도 주세요.\u003c/span\u003e – Nếu sốt cao thì cho cháu uống thêm thuốc này.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eVề nhà, Seul-gi uống thuốc xong, mắt liếc về que kem vừa lấy trong tủ lạnh ra, đặt trên bàn.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e엄마, 아이스크림 먹어도 돼?\u003c/span\u003e – Mẹ ơi, con ăn kem được không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아니, 아이스크림을 먹으면 안 돼. 목에 안 좋아.\u003c/span\u003e – Không, ăn kem không được đâu. Không tốt cho họng.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eSeul-gi chui lại vào chăn. Huyền đứng nhìn con, khẽ nói.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e빨리 나으면 좋겠어.\u003c/span\u003e – Mong con mau khỏi.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eĐau ở đâu, uống thuốc thế nào, được và không được làm gì – học xong bài này, bạn tự mua thuốc được.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eBa việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"nhiem-vu\" data-props=\"{\ \u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e식사를 규칙적으로 하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eăn uống đúng giờ, đều đặn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e운동을 꾸준히 하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etập thể dục đều đặn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e잠이 부족하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ethiếu ngủ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e편식이 심하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ekén ăn, ăn uống thiên lệch nặng\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e식사가 불규칙하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eăn uống thất thường, không đúng giờ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e운동을 거의 하지 않다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ehầu như không tập thể dục\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e안색이 안 좋다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003esắc mặt không tốt \u003csmall\u003e(nhan sắc)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e힘(기운)이 없다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ekhông có sức, uể oải\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e입맛이 없다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003echán ăn, không thấy ngon miệng\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e어지럽다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003echóng mặt\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e몸살이 나다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ebị đau mỏi khắp người (cảm mệt rã rời)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e소화가 안 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ekhó tiêu, bụng không tiêu \u003csmall\u003e(tiêu hoá)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e불면증\u003c/span\u003e\u003c/td\u003e\u003ctd\u003echứng mất ngủ \u003csmall\u003e(bất miên chứng)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e몸에 좋다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etốt cho cơ thể, tốt cho sức khoẻ – 운동은 몸에 좋아요. Tập thể dục tốt cho cơ thể.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e몸에 안 좋다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ekhông tốt cho cơ thể – 담배는 몸에 안 좋아요. Thuốc lá không tốt cho cơ thể.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e담배\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ethuốc lá\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e아이스크림\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ekem (que kem, kem cốc)\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e\u003caside class=\"sach-callout\" data-callout=\"meo\" role=\"note\" aria-label=\"Mẹo\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eMẹo\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e에\u003c/span\u003e sau một khoảng thời gian nghĩa là \u0026quot;mỗi\u0026quot;: \u003cspan lang=\"ko\"\u003e하루에 세 번\u003c/span\u003e –\nngày ba lần, \u003cspan lang=\"ko\"\u003e한 달에 한 번\u003c/span\u003e – tháng một lần. Còn \u003cspan lang=\"ko\"\u003eN에 좋다 / 안 좋다\u003c/span\u003e là\n\u0026quot;tốt / không tốt cho N\u0026quot;: \u003cspan lang=\"ko\"\u003e생강차는 감기에 좋아요\u003c/span\u003e (trà gừng tốt cho bệnh cảm),\n\u003cspan lang=\"ko\"\u003e아이스크림은 목에 안 좋아요\u003c/span\u003e (kem không tốt cho họng).\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n2c:Ta24,\u003cp\u003e\u003cspan lang=\"ko\"\u003e약\u003c/span\u003e đọc là \u003cem\u003edược\u003c/em\u003e – thuốc: \u003cspan l =\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eumyeon\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-(으)면\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;앞 내용이 뒤 내용의 조건이나 가정이 될 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;nếu… thì…\\\u0026quot;: vế trước là điều kiện hoặc giả định cho vế sau. Gắn sau động từ / tính từ: thân có patchim (phụ âm cuối) + -으면; không có patchim hoặc patchim ㄹ + -면 (만들다 → 만들면).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-으면 (받침 O)\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹으면\u0026quot;],[\u0026quot;-으면 (받침 O)\u0026quot;,\u0026quot;있다\u0026quot;,\u0026quot;있으면\u0026quot;],[\u0026quot;-면 (받침 X)\u0026quot;,\u0026quot;다치다\u0026quot;,\u0026quot;다치면\u0026quot;],[\u0026quot;-면 (ㄹ 받침 ★)\u0026quot;,\u0026quot;만들다\u0026quot;,\u0026quot;만들면\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 머리가 아프고 열이 나요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Tôi đau đầu và bị sốt.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 많이 아프면 병원에 가 보세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Nếu đau nhiều thì đi khám xem.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 주말에 뭐 할 거예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Cuối tuần bạn sẽ làm gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 날씨가 좋으면 공원에 갈 거예요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Trời đẹp thì tôi sẽ đi công viên.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Hai phụ nữ ngồi ở bàn: cô bên trái tóc đen dài, đeo kính, áo khoác xanh đen, gục người, tay ôm trán mệt mỏi; cô bên phải tóc nâu ngắn, áo sơ mi caro đỏ, đặt tay lên vai bạn lo lắng. Bong bóng thoại: 「머리가 아프고 열이 나요.」 – 「많이 아프면 병원에 가 보세요.」\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Nếu … thì …\\\u0026quot; – vế có -(으)면 là điều kiện; vế sau là việc sẽ xảy ra hoặc lời khuyên.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-으면\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹으면\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;있으면\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;좋다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;좋으면\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-면\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;아프다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;아프면\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가면\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;마시다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;마시면\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-면\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;놀다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;놀면\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만들면\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㅂ: ㅂ đổi thành 우, rồi thêm 면\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;춥다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;추우면\u0026quot;}]},{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄷ (듣다, 걷다): ㄷ đổi thành ㄹ, rồi thêm 으면\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;들으면\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;걷다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;걸으면\u0026quot;}]},{\u0026quot;luat\u0026q n lang=\"ko\"\u003e-으면\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹으면\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e있으면\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e좋다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e좋으면\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-면\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e아프다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e아프면\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e가다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e가면\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e마시다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e마시면\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-면\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e놀다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e놀면\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들면\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 머리가 아프고 열이 나요.\u003c/span\u003e – A: Tôi đau đầu và bị sốt.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 많이 아프면 병원에 가 보세요.\u003c/span\u003e – B: Nếu đau nhiều thì đi khám xem.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 주말에 뭐 할 거예요?\u003c/span\u003e – A: Cuối tuần bạn sẽ làm gì?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 날씨가 좋으면 공원에 갈 거예요.\u003c/span\u003e – B: Trời đẹp thì tôi sẽ đi công viên.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003caside class=\"sach-callout\" data-callout=\"meo\" role=\"note\" aria-label=\"Mẹo\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eMẹo\u003c/p\u003e\u003cp\u003eㅅ của \u003cspan lang=\"ko\"\u003e낫다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e짓다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e붓다\u003c/span\u003e cũng rơi trước\n\u003cspan lang=\"ko\"\u003e-아요/어요\u003c/span\u003e: \u003cspan lang=\"ko\"\u003e나아요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e나았어요\u003c/span\u003e,\n\u003cspan lang=\"ko\"\u003e지어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e부어요\u003c/span\u003e. Gặp phụ âm thì giữ: \u003cspan lang=\"ko\"\u003e낫고\u003c/span\u003e,\n\u003cspan lang=\"ko\"\u003e낫지만\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cp\u003eThử ngay: gốc có patchim hay không? Xếp mỗi từ vào đúng ô – nhớ \u003cspan lang=\"ko\"\u003eㄹ\u003c/span\u003e và\n\u003cspan lang=\"ko\"\u003eㅅ\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-05/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;으면\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;면\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;không patchim / patchim ㄹ\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;마시다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;낫다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;놀다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;붓다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;쉬다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;아프다\u0026quot;,\u0026quot;o\u0026quot;:1}],\u0026quot;luat\u0026quot;:\u0026quot;goc\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e마시다 · 있다 · 가다 · 낫다 · 만들다 · 먹다 · 놀다 · 붓다 · 쉬다 · 아프다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e으면\u003c/span\u003e – gốc có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e면\u003c/span\u003e – không patchim / patchim ㄹ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e-(으)면 좋겠다\u003c/span\u003e – “mong là …”\u003c/h3\u003e\n\u003cp\u003e\u003cspan lang=\"ko\"\u003e빨리 나으면 좋겠어요.\u003c/span\u003e – Mong bạn mau khỏi.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eumyeon-jokgetda\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-(으)면 좋겠다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;희망을 말할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;ước gì…, mong là…, giá mà… thì tốt\\\u0026quot;: gắn sau động từ / tính từ để nói điều mình mong muốn. Gốc có patchim + -으면 좋겠다; không có patchim + -면 좋겠다.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-으면 좋겠다 (받침 O)\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹으면 좋겠다\u0026quot;],[\u0026quot;-으면 좋겠다 (받침 O)\u0026quot;,\u0026quot;작다\u0026quot;,\u0026quot;작으면 좋겠다\u0026quot;],[\u0026quot;-면 좋겠다 (받침 X)\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;가면 좋겠다\u0026quot;],[\u0026quot;-면 좋겠다 (받침 X)\u0026quot;,\u0026quot;건강하다\u0026quot;,\u0026quot;건강하면 좋겠다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;빨리 나으면 좋겠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mong bạn mau khỏi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;잠을 충분히 자면 좋겠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Giá mà được ngủ đủ giấc thì tốt.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;우리 딸이 일찍 일어나면 좋겠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mong con gái tôi dậy sớm.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이 옷이 조금 더 작으면 좋겠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Giá mà cái áo này nhỏ hơn một chút.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong cửa hàng quần áo (giá treo áo, gương): nữ nhân viên tóc búi, áo sơ mi trắng, tạp dề xám hỏi \\\u0026quot;이 옷은 어떠세요?\\\u0026quot;; khách nam đeo kính, sơ mi xanh nhạt cầm chiếc áo len trắng có sọc đỏ xanh, cười đáp \\\u0026quot;디자인은 마음에 드는데 조금 작으면 좋겠어요.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Mong là …, giá mà … thì tốt\\\u0026quot; – -(으)면 + 좋겠다, nói điều mình mong.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-으면 좋겠다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;작다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;작으면 좋겠다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;좋다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;좋으면 좋겠다\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim hoặc có ㄹ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-면 좋겠다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;자다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;자면 좋겠다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;일어나다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;일어나면 좋겠다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;놀다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;놀면 좋겠다\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㅅ: ㅅ rơi, rồi thêm 으면 좋겠다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;낫다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;나으면 좋겠다\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-(으)면 좋겠다\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói điều mình mong – mềm, nói được với cả người lớn tuổi lẫn bạn bè\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;빨리 나으면 좋겠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mong bạn mau khỏi.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-(으)세요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;chúc thẳng (Quyển 1)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;빨리 나으세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mau khỏi nhé.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;빨리 낫으면 좋겠어요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;빨리 나으면 좋겠어요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;ㅅ của 낫다 rơi khi gặp 으.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-(으)면 좋겠다\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Mong là …, giá mà … thì tốt\u0026quot; – -(으)면 + 좋겠다, nói điều mình mong.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-으면 좋겠다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e작다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e작으면 좋겠다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e좋다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e좋으면 좋겠다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim hoặc có ㄹ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-면 좋겠다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e자다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e자면 좋겠다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e일어나다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e일어나면 좋겠다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e놀다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e놀면 좋겠다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e빨리 나으면 좋겠어요.\u003c/span\u003e – Mong bạn mau khỏi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e잠을 충분히 자면 좋겠어요.\u003c/span\u003e – Giá mà được ngủ đủ giấc thì tốt.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e우리 딸이 일찍 일어나면 좋겠어요.\u003c/span\u003e – Mong con gái tôi dậy sớm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 옷이 조금 더 작으면 좋겠어요.\u003c/span\u003e – Giá mà cái áo này nhỏ hơn một chút.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e2e:T1b47,"])</script><script>self.__next_f.push([1,"\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eoseo-order\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-아서/어서\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;서로 관련이 있는 두 행동이 시간적으로 이어서 일어남을 말할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;(làm A) rồi (làm B)\\\u0026quot;: hai hành động liên quan với nhau xảy ra nối tiếp về thời gian, thường cùng nơi chốn / đối tượng (가서 사다: đi đến đó rồi mua; 만나서 보다: gặp rồi cùng xem). Gắn sau động từ: nguyên âm ㅏ/ㅗ + -아서; nguyên âm khác + -어서; 하다 → 해서. Khác -어서 chỉ nguyên nhân.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-아서 (ㅏ, ㅗ)\u0026quot;,\u0026quot;오다\u0026quot;,\u0026quot;와서\u0026quot;],[\u0026quot;-아서 (ㅏ, ㅗ)\u0026quot;,\u0026quot;만나다\u0026quot;,\u0026quot;만나서\u0026quot;],[\u0026quot;-어서 (ㅏ, ㅗ 외)\u0026quot;,\u0026quot;만들다\u0026quot;,\u0026quot;만들어서\u0026quot;],[\u0026quot;-어서 (ㅏ, ㅗ 외)\u0026quot;,\u0026quot;기다리다\u0026quot;,\u0026quot;기다려서\u0026quot;],[\u0026quot;-해서 (하다)\u0026quot;,\u0026quot;공부하다\u0026quot;,\u0026quot;공부해서\u0026quot;],[\u0026quot;-해서 (하다)\u0026quot;,\u0026quot;운동하다\u0026quot;,\u0026quot;운동해서\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;약국에 가서 감기약을 샀어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đến hiệu thuốc rồi mua thuốc cảm.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;친구를 만나서 같이 영화를 봤어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi gặp bạn rồi cùng đi xem phim.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저는 집에서 요리해서 먹어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi tự nấu ở nhà rồi ăn.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;잘 흔들어서 아이에게 주세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Lắc đều rồi cho cháu uống.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong bếp tường tím treo hai khung tranh lá cây: cô gái tóc buộc đuôi ngựa, áo xanh rêu, ngồi trên ghế, tay ôm ngực mặt mệt mỏi; chàng trai đeo kính áo sơ mi xanh nhạt cúi xuống, tay đặt lên vai cô lo lắng. Bong bóng thoại: 「아침부터 소화가 잘 안 돼요.」 – 「약국에 가서 소화제를 사 올게요.」\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;(Làm A) rồi (làm B)\\\u0026quot; – việc sau làm tiếp ở chỗ vừa đến, với người, đồ vật của việc trước.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối của gốc là ㅏ hoặc ㅗ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-아서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;앉다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;앉아서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;찾다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;찾아서\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-어서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만들어서\u0026quot;},{\ 26quot;:\u0026quot;hai việc không dính nhau, chỉ kể thứ tự\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;밥을 먹고 약을 먹어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi ăn cơm rồi uống thuốc.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-아서/어서 (vì)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;lý do – cùng dạng, đã học ở Quyển 1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;머리가 아파서 약을 먹었어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vì đau đầu nên tôi uống thuốc.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;약국에 갔어서 약을 샀어요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;약국에 가서 약을 샀어요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Thì quá khứ chỉ đặt ở cuối câu.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;만들아서\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;만들어서\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Nguyên âm của 들 là ㅡ, không phải ㅏ, ㅗ → 어서.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-아서/어서\u003c/span\u003e\u003c/strong\u003e: \u0026quot;(Làm A) rồi (làm B)\u0026quot; – việc sau làm tiếp ở chỗ vừa đến, với người, đồ vật của việc trước.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối của gốc là ㅏ hoặc ㅗ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-아서\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e앉다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e앉아서\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e찾다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찾아서\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-어서\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들어서\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e흔들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e흔들어서\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e씻다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e씻어서\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc là 하다\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e해서\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e요리하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e요리해서\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e공부하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e공부해서\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e약국에 가서 감기약을 샀어요.\u003c/span\u003e – Tôi đến hiệu thuốc rồi mua thuốc cảm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e친구를 만나서 같이 영화를 봤어요.\u003c/span\u003e – Tôi gặp bạn rồi cùng đi xem phim.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저는 집에서 요리해서 먹어요.\u003c/span\u003e – Tôi tự nấu ở nhà rồi ăn.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e잘 흔들어서 아이에게 주세요.\u003c/span\u003e – Lắc đều rồi cho cháu uống.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e2f:T2a04,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eodo-doeda\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-아도/어도 되다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;어떤 행위나 상태를 허락하거나 허용함을 나타낼 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;… cũng được\\\u0026quot;, \\\u0026quot;… có được không?\\\u0026quot;: gắn sau động từ để xin phép hoặc cho phép làm việc gì. Gốc có nguyên âm ㅏ/ㅗ + -아도 되다; nguyên âm khác + -어도 되다; 하다 → 해도 되다. Câu hỏi xin phép: -어도 돼요? Khi trả lời phủ định (không được) thì dùng -(으)면 안 되다.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-아도 되다\u0026quot;,\u0026quot;받다\u0026quot;,\u0026quot;받아도 되다\u0026quot;],[\u0026quot;-아도 되다\u0026quot;,\u0026quot;오다\u0026quot;, cspan lang=\"ko\"\u003e-아도 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e앉다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e앉아도 되다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e받다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e받아도 되다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-어도 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹어도 되다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e입다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e입어도 되다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc là 하다\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e해도 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e운동하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e운동해도 되다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e전화하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e전화해도 되다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKhông được – gốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-으면 안 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹으면 안 되다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e찍다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찍으면 안 되다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKhông được – gốc không có patchim hoặc có ㄹ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-면 안 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e마시다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e마시면 안 되다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e놀다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e놀면 안 되다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 커피를 마셔도 돼요?\u003c/span\u003e – A: Tôi uống cà phê được không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 네, 마셔도 돼요.\u003c/span\u003e – B: Vâng, uống được.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 이 약을 먹고 운동해도 돼요?\u003c/span\u003e – A: Uống thuốc này rồi tập thể dục được không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 아니요, 오늘은 운동하면 안 돼요.\u003c/span\u003e – B: Không, hôm nay không được tập.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 이 옷 입어 봐도 돼요?\u003c/span\u003e – A: Tôi mặc thử bộ này được không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 네, 입어 보세요.\u003c/span\u003e – B: Vâng, chị cứ mặc thử.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eVới người nhà thì bỏ \u003cspan lang=\"ko\"\u003e요\u003c/span\u003e, như Seul-gi: \u003cspan lang=\"ko\"\u003e먹어도 돼?\u003c/span\u003e –\n\u003cspan lang=\"ko\"\u003e아니, 먹으면 안 돼.\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eThử ngay: Seul-gi đang uống thuốc cảm. Việc nào mẹ cho làm, việc nào không? Xếp mỗi việc vào đúng ô.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-05/xep-cho-2\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;해도 돼\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;được – cứ làm\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;하면 안 돼\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;không được làm\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;아이스크림을 먹다\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Kem lạnh không tốt cho cổ họng đang đau.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;밥을 먹고 약을 먹다\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Ăn rồi mới uống thuốc cho đỡ hại bụng.\u0026quot  thuốc mua ở \u003cspan lang=\"ko\"\u003e약국\u003c/span\u003e. Cửa hàng tiện lợi\n(\u003cspan lang=\"ko\"\u003e편의점\u003c/span\u003e) cũng bán vài loại thông dụng: thuốc hạ sốt, giảm đau, thuốc tiêu hoá, thuốc cảm, miếng dán.\nNhiều loại thuốc phải có đơn của bác sĩ (\u003cspan lang=\"ko\"\u003e처방전\u003c/span\u003e): khám ở \u003cspan lang=\"ko\"\u003e병원\u003c/span\u003e trước, rồi mang\nđơn ra hiệu thuốc để dược sĩ bốc thuốc – \u003cspan lang=\"ko\"\u003e약을 지어요\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNhà thuốc trực ngày nghỉ.\u003c/strong\u003e Chủ nhật, ngày lễ cần thuốc thì tìm \u003cspan lang=\"ko\"\u003e휴일지킴이 약국\u003c/span\u003e – hiệu thuốc mở\ncửa cả ngày nghỉ. Vào trang web của các nhà thuốc này, chọn khu mình ở trên bản đồ là thấy hiệu thuốc đang mở, kèm thông\ntin về thuốc mình cần.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBài thuốc dân gian.\u003c/strong\u003e Người Hàn có nhiều cách chữa bệnh không cần thuốc (\u003cspan lang=\"ko\"\u003e민간요법\u003c/span\u003e). Con khó\ntiêu, mẹ lấy tay xoa bụng cho con – bàn tay ấy gọi là \u003cspan lang=\"ko\"\u003e약손\u003c/span\u003e, \u0026quot;bàn tay thuốc\u0026quot;. Ho nhiều thì nấu lê\n(\u003cspan lang=\"ko\"\u003e배\u003c/span\u003e – đồng âm với \u003cspan lang=\"ko\"\u003e배\u003c/span\u003e \u0026quot;bụng\u0026quot;) ăn cho đỡ ho; hôm sau ngày uống nhiều rượu thì ăn canh giá đỗ\n(\u003cspan lang=\"ko\"\u003e콩나물국\u003c/span\u003e). Có cách chưa có cơ sở khoa học, có cách đã được y học chứng minh.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eThuốc ở hiệu thuốc thường đựng trong túi giấy có ghi cách dùng: ngày mấy lần, sáng – trưa – tối, trước\nhay sau bữa ăn (\u003cspan lang=\"ko\"\u003e식전\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e식후\u003c/span\u003e). Đọc kỹ trước khi uống, chưa rõ thì hỏi lại\ndược sĩ.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eMua thuốc ở hiệu thuốc\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu khi mua thuốc.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-05/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;어디가 아프세요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Anh / chị đau ở đâu ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;목이 아프고 콧물이 나요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đau họng và sổ mũi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;그럼 이 감기약을 드세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vậy anh / chị uống thuốc cảm này nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이 약은 어떻게 먹어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Thuốc này uống thế nào ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;하루에 세 번, 식후에 드세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày ba lần, sau bữa ăn.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;술을 마셔도 돼요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi uống rượu được không?\u0026quot;}],\u0026quot;names\u0026quot;:[]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e어디가 아프세요?\u003c/span\u003e – Anh / chị đau ở đâu ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e목이 아프고 콧물이 나요.\u003c/span\u003e – Tôi đau họng và sổ mũi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e그럼 이 감기약을 드세요.\u003c/span\u003e – Vậy anh / chị uống thuốc cảm này nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 약은 어떻게 먹어요?\u003c/span\u003e – Thuốc này uống thế nào ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e하루에 세 번, 식후에 드세요.\u003c/span\u003e – Ngày ba lần, sau bữa ăn.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e술을 마셔도 돼요?\u003c/span\u003e – Tôi uống rượu được không?\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/fig
