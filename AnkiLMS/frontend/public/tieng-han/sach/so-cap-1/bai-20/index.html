"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eun-hue\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)ㄴ 후에\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;동사에 붙어 어떤 행위를 시간적으로 먼저 한 다음에 뒤의 행위를 함을 나타냅니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-은/ㄴ 후에 – \\\u0026quot;sau khi …\\\u0026quot;: gắn sau động từ, cho biết làm việc trước rồi mới làm việc sau. Gốc có 받침 + -은 후에; không có 받침 + -ㄴ 후에; gốc tận cùng ㄹ thì bỏ ㄹ + -ㄴ 후에.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹은 후에\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;배우다\u0026quot;,\u0026quot;배운 후에\u0026quot;],[\u0026quot;ㄹ 받침\u0026quot;,\u0026quot;만들다\u0026quot;,\u0026quot;만든 후에\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 감기에 걸려서 머리가 너무 아파요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Tôi bị cảm nên đau đầu quá.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 집에 가서 약을 먹은 후에 푹 쉬세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Về nhà uống thuốc xong rồi nghỉ ngơi cho khỏe nhé.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Cô gái quấn chăn vàng ngồi trên đệm xanh, tay ôm đầu đau, trên đầu có túi chườm đá; bên cạnh có cốc nước và điện thoại.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Sau khi …\\\u0026quot; – làm xong việc trước rồi mới làm việc sau; tiếng Việt \\\u0026quot;sau khi\\\u0026quot; đứng trước động từ, tiếng Hàn gắn (으)ㄴ 후에 sau gốc.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;은 후에\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹은 후에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;읽은 \\u0026quot;Sau khi\\\u0026quot; dùng (으)ㄴ – 는 là của 는 것.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;만들은 후에\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;만든 후에\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Gốc có patchim ㄹ: bỏ ㄹ rồi thêm ㄴ 후에.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;퇴근하은 후에\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;퇴근한 후에\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;하다 không có patchim – thêm ㄴ: 한 후에.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-(으)ㄴ 후에\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Sau khi …\u0026quot; – làm xong việc trước rồi mới làm việc sau; tiếng Việt \u0026quot;sau khi\u0026quot; đứng trước động từ, tiếng Hàn gắn (으)ㄴ 후에 sau gốc.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e은 후에\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹은 후에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽은 후에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e받다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e받은 후에\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim (kể cả 하다)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㄴ 후에\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e배우다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e배운 후에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e마시다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e마신 후에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e운동하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e운동한 후에\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ: bỏ ㄹ rồi thêm ㄴ 후에\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㄴ 후에\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만든 후에\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 감기에 걸려서 머리가 너무 아파요.\u003c/span\u003e – A: Tôi bị cảm nên đau đầu quá.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 집에 가서 약을 먹은 후에 푹 쉬세요.\u003c/span\u003e – B: Về nhà uống thuốc xong rồi nghỉ ngơi cho khỏe nhé.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eCùng nghĩa còn có \u003cspan lang=\"ko\"\u003e-(으)ㄴ 다음에\u003c/span\u003e: \u003cspan lang=\"ko\"\u003e청소를 한 다음에 쉬어요\u003c/span\u003e – dọn dẹp\nxong rồi nghỉ.\u003c/p\u003e\n\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e-는 것이 좋아요\u003c/span\u003e – “Nên …”\u003c/h3\u003e\n\u003cp\u003eMột mẫu hay dùng khi khuyên người ốm: \u003cspan lang=\"ko\"\u003e생강차를 마시는 것이 좋아요\u003c/span\u003e – bạn nên uống trà gừng.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;neun-geot\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-는 것\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;동사를 주어나 목적어 등으로 사용하기 위해서 명사로 만들 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Biến động từ thành danh từ (\\\u0026quot;việc làm…\\\u0026quot;) để làm chủ ngữ hay tân ngữ. Gắn -는 것 vào thân động từ; hay dùng -는 것이 좋아요 để khuyên \\\u0026quot;nên làm…\\\u0026quot;.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-는 것\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹는 것\u0026quot;],[\u0026quot;-는 것\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;가는 것\u0026quot;],[\u0026quot;-는 것\u0026quot;,\u0026quot;쉬다\u0026quot;,\u0026quot;쉬는 것\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;선생님, 오늘 배가 아파서 학교에 못 가요. 약을 먹었지만 계속 아파요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cô ơi, hôm nay em đau bụng nên không đến trường được. Em đã uống thuốc nhưng vẫn đau.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;그래요? 그러면 빨리 병원에 가는 것이 좋아요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vậy à? Thế thì em nên đi bệnh viện ngay.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 잠시드 씨, 노래방에 안 가요?\\n나: 네, 저는 노래 부르는 것을 안 좋아해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Anh Jamshid không đi karaoke à?\\nB: Vâng, tôi không thích hát.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;잘 먹는 것이 건강에 좋아요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ăn uống đầy đủ thì tốt cho sức khoẻ.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Hai khung: cô gái tóc buộc, mặt ửng đỏ, khoác áo đỏ, áp điện thoại gọi, tay che miệng ho; cô giáo tóc ngắn đeo kính ngồi trước máy tính nghe điện thoại.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Việc …\\\u0026quot; – biến động từ thành danh từ; -는 것이 좋아요 là lời khuyên \\\u0026quot;nên …\\\u0026quot;.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có hay không có patchim (trừ patchim ㄹ)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;는 것\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹는 것\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가는 것\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;마시다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;마시는 것\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;쉬다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;쉬는 것\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ: bỏ ㄹ rồi thêm 는 것\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;는 것\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만드는 것\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;살다\u0026quot;,\u0026quot;dang\u0 n\u003e mua; kháng sinh phải có đơn. Túi thuốc ghi giờ uống, hay gặp nhất là\n\u003cspan lang=\"ko\"\u003e식후 30분\u003c/span\u003e – uống sau bữa ăn 30 phút. Đêm khuya, cửa hàng tiện lợi có thuốc hạ sốt, thuốc tiêu\nhoá.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBảo hiểm và cấp cứu.\u003c/strong\u003e Người nước ngoài ở Hàn từ sáu tháng trở lên phải tham gia bảo hiểm y tế\n\u003cspan lang=\"ko\"\u003e건강보험\u003c/span\u003e; người có visa kết hôn (F-6) tham gia ngay từ khi nhập cảnh. Đi khám nhớ mang thẻ người nước ngoài. Cấp cứu, xe cứu thương thì gọi 119.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eỐm không đi làm được thì báo công ty sớm, trước giờ làm – nhắn hoặc gọi cho trưởng phòng:\n\u003cspan lang=\"ko\"\u003e오늘 아파서 회사에 못 가요\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eMua thuốc ở hiệu thuốc\u003c/h3\u003e\n\u003cp\u003eYi Ling đau đầu nên ghé hiệu thuốc. Nghe từng câu rồi nói theo.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;step1#16/d-listen-1/noi-theo\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;어서 오세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Xin mời vào.\u0026quot;,\u0026quot;start\u0026quot;:12.45,\u0026quot;end\u0026quot;:13.35},{\u0026quot;ko\u0026quot;:\u0026quot;어떻게 오셨어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chị cần gì ạ?\u0026quot;,\u0026quot;start\u0026quot;:14.11,\u0026quot;end\u0026quot;:15.17},{\u0026quot;ko\u0026quot;:\u0026quot;머리가 아파서 왔어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi bị đau đầu nên đến đây.\u0026quot;,\u0026quot;start\u0026quot;:16.12,\u0026quot;end\u0026quot;:18.01},{\u0026quot;ko\u0026quot;:\u0026quot;목도 아프세요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chị có đau
