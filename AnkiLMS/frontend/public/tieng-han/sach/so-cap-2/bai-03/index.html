u0026quot;:[[\u0026quot;이나\u0026quot;,\u0026quot;샌들\u0026quot;,\u0026quot;샌들이나 슬리퍼\u0026quot;],[\u0026quot;이나\u0026quot;,\u0026quot;가방\u0026quot;,\u0026quot;가방이나 모자\u0026quot;],[\u0026quot;나\u0026quot;,\u0026quot;커피\u0026quot;,\u0026quot;커피나 주스\u0026quot;],[\u0026quot;나\u0026quot;,\u0026quot;운동화\u0026quot;,\u0026quot;운동화나 구두\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 친구 생일이 다음 달이에요. 무슨 선물이 좋아요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Sinh nhật bạn tôi vào tháng sau. Quà gì thì được nhỉ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 옷이나 모자를 사 주세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Bạn mua quần áo hoặc mũ tặng bạn ấy đi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 저는 매운 음식을 잘 못 먹어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Tôi không ăn cay được.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 그럼 삼계탕이나 냉면을 드세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Vậy anh / chị ăn gà tần sâm hoặc mì lạnh nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저는 버스나 지하철을 타고 회사에 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi làm bằng xe buýt hoặc tàu điện ngầm.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong cửa hàng quần áo, chàng trai tóc đen mặc sơ mi kẻ sọc tím hỏi \\\u0026quot;친구 생일이 다음 달이에요. 무슨 선물이 좋아요?\\\u0026quot;; cô gái tóc dài đeo kính, vest xanh đen chỉ vào giá treo áo nhiều màu đáp \\\u0026quot;옷이나 액세서리를 사 주세요.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;Nối hai món (danh từ) = \\\u0026quot;… hoặc …, … hay …\\\u0026quot; – chọn một trong hai.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;이나\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;샌들\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;샌들이나\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;정장\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;정장이나\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;안경\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;안경이나\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;나\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;치마\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;치마나\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;바지\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;바지나\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;커피\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;커피나\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;(이)나\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nối hai món (danh từ)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;치마나 바지를 입어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi mặc chân váy hoặc quần.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-거나\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nối hai việc (động từ, tính từ)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;집에서 쉬거나 산책해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi nghỉ ở nhà hoặc đi dạo.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;치마이나 바지\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;치마나 바지\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;치마 không có patchim nên dùng 나.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;버스를나 지하철을 타요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;버스나 지하철을 타요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Trợ từ 을/를 chỉ đặt một lần, sau danh từ thứ hai.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN(이)나\u003c/span\u003e\u003c/strong\u003e: Nối hai món (danh từ) = \u0026quot;… hoặc …, … hay …\u0026quot; – chọn một trong hai.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDanh từ có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e이나\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e샌들\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e샌들이나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e정장\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e정장이나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e안경\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e안경이나\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e나\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e치마\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e치마나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e바지\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e바지나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e커피\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e커피나\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 친구 생일이 다음 달이에요. 무슨 선물이 좋아요?\u003c/span\u003e – A: Sinh nhật bạn tôi vào tháng sau. Quà gì thì được nhỉ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 옷이나 모자를 사 주세요.\u003c/span\u003e – B: Bạn mua quần áo hoặc mũ tặng bạn ấy đi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 저는 매운 음식을 잘 못 먹어요.\u003c/span\u003e – A: Tôi không ăn cay được.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 그럼 삼계탕이나 냉면을 드세요.\u003c/span\u003e – B: Vậy anh / chị ăn gà tần sâm hoặc mì lạnh nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저는 버스나 지하철을 타고 회사에 가요.\u003c/span\u003e – Tôi đi làm bằng xe buýt hoặc tàu điện ngầm.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eHai \u003cstrong\u003emón\u003c/strong\u003e (danh từ) nối bằng \u003cspan lang=\"ko\"\u003e(이)나\u003c/span\u003e. Hai \u003cstrong\u003eviệc\u003c/strong\u003e (động từ, tính từ) thì nối bằng\n\u003cspan lang=\"ko\"\u003e-거나\u003c/span\u003e:\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;geona-ina\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-거나\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;-거나: 동사나 형용사에 붙어 둘 이상의 행위나 사실 중에서 하나를 선택하는 것을 나타냅니다.\\n이나: 명사에 붙어 두 가지 이상을 나열하여 그중 하나를 선택하는 것을 나타냅니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-거나 / 이나 – \\\u0026quot;hoặc, hay\\\u0026quot;: -거나 gắn sau thân động từ / tính từ (cả 이다/아니다) để chọn một trong hai hành động / sự việc trở lên; 이나 (sau danh từ có 받침) / 나 (không 받침) liệt kê các danh từ và chọn một trong số đó.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-거나\u0026quot;,\u0026quot;받침 ○\u0026quot;,\u0026quot;앉다, 작다\u0026quot;,\u0026quot;앉거나, 작거나\u0026quot;],[\u0026quot;-거나\u0026quot;,\u0026quot;받침 ×\u0026quot;,\u0026quot;가다, 크다\u0026quot;,\u0026quot;가거나, 크거나\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;주말에는 집에서 쉬거나 친구를 만나요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần tôi nghỉ ở nhà hoặc gặp bạn bè.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저녁에는 텔레비전을 보거나 책을 읽어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Buổi tối tôi xem tivi hoặc đọc sách.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 피곤하거나 아파요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Mệt hay ốm à?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 네, 좀 피곤해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Vâng, hơi mệt.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Hai tranh nhỏ: tranh trên là tượng đá dol hareubang của Jeju bên trái và đài thiên văn Cheomseongdae của Gyeongju bên phải trên bãi cỏ; tranh dưới là xe buýt đỏ chạy phía trên và đoàn tàu điện ngầm phía dưới trên nền xanh ngọc.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;Nối hai việc (động từ, tính từ) = \\\u0026quot;… hoặc …\\\u0026quot; – làm việc này hoặc việc kia.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi gốc động từ, tính từ – có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-거나\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;쉬다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;쉬거나\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹거나\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;피곤하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;피곤하거나\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-거나\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nối hai việc (động từ, tính từ)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;주말에는 쇼핑하거나 영화를 봐요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần tôi đi mua sắm hoặc xem phim.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;(이)나\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nối hai món (danh từ)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;구두나 운동화를 신어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi giày da hoặc giày thể thao.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;치마거나 바지\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;치마나 바지\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Chân váy, quần là món đồ (danh từ) → (이)나; -거나 chỉ gắn sau gốc động từ, tính từ.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-거나\u003c/span\u003e\u003c/strong\u003e: Nối hai việc (động từ, tính từ) = \u0026quot;… hoặc …\u0026quot; – làm việc này hoặc việc kia.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi gốc động từ, tính từ – có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-거나\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e쉬다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e쉬거나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹거나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e피곤하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e피곤하거나\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e주말에는 집에서 쉬거나 친구를 만나요.\u003c/span\u003e – Cuối tuần tôi nghỉ ở nhà hoặc gặp bạn bè.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저녁에는 텔레비전을 보거나 책을 읽어요.\u003c/span\u003e – Buổi tối tôi xem tivi hoặc đọc sách.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 피곤하거나 아파요?\u003c/span\u003e – A: Mệt hay ốm à?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 네, 좀 피곤해요.\u003c/span\u003e – B: Vâng, hơi mệt.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003caside class=\"sach-callout\" data-callout=\"meo\" role=\"note\" aria-label=\"Mẹo\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eMẹo\u003c/p\u003e\u003cp\u003eHai việc cùng một động từ thì gộp cho gọn: \u003cspan lang=\"ko\"\u003e청바지를 입거나 운동복을 입어요\u003c/span\u003e =\n\u003cspan lang=\"ko\"\u003e청바지나 운동복을 입어요\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cp\u003eThử ngay: mỗi thẻ cần chữ nào ở chỗ trống – \u003cspan lang=\"ko\"\u003e이나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e나\u003c/span\u003e hay\n\u003cspan lang=\"ko\"\u003e거나\u003c/span\u003e?\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-03/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;이나\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;sau danh từ có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;나\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;sau danh từ không có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;거나\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;sau gốc động từ, tính từ\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;샌들___ 운동화\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;샌들 có patchim → 이나.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;청바지를 입___ 운동복을 입어요\u0026quot;,\u0026quot;o\u0026quot;:2},{\u0026quot;ko\u0026quot;:\u0026quot;구두___ 운동화\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;토요일___ 일요일\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;쇼핑하___ 영화를 봐요\u0026quot;,\u0026quot;o\u0026quot;:2,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Hai việc làm → gốc động từ + 거나.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;치마___ 바지\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;치마 không có patchim → 나.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;안경___ 선글라스\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;모자를 쓰___ 안경을 써요\u0026quot;,\u0026quot;o\u0026quot;:2},{\u0026quot;ko\u0026quot;:\u0026quot;티셔츠___ 셔츠\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;집에서 쉬___ 산책해요\u0026quot;,\u0026quot;o\u0026quot;:2},{\u0026quot;ko\u0026quot;:\u0026quot;정장___ 원피스\u0026quot;,\u0026quot;o\u0026quot;:0}],\u0026quot;luat\u0026quot;:\u0026quot;tu-do\u0026quot;,\u0026quot;dan\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Hai món đồ → 이나 / 나 theo patchim. Hai việc → gốc động từ + 거나.\u0026quot;},\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e샌들___ 운동화 · 청바지를 입___ 운동복을 입어요 · 구두___ 운동화 · 토요일___ 일요일 · 쇼핑하___ 영화를 봐요 · 치마___ 바지 · 안경___ 선글라스 · 모자를 쓰___ 안경을 써요 · 티셔츠___ 셔츠 · 집에서 쉬___ 산책해요 · 정장___ 원피스\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e이나\u003c/span\u003e – sau danh từ có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e나\u003c/span\u003e – sau danh từ không có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e거나\u003c/span\u003e – sau gốc động từ, tính từ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T2b1e,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eo-boda\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-아/어 보다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;경험을 말할 때나 권유할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Nói về trải nghiệm đã thử làm gì (đã từng…), hoặc rủ / khuyên người khác thử — \\\u0026quot;thử … xem\\\u0026quot;. Gốc có nguyên âm ㅏ/ㅗ + -아 보다 (찾아 보다); nguyên âm khác + -어 보다 (입어 보다); 하다 → 해 보다.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-아 보다\u0026quot;,\u0026quot;찾다\u0026quot;,\u0026quot;찾아 보다\u0026quot;],[\u0026quot;-아 보다\u0026quot;,\u0026quot;살다\u0026quot;,\u0026quot;살아 보다\u0026quot;],[\u0026quot;-어 보다\u0026quot;,\u0026quot;입다\u0026quot;,\u0026quot;입어 보다\u0026quot;],[\u0026quot;-어 보다\u0026quot;,\u0026quot;쓰다\u0026quot;,\u0026quot;써 보다\u0026quot;],[\u0026quot;-해 보다\u0026quot;,\u0026quot;공부하다\u0026quot;,\u0026quot;공부해 보다\u0026quot;],[\u0026quot;-해 보다\u0026quot;,\u0026quot;일하다\u0026quot;,\u0026quot;일해 보다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 이 원피스 디자인이 마음에 들어요. 제 사이즈가 있어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Tôi ưng kiểu váy liền này. Có cỡ của tôi không ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 네, 이걸로 한번 입어 보세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Có ạ, chị mặc thử cái này xem.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 제주도에 가 봤어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Bạn đã đến Jeju bao giờ chưa?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 네, 작년 여름에 가 봤어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Rồi, mùa hè năm ngoái tôi đã đến.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이 운동화가 아주 편해요. 한번 신어 보세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đôi giày thể thao này rất êm. Bạn đi thử xem.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong cửa hàng quần áo, cô gái tóc buộc đuôi ngựa mặc áo gi-lê xanh, chân váy be cầm chiếc váy trên giá nói \\\u0026quot;이 원피스 디자인이 마음에 들어요. 제 사이즈가 있어요?\\\u0026quot;; nữ nhân viên tóc búi, vest xanh đen cầm chiếc váy liền hồng đáp \\\u0026quot;네, 이걸로 한번 입어 보세요.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;Động từ + 아/어 보다 = \\\u0026quot;thử … xem\\\u0026quot;. 아/어 보세요: khuyên người khác thử; 아/어 봤어요: đã từng làm.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối của gốc là ㅏ hoặc ㅗ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-아 보다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;찾다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;찾아 보다\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-어 보다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;입다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;입어 보다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;신다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;신어 보다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹어 보다\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc là 하다\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;해 보다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;운동하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;운동해 보다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;쇼핑하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;쇼핑해 보다\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc hết bằng ㅏ (không patchim): 아 nhập vào\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가 보다\u0026quot;}]},{\u0026quot;luat\u0026quot;:\u0026quot;ㅜ + 어 gộp thành ㅝ\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;배우다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;배워 보다\u0026quot;}]}],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc hết bằng ㅡ: bỏ ㅡ (gốc một âm tiết → 어)\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;쓰다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;써 보다\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;입아 보세요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;입어 보세요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Nguyên âm của 입 là ㅣ, không phải ㅏ, ㅗ → 어.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-아/어 보다\u003c/span\u003e\u003c/strong\u003e: Động từ + 아/어 보다 = \u0026quot;thử … xem\u0026quot;. 아/어 보세요: khuyên người khác thử; 아/어 봤어요: đã từng làm.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối của gốc là ㅏ hoặc ㅗ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-아 보다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e찾다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찾아 보다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-어 보다\u003c/span\u003e\
