3c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;한국 친구 집에 갔습니다. 집에 친구의 어머니와 아버지께서 계셨고 남동생도 있었습니다. 저는 선물로 꽃다발과 케이크를 사 갔습니다. 친구의 부모님께서는 제 선물을 받고 기뻐하셨습니다. 친구의 가족들과 식사도 했습니다. 친구의 어머니께서는 요리를 정말 잘하십니다. 음식이 모두 맛있었습니다. 정말 감사했습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đã đến nhà một người bạn Hàn Quốc. Ở nhà có bố mẹ của bạn và cả em trai bạn nữa. Tôi đã mua bó hoa và bánh kem mang đến làm quà. Bố mẹ bạn nhận quà của tôi và rất vui. Tôi cũng đã dùng bữa với gia đình bạn. Mẹ của bạn nấu ăn rất giỏi. Món nào cũng ngon. Tôi thật sự rất biết ơn.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Phòng khách thảm hồng, ghế sofa kem, nhiều trái tim hồng bay: cô gái tóc nâu dài mặc áo khoác vàng nâu trao bó hoa cho bà mẹ tóc nâu ngắn mặc áo đỏ đô; ông bố tóc bạc đeo kính mặc áo gile tím và một cô gái tóc nâu áo hồng đứng cạnh, ai cũng tươi cười.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;có, ở (đâu đó)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;먹다, 마시다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ăn, uống\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;자다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ngủ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;말하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nói\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;집\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;계시다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ở, có mặt (kính ngữ của 있다)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;드시다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;dùng (ăn, uống – kính ngữ của 먹다, 마시다)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;주무시다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ngủ (kính ngữ của 자다)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;말씀하시다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nói (kính ngữ của 말하다)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;댁\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà (kính ngữ của 집)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;처음 뵙겠습니다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Rất hân hạnh được gặp (lần đầu gặp, trang trọng)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;성함이 어떻게 되세요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Quý danh của ông/bà là gì ạ? (hỏi tên lịch sự)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;무슨 일을 하세요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ông/bà làm nghề gì ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;기뻐하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vui mừng\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e한국 친구 집에 갔습니다. 집에 친구의 어머니와 아버지께서 계셨고 남동생도 있었습니다. 저는 선물로 꽃다발과 케이크를 사 갔습니다. 친구의 부모님께서는 제 선물을 받고 기뻐하셨습니다. 친구의 가족들과 식사도 했습니다. 친구의 어머니께서는 요리를 정말 잘하십니다. 음식이 모두 맛있었습니다. 정말 감사했습니다.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eTôi đã đến nhà một người bạn Hàn Quốc. Ở nhà có bố mẹ của bạn và cả em trai bạn nữa. Tôi đã mua bó hoa và bánh kem mang đến làm quà. Bố mẹ bạn nhận quà của tôi và rất vui. Tôi cũng đã dùng bữa với gia đình bạn. Mẹ của bạn nấu ăn rất giỏi. Món nào cũng ngon. Tôi thật sự rất biết ơn.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#20/ex-p266-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p266-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;이 \u003e\u003cp\u003eĐây là ảnh gia đình tôi.\u003cbr\u003eGồm bà, bố mẹ, em trai và tôi.\u003cbr\u003eBố tôi là đầu bếp. Vì vậy bố nấu ăn rất giỏi.\u003cbr\u003eMẹ tôi là giáo viên. Em trai tôi là học sinh cấp ba.\u003cbr\u003eEm tôi đeo kính còn tôi thì không đeo kính.\u003cbr\u003eBà tôi đã cao tuổi.\u003cbr\u003eHôm nay là sinh nhật bà.\u003cbr\u003eVì vậy tôi rất nhớ bà.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step1#10/ex-p119-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p119-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;다음 글을 읽고 질문에 답해 보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đọc bài sau và trả lời câu hỏi.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;이 사람의 가족은 모두 몇 명이에요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Gia đình người này có tất cả mấy người?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;5명\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;4명\u0026quot;,\u0026quot;6명\u0026quot;,\u0026quot;5명\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;맞으면 O, 틀리면 X 하세요.\\n① 아버지는 요리를 잘하십니다.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Đúng ghi O, sai ghi X. ① Bố nấu ăn giỏi.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;맞으면 O, 틀리면 X 하세요.\\n② 동생은 안경을 안 썼습니다.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Đúng ghi O, sai ghi X. ② Em trai không đeo kính.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;X\u0026quot;]},{\u0026quot;q\
