quot;vi\u0026quot;:\u0026quot;Đuôi quá khứ: chèn vào giữa gốc động từ / tính từ và đuôi câu để nói việc đã xảy ra hoặc trạng thái trong quá khứ. Gốc có nguyên âm ㅏ, ㅗ → -았-; nguyên âm khác → -었-; 하다 → 했-.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-았-\u0026quot;,\u0026quot;만나다\u0026quot;,\u0026quot;만났다\u0026quot;],[\u0026quot;-았-\u0026quot;,\u0026quot;보다\u0026quot;,\u0026quot;봤다\u0026quot;],[\u0026quot;-었-\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹었다\u0026quot;],[\u0026quot;-었-\u0026quot;,\u0026quot;마시다\u0026quot;,\u0026quot;마셨다\u0026quot;],[\u0026quot;-했-\u0026quot;,\u0026quot;일하다\u0026quot;,\u0026quot;일했다\u0026quot;],[\u0026quot;-했-\u0026quot;,\u0026quot;공부하다\u0026quot;,\u0026quot;공부했다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;어제 뭐 했어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Hôm qua bạn đã làm gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;친구를 만났어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đã gặp bạn.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 오늘 아침을 먹었어요?\\n나: 아니요, 안 먹었어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Sáng nay bạn đã ăn sáng chưa?\\nB: Chưa, tôi chưa ăn.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저는 작년에 한국에 왔어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đã đến Hàn Quốc vào năm ngoái.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Một phụ nữ đeo kính, tóc dài, đứng cạnh tờ lịch tháng 1 hỏi một người đàn ông da ngăm mặc gi-lê nâu; anh ấy nghĩ đến cảnh mình gặp một người bạn mặc vest, đeo cà vạt trước toà nhà.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Đã …\\\u0026quot; – nói việc đã xảy ra; tiếng Việt thêm \\\u0026quot;đã\\\u0026quot; trước động từ, tiếng Hàn chèn 았/었 vào giữa gốc và đuôi 어요.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối của gốc là ㅏ hoặc ㅗ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-았어요\u0026quot;,\u0026quot;vd\u002 ng\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e할머니\u003c/span\u003e – bà\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eNghỉ ở nhà, rồi leo núi.\u003c/strong\u003e Việc người Hàn làm nhiều nhất cuối tuần là nghỉ ngơi, xem ti vi. Khoảng 70% đất Hàn\nQuốc là đồi núi, ngay trong Seoul cũng có núi – cuối tuần, ga tàu điện gần núi đông người mặc đồ leo núi đủ bộ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐạp xe ven sông Hàn.\u003c/strong\u003e Dọc sông Hàn ở Seoul có nhiều công viên (\u003cspan lang=\"ko\"\u003e한강공원\u003c/span\u003e) với đường riêng\ncho xe đạp. Không có xe thì thuê xe đạp công cộng của thành phố – \u003cspan lang=\"ko\"\u003e따릉이\u003c/span\u003e – bằng ứng dụng\ntrên điện thoại.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eXem bóng chày.\u003c/strong\u003e \u003cspan lang=\"ko\"\u003e야구\u003c/span\u003e là môn thể thao có nhiều khán giả đến sân nhất Hàn Quốc. Tối mùa hè,\ncả nhà, cả nhóm bạn kéo nhau ra sân cổ vũ.\u003c/p\u003e\n\u003ch3\u003eHỏi thăm cuối tuần\u003c/h3\u003e\n\u003cp\u003eSáng thứ Hai, đồng nghiệp, bạn cùng lớp hay hỏi \u003cspan lang=\"ko\"\u003e주말 잘 보냈어요?\u003c/span\u003e như một câu chào – kể ngắn\nmột việc là đủ. Nói theo sáu câu hỏi thăm và rủ nhau đi leo núi.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-14/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;주말 잘 보냈어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần của bạn vui chứ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;네, 등산했어요. 재미있었어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vâng, tôi đã đi leo núi. Vui lắm.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;다음 주말에 같이 등산할 수 있어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần sau mình cùng đi leo núi được không?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;미안해요. 다음 주말에는 못 가요.\u0026quot;,\u0026quot;v
