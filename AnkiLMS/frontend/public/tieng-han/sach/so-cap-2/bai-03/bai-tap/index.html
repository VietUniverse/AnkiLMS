h\u003e\u003c/th\u003e\u003cth\u003eTiếng Hàn\u003c/th\u003e\u003cth\u003eNghĩa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eNhân viên\u003c/td\u003e\u003ctd lang=\"ko\"\u003e찾으시는 거 있으세요?\u003c/td\u003e\u003ctd\u003eAnh tìm gì ạ?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJamshid\u003c/td\u003e\u003ctd lang=\"ko\"\u003e남자 바지 좀 보여 주세요.\u003c/td\u003e\u003ctd\u003eCho tôi xem quần nam với.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNhân viên\u003c/td\u003e\u003ctd lang=\"ko\"\u003e어떤 디자인을 찾으세요?\u003c/td\u003e\u003ctd\u003eAnh tìm kiểu nào ạ?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNhân viên\u003c/td\u003e\u003ctd lang=\"ko\"\u003e긴 바지나 짧은 바지 다 괜찮으세요?\u003c/td\u003e\u003ctd\u003eQuần dài hay quần ngắn đều được ạ?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJamshid\u003c/td\u003e\u003ctd lang=\"ko\"\u003e긴 바지요.\u003c/td\u003e\u003ctd\u003eQuần dài ạ.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJamshid\u003c/td\u003e\u003ctd lang=\"ko\"\u003e편하고 주머니 있는 걸로 보여 주세요.\u003c/td\u003e\u003ctd\u003eCho tôi xem loại nào mặc thoải mái và có túi.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNhân viên\u003c/td\u003e\u003ctd lang=\"ko\"\u003e이거 어떠세요?\u003c/td\u003e\u003ctd\u003eCái này thế nào ạ?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNhân viên\u003c/td\u003e\u003ctd lang=\"ko\"\u003e주머니가 커서 아주 편하실 거예요.\u003c/td\u003e\u003ctd\u003eTúi to nên anh sẽ thấy rất tiện.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJamshid\u003c/td\u003e\u003ctd lang=\"ko\"\u003e좋네요.\u003c/td\u003e\u003ctd\u003eĐược đấy.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJamshid\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그걸로 입어 볼게요.\u003c/td\u003e\u003ctd\u003eTôi sẽ mặc thử cái đó.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T4a30,\u003cp\u003eCô Kim phát cho cả lớp bài đọc của giáo trình: ba người kể mình thích mặc đồ thế nào. Chạm từ hoặc câu để xem nghĩa.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e최고\u003c/span\u003e – nhất, tuyệt nhất · \u003cspan lang=\"ko\"\u003e-게\u003c/span\u003e – một cách\n(\u003cspan lang=\"ko\"\u003e편하게\u003c/span\u003e – thoải mái) · \u003cspan lang=\"ko\"\u003e예의\u003c/span\u003e – phép lịch sự ·\n\u003cspan lang=\"ko\"\u003e중요한 곳에 갈 때\u003c/span\u003e – khi đến chỗ quan trọng · \u003cspan lang=\"ko\"\u003e몸\u003c/span\u003e – vóc dáng ·\n\u003cspan lang=\"ko\"\u003e골라서\u003c/span\u003e – chọn rồi.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;“편한 옷이 최고!” 옷은 편하게 입는 것이 제일 좋습니다. 그래서 저는 바지와 티셔츠처럼 편한 옷을 자주 입습니다.\\n“단정한 옷으로 예의 있게…” 저는 단정한 옷을 좋아합니다. 옷은 사람에 대한 예의입니다. 그래서 저는 중요한 곳에 갈 때 원피스나 정장처럼 단정한 옷을 입습니다.\\n“옷으로 나를 표현하기” 저는 멋있는 옷이 좋습니다. 비싸지 않지만 멋진 옷이 많습니다. 제 얼굴과 몸에 맞는 디자인을 잘 골라서 입습니다. 옷은 나를 멋있게 해 줍니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;(Trương) \\\u0026quot;Quần áo thoải mái là nhất!\\\u0026quot; Quần áo mặc thoải mái là tốt nhất. Vì vậy tôi hay mặc đồ thoải mái như quần dài và áo phông.\\n(Ji-yeon) \\\u0026quot;Lịch sự với trang phục chỉnh tề…\\\u0026quot; Tôi thích quần áo chỉnh tề. Quần áo là phép lịch sự đối với người khác. Vì vậy khi đến những nơi quan trọng, tôi mặc đồ chỉnh tề như váy liền hay com-lê.\\n(Natasha) \\\u0026quot;Thể hiện bản thân qua quần áo\\\u0026quot; Tôi thích quần áo đẹp. Có nhiều bộ đồ đẹp mà không đắt. Tôi khéo chọn kiểu dáng hợp với khuôn mặt và vóc dáng của mình để mặc. Quần áo làm tôi trông đẹp hơn.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Ba người đứng cạnh nhau trên bãi cỏ, tên ghi bên dưới: Ji-yeon (tóc đỏ, vest đen, chân váy đen, giày cao gót; bong bóng \\\u0026quot;단정한 옷으로 예의있게…\\\u0026quot;), Trương (tóc đen, áo phông xanh xám, quần jeans đen, đeo túi chéo; bong bóng \\\u0026quot;편한 옷이 최고!\\\u0026quot;), Natasha (tóc vàng, áo nâu, chân váy xám có hàng cúc, bốt nâu cao; bong bóng \\\u0026quot;옷으로 \u0026#39;나\u0026#39;를 표현하기\\\u0026quot;). Mỗi đoạn văn có ảnh chân dung người viết bên cạnh: Trương, Ji-yeon, Natasha.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;원피스\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;váy liền\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;바지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;quần\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;치마\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chân váy\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;티셔츠\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;áo phông\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;정장\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;com-lê, đồ công sở\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;코트\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;áo khoác dài, áo măng tô\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가격\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giá cả\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;사이즈\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cỡ, kích cỡ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;색깔\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu sắc\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;디자인\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kiểu dáng, thiết kế\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(옷)을 입다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mặc (quần áo)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(옷, 신발)을 벗다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cởi (quần áo), tháo (giày)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(신발)을 신다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đi (giày), mang (giày)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;유행\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mốt, xu hướng thịnh hành\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;물론\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tất nhiên\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;예의\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lễ phép, phép lịch sự\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;단정하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chỉnh tề, gọn gàng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;표현\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sự thể hiện, biểu hiện\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e“편한 옷이 최고!” 옷은 편하게 입는 것이 제일 좋습니다. 그래서 저는 바지와 티셔츠처럼 편한 옷을 자주 입습니다.\u003cbr\u003e“단정한 옷으로 예의 있게…” 저는 단정한 옷을 좋아합니다. 옷은 사람에 대한 예의입니다. 그래서 저는 중요한 곳에 갈 때 원피스나 정장처럼 단정한 옷을 입습니다.\u003cbr\u003e“옷으로 나를 표현하기” 저는 멋있는 옷이 좋습니다. 비싸지 않지만 멋진 옷이 많습니다. 제 얼굴과 몸에 맞는 디자인을 잘 골라서 입습니다. 옷은 나를 멋있게 해 줍니다.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003e(Trương) \u0026quot;Quần áo thoải mái là nhất!\u0026quot; Quần áo mặc thoải mái là tốt nhất. Vì vậy tôi hay mặc đồ thoải mái như quần dài và áo phông.\u003cbr\u003e(Ji-yeon) \u0026quot;Lịch sự với trang phục chỉnh tề…\u0026quot; Tôi thích quần áo chỉnh tề. Quần áo là phép lịch sự đối với người khác. Vì vậy khi đến những nơi quan trọng, tôi mặc đồ chỉnh tề như váy liền hay com-lê.\u003cbr\u003e(Natasha) \u0026quot;Thể hiện bản thân qua quần áo\u0026quot; Tôi thích quần áo đẹp. Có nhiều bộ đồ đẹp mà không đắt. Tôi khéo chọn kiểu dáng hợp với khuôn mặt và vóc dáng của mình để mặc. Quần áo làm tôi trông đẹp hơn.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#16/ex-p220-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p220-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;지연 씨는 단정한 옷을 좋아합니다. 그래서 어떤 옷을 입습니까?\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Ji-yeon thích quần áo chỉnh tề. Vậy cô ấy mặc đồ gì?\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;___나 ___을 입습니다.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Cô ấy mặc ___ hoặc ___.\u0026quot;,\u0026quot;blanks\u0026quot;:[{\u0026quot;answer\u0026quot;:[\u0026quot;원피스\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;원피스\u0026quot;,\u0026quot;정장\u0026quot;,\u0026quot;바지\u0026quot;,\u0026quot;티셔츠\u0026quot;]},{\u0026quot;answer\u0026quot;:[\u0026quot;정장\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;원피스\u0026quot;,\u0026quot;정장\u0026quot;,\u0026quot;바지\u0026quot;,\u0026quot;티셔츠\u0026quot;]}]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · Ji-yeon mặc gì?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e지연 씨는 단정한 옷을 좋아합니다. 그래서 어떤 옷을 입습니까?\u003c/span\u003e\u003c/strong\u003e – Ji-yeon thích quần áo chỉnh tề. Vậy cô ấy mặc đồ gì?\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e___나 ___을 입습니다.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#16/ex-p220-3\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p220-3\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;match\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;맞는 것을 연결하세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Nối cho đúng.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Trương\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;비싼 옷\u0026quot;,\u0026quot;단정한 옷, 정장과 원피스\u0026quot;,\u0026quot;편한 옷, 바지와 티셔츠\u0026quot;,\u0026quot;디자인이 멋있는 옷\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;편한 옷, 바지와 티셔츠\u0026quot;],\u0026quot;tranh\u0026quot;:\u0026quot;Chân dung chàng trai tóc đen (Trương) trên nền tròn xanh da trời.\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Ji-yeon\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;비싼 옷\u0026quot;,\u0026quot;단정한 옷, 정장과 원피스\u0026quot;,\u0026quot;편한 옷, 바지와 티셔츠\u0026quot;,\u0026quot;디자인이 멋있는 옷\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;단정한 옷, 정장과 원피스\u0026quot;],\u0026quot;tranh\u0026quot;:\u0026quot;Chân dung cô gái tóc đỏ, vest đen (Ji-yeon) trên nền tròn hồng.\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Natasha\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;비싼 옷\u0026quot;,\u0026quot;단정한 옷, 정장과 원피스\u0026quot;,\u0026quot;편한 옷, 바지와 티셔츠\u0026quot;,\u0026quot;디자인이 멋있는 옷\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;디자인이 멋있는 옷\u0026quot;],\u0026quot;tranh\u0026quot;:\u0026quot;Chân dung cô gái tóc vàng, áo nâu (Natasha) trên nền tròn vàng nhạt.\u0026quot;}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · ai thích loại đồ nào?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e맞는 것을 연결하세요.\u003c/span\u003e\u003c/strong\u003e – Nối cho đúng.\u003c/p\u003e\u003col\u003e\u003cli\u003eChân dung chàng trai tóc đen (Trương) trên nền tròn xanh da trời. \u003csmall\u003e(비싼 옷 / 단정한 옷, 정장과 원피스 / 편한 옷, 바지와 티셔츠 / 디자인이 멋있는 옷)\u003c/small\u003e\u003c/li\u003e\u003cli\u003eChân dung cô gái tóc đỏ, vest đen (Ji-yeon) trên nền tròn hồng. \u003csmall\u003e(비싼 옷 / 단정한 옷, 정장과 원피스 / 편한 옷, 바지와 티셔츠 / 디자인이 멋있는 옷)\u003c/small\u003e\u003c/li\u003e\u003cli\u003eChân dung cô gái tóc vàng, áo nâu (Natasha) trên nền tròn vàng nhạt. \u003csmall\u003e(비싼 옷 / 단정한 옷, 정장과 원피스 / 편한 옷, 바지와 티셔츠 / 디자인이 멋있는 옷)\u003c/small\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003e2 · Đồng phục ở xưởng\u003c/h3\u003e\n\u003cp\u003eMột bài đọc ngắn: một công nhân giới thiệu bộ đồng phục ở xưởng mình.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-p39-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;이 옷은 우리 회사의 작업복입니다. 우리는 작업복으로 티셔츠, 바지, 조끼를 입습니다. 이 티셔츠와 바지는 시원하고 편합니다. 땀도 빨리 마릅니다. 조끼에는 주머니가 많이 있습니다. 그래서 필요한 물건을 넣습니다. 저는 이 옷이 아주 마음에 듭니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bộ này là đồng phục lao động của công ty tôi. Chúng tôi mặc áo thun, quần dài và áo gi-lê làm đồng phục. Áo thun và quần này mát và thoải mái. Mồ hôi cũng khô nhanh. Áo gi-lê có nhiều túi. Vì vậy tôi để những thứ cần dùng vào đó. Tôi rất ưng bộ đồ này.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Người công nhân đội mũ lưỡi trai xanh đậm, mặc áo dài tay xanh nhạt, áo gi-lê nhiều túi màu xám xanh, quần trắng, ủng/giày bảo hộ nâu, tay chạm vành mũ.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;쓰다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đội (mũ), đeo (kính)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;모자\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mũ, nón\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;헬멧\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mũ bảo hiểm (xe máy, xe đạp)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;안전모\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mũ bảo hộ lao động\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;안경\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kính (mắt)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선글라스\
