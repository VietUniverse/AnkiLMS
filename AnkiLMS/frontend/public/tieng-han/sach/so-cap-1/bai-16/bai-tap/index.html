26quot;q\u0026quot;:\u0026quot;보기: 목요일, 한국 음식을 만들다\\n가: 다음 주 목요일에 뭐 할 거예요?\\n나: 문화 센터에서 한국 음식을 만들 거예요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Mẫu: A: Thứ Năm tuần sau bạn sẽ làm gì? B: Tôi sẽ nấu món Hàn ở trung tâm văn hoá.\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;금요일, 친구 집에 놀러 가다\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Thứ Sáu, đến nhà bạn chơi\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;친구 집에 놀러 갈 거예요.\u0026quot;,\u0026quot;금요일에 친구 집에 놀러 갈 거예요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;토요일, 가족하고 외식하다\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Thứ Bảy, đi ăn ngoài cùng gia đình\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;가족하고 외식할 거예요.\u0026quot;,\u0026quot;토요일에 가족하고 외식할 거예요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;일요일, 마트에서 장을 보다\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Chủ nhật, đi chợ ở siêu thị\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;마트에서 장을 볼 거예요.\u0026quot;,\u0026quot;일요일에 마트에서 장을 볼 거예요.\u0026quot;]}],\u0026quot;bank\u0026quot;:[\u0026quot;다음 주 ___요일에 뭐 할 거예요?\u0026quot;,\u0026quot;___(으)ㄹ 거예요.\u0026quot;]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · tuần sau Ji-eun sẽ làm gì\u0026quot;,\u0026quot;deKo\u0026quot;:true}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e지은 씨는 다음 주에 무엇을 할 거예요? 이야기해 보세요.\u003c/span\u003e\u003c/strong\u003e – Tuần sau Ji-eun sẽ làm gì? Hãy nói theo mẫu (dùng -(으)ㄹ 거예요).\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e보기: 목요일, 한국 음식을 만들다\n가: 다음 주 목요일에 뭐 할 거예요?\n나: 문화 센터에서 한국 음식을 만들 거예요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e금요일, 친구 집에 놀러 가다\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e토요일, 가족하고 외식하다\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e일요일, 마트에서 장을 보다\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003e2 · Kỳ nghỉ làm hai việc\u003c/h3\u
