à xanh cũng được, nhưng nước giặt hoặc giấy vệ sinh thì sao?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJun-ho\u003c/td\u003e\u003ctd lang=\"ko\"\u003e집들이 선물로 보통 세제나 휴지를 많이 해요.\u003c/td\u003e\u003ctd\u003eQuà tân gia người ta thường hay tặng nước giặt hoặc giấy vệ sinh.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHuyền\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그래요?\u003c/td\u003e\u003ctd\u003eVậy à?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHuyền\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그럼 그걸로 해요.\u003c/td\u003e\u003ctd\u003eThế thì mình chọn cái đó đi.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T2525,\u003cp\u003eMột bài đọc của giáo trình: tờ giới thiệu một nhà nghỉ hanok – nhà truyền thống Hàn Quốc. Chạm từ hoặc câu để xem\nnghĩa.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e한옥\u003c/span\u003e – nhà truyền thống Hàn Quốc · \u003cspan lang=\"ko\"\u003e여행지\u003c/span\u003e – nơi du lịch ·\n\u003cspan lang=\"ko\"\u003e특별하다\u003c/span\u003e – đặc biệt · \u003cspan lang=\"ko\"\u003e추억\u003c/span\u003e – kỷ niệm · \u003cspan lang=\"ko\"\u003e거리\u003c/span\u003e –\nkhoảng cách · \u003cspan lang=\"ko\"\u003e안\u003c/span\u003e – trong vòng · \u003cspan lang=\"ko\"\u003e맞다\u003c/span\u003e – hợp ·\n\u003cspan lang=\"ko\"\u003e욕실\u003c/span\u003e – phòng tắm · \u003cspan lang=\"ko\"\u003e화장지\u003c/span\u003e – giấy vệ sinh ·\n\u003cspan lang=\"ko\"\u003e준비되어 있다\u003c/span\u003e – có sẵn · \u003cspan lang=\"ko\"\u003e직접 준비해야 해요\u003c/span\u003e – phải tự chuẩn bị · \u003cspan lang=\"ko\"\u003e남녀\u003c/span\u003e – nam nữ · \u003cspan lang=\"ko\"\u003e문의처\u003c/span\u003e –\nsố liên hệ.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;titleKo\u0026quot;:\u0026quot;한옥에서 보내는 특별한 하루\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;여행지에서 한국 사람처럼 살아 보세요.\\n조용한 한옥에서 하루를 보내세요.\\n한복을 입고 사진도 한 장!\\n아주 특별한 추억을\\n만들어 드리겠습니다.\\n\\n• 지하철역에서 5분 거리(100m)에 있습니다.\\n• 박물관이 걸어서 10분 안(500m)에 있습니다.\\n• 가족 여행에 잘 맞습니다.\\n• 침대 2개(4명), 욕실 1개\\n• 따뜻한 아침 식사를 드립니다.\\n• 수건, 비누, 화장지, 커피와 차가 준비되어 있습니다.\\n• 남녀 한복을 입고 사진을 찍을 수 있습니다.\\n• 문의처: 010-111-2222\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Một ngày đặc biệt ở nhà hanok\\nHãy thử sống như người Hàn Quốc tại nơi bạn du lịch.\\nHãy trải qua một ngày trong ngôi nhà hanok yên tĩnh.\\nMặc hanbok và chụp một tấm ảnh!\\nChúng tôi sẽ tạo cho bạn\\nmột kỷ niệm thật đặc biệt.\\n\\n• Cách ga tàu điện ngầm 5 phút (100m).\\n• Bảo tàng cách đi bộ trong vòng 10 phút (500m).\\n• Rất hợp cho du lịch gia đình.\\n• 2 giường (4 người), 1 phòng tắm\\n• Có phục vụ bữa sáng nóng.\\n• Có sẵn khăn tắm, xà phòng, giấy vệ sinh, cà phê và trà.\\n• Có thể mặc hanbok nam nữ và chụp ảnh.\\n• Liên hệ: 010-111-2222\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Đôi nam nữ mặc hanbok đứng mỉm cười trong gian nhà hanok: chàng trai áo xanh ngọc, gile xanh lá, quần xám; cô gái áo vàng nhạt, váy hồng tím dài; phía sau là cửa giấy khung gỗ hoa văn, vách sọc trắng xám và chiếc đèn lồng đen treo trên cao.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;아파트\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;căn hộ chung cư\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;원룸\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phòng studio, nhà một phòng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;하숙집\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà trọ có nấu ăn (ở trọ cùng chủ nhà)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;방\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phòng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;화장실\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà vệ sinh, phòng tắm\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;거실\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phòng khách\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;부엌\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà bếp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;방이 넓다/좁다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phòng rộng / hẹp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;거리가 가깝다/멀다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;khoảng cách gần / xa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;살기 편하다/불편하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sống thuận tiện / bất tiện\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;한복\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Hanbok (trang phục truyền thống Hàn Quốc)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;욕실\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phòng tắm\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;화장지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giấy vệ sinh, khăn giấy\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;비누\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;xà phòng\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e한옥에서 보내는 특별한 하루\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e여행지에서 한국 사람처럼 살아 보세요.\u003cbr\u003e조용한 한옥에서 하루를 보내세요.\u003cbr\u003e한복을 입고 사진도 한 장!\u003cbr\u003e아주 특별한 추억을\u003cbr\u003e만들어 드리겠습니다.\u003cbr\u003e\u003cbr\u003e• 지하철역에서 5분 거리(100m)에 있습니다.\u003cbr\u003e• 박물관이 걸어서 10분 안(500m)에 있습니다.\u003cbr\u003e• 가족 여행에 잘 맞습니다.\u003cbr\u003e• 침대 2개(4명), 욕실 1개\u003cbr\u003e• 따뜻한 아침 식사를 드립니다.\u003cbr\u003e• 수건, 비누, 화장지, 커피와 차가 준비되어 있습니다.\u003cbr\u003e• 남녀 한복을 입고 사진을 찍을 수 있습니다.\u003cbr\u003e• 문의처: 010-111-2222\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eMột ngày đặc biệt ở nhà hanok\u003cbr\u003eHãy thử sống như người Hàn Quốc tại nơi bạn du lịch.\u003cbr\u003eHãy trải qua một ngày trong ngôi nhà hanok yên tĩnh.\u003cbr\u003eMặc hanbok và chụp một tấm ảnh!\u003cbr\u003eChúng tôi sẽ tạo cho bạn\u003cbr\u003emột kỷ niệm thật đặc biệt.\u003cbr\u003e\u003cbr\u003e• Cách ga tàu điện ngầm 5 phút (100m).\u003cbr\u003e• Bảo tàng cách đi bộ trong vòng 10 phút (500m).\u003cbr\u003e• Rất hợp cho du lịch gia đình.\u003cbr\u003e• 2 giường (4 người), 1 phòng tắm\u003cbr\u003e• Có phục vụ bữa sáng nóng.\u003cbr\u003e• Có sẵn khăn tắm, xà phòng, giấy vệ sinh, cà phê và trà.\u003cbr\u003e• Có thể mặc hanbok nam nữ và chụp ảnh.\u003cbr\u003e• Liên hệ: 010-111-2222\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#19/ex-p256-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p256-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;choose\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;이 집에 대한 설명으로 틀린 것을 고르세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Chọn câu mô tả SAI về ngôi nhà này.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Câu nào sai về ngôi nhà này?\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;침대는 모두 두 개가 있어요.\u0026quot;,\u0026quot;가족과 같이 여행할 수 있어요.\u0026quot;,\u0026quot;지하철역이 박물관보다 가까워요.\u0026quot;,\u0026quot;아침 식사를 직접 준비해야 해요.\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;아침 식사를 직접 준비해야 해요.\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · câu nào sai về nhà hanok?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e이 집에 대한 설명으로 틀린 것을 고르세요.\u003c/span\u003e\u003c/st uot;exercise:step2#7/ex-p78-2\u0026quot;,\u0026quot;exercise:sejong-2#19/ex-p257-speak-1\u0026quot;]},{\u0026quot;page\u0026quot;:13,\u0026quot;phan\u0026quot;:\u0026quot;bai-tap\u0026quot;,\u0026quot;can\u0026quot;:[],\u0026quot;giong\u0026quot;:[\u0026quot;bang:so-cap-2/bai-07/bang-gioi-thieu\u0026quot;]}]}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003eV/A-(으)니까\u003c/span\u003e – \u0026quot;Vì … nên …\u0026quot; – nói lý do; câu sau hay là lời bảo, lời mời, lời rủ (-(으)세요, -(으)ㅂ시다, -(으)ㄹ까요?).\u003cbr\u003e\u003cspan lang=\"ko\"\u003e밖에 비가 오니까 우산을 쓰세요.\u003c/span\u003e – Ngoài trời đang mưa nên hãy che ô.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003eV/A-기 때문에\u003c/span\u003e – \u0026quot;Vì …\u0026quot; – nói lý do chắc chắn, trang trọng hơn -(으)니까; hay dùng khi viết, khi giải thích. Câu sau là câu kể.\u003cbr\u003e\u003cspan lang=\"ko\"\u003e이사 때문에 집이 좀 복잡해요.\u003c/span\u003e – Mới chuyển nhà nên nhà còn bừa.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003eV-(으)ㄹ까 보다\u003c/span\u003e – \u0026quot;Chắc tôi sẽ …, có lẽ tôi …\u0026quot; – nói dự định của chính mình (저, 우리), chưa quyết hẳn; đứng cuối câu: -(으)ㄹ까 봐요.\u003cbr\u003e\u003cspan lang=\"ko\"\u003e피곤하니까 오늘은 집에서 쉴까 봐요.\u003c/span\u003e – Mệt quá, chắc hôm nay tôi ở nhà nghỉ thôi.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e집들이\u003c/span\u003e tiệc tân gia (mời khách đến nhà mới) · \u003cspan lang=\"ko\"\u003e초대하다\u003c/span\u003e mời – 친구를 집들이에 초대했어요. · \u003cspan lang=\"ko\"\u003e이사하다\u003c/span\u003e chuyển nhà – 새집으로 이사했어요. · \u003cspan lang=\"ko\"\u003e손님을 맞이하다\u003c/span\u003e đón khách · \u003cspan lang=\"ko\"\u003e음식을 차리다\u003c/span\u003e bày đồ ăn, dọn cỗ · \u003cspan lang=\"ko\"\u003e손님을 대접하다\u003c/span\u003e tiếp đãi khách · \u003cspan lang=\"ko\"\u003e선물을 가져가다\u003c/span\u003e mang quà đến · \u003cspan lang=\"ko\"\u003e휴지\u003c/span\u003e giấy vệ sinh, giấy ăn · \u003cspan lang=\"ko\"\u003e세제 rong\u003e – (Sau khi nghe) Đúng chọn O, sai chọn X.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e리사 씨는 혼자 살지만 전혀 심심하지 않아요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e후안 씨는 혼자 살고 싶어서 고민했어요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e리사 씨는 후안 씨가 집 찾는 것을 도와주기로 했어요.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"hoi-thoai\" data-props=\"{\u0026quot;lines\u0026quot;:[{\u0026quot;who\u0026quot;:\u0026quot;후안\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Juan\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;리사 씨, 요즘 혼자 사니까 어때요? 하숙집에 살 때보다 편해요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Lisa ơi, dạo này sống một mình thấy thế nào? Có thoải mái hơn hồi ở nhà trọ không?\u0026quot;,\u0026quot;start\u0026quot;:18.94,\u0026quot;end\u0026quot;:26.24,\u0026quot;w\u0026quot;:[18.94,20.14,20.68,21.44,22.04,22.56,23.98,24.96,25.18,25.64]},{\u0026quot;who\u0026quot;:\u0026quot;리사\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Lisa\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;네, 편하고 좋아요. 방도 넓고요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vâng, thoải mái và thích lắm. Phòng cũng rộng nữa.\u0026quot;,\u0026quot;start\u0026quot;:27.8,\u0026quot;end\u0026quot;:34.5,\u0026quot;w\u0026quot;:[27.8,29.66,30.78,32.06,33.22]},{\u0026quot;who\u0026quot;:\u0026quot;후안\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Juan\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;혼자 살면 심심하거나 무섭지 않아요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Sống một mình không thấy buồn chán hay sợ à?\u0026quot;,\u0026quot;start\u0026quot;:36.7,\u0026quot;end\u0026quot;:40.32,\u0026quot;w\u0026quot;:[36.7,37.4,37.98,38.88,39.92]},{\u0026quot;who\u0026quot;:\u0026quot;리사\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Lisa\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;가끔 좀 심심하지만 좋은 점도 있어요. 하숙집에 살 때는 항상 조용히 해야 했었는데 이제는 집에서 드라마나 음악을 크게 들을 수도 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Thỉnh thoảng hơi buồn nhưng cũng có cái hay. Hồi ở nhà trọ lúc nào cũng phải giữ yên lặng, giờ thì ở nhà tôi có thể mở phim hay nhạc to cũng được.\u0026quot;,\u0026quot;start\u0026quot;:43.12,\u0026quot;end\u0026quot;:64.24,\u0026quot;w\u0026quot;:[43.12,43.82,44.7,46.1,47.2,47.68,48.58,51.22,51.54,51.94,53.18,54.22,54.5,55.1,57.16,58.36,59.76,60.88,61.66,62.28,62.46]},{\u0026quot;who\u0026quot;:\u0026quot;후안\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Juan\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;아, 정말 편하겠네요. 저도 학교 근처에서 혼자 살까 봐요. 집이 학교에서 너무 멀어서요. 사실 얼마 전부터 고민했는데 오늘 부모님께 한 번 얘기해 봐야겠어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;À, chắc thoải mái thật đấy. Có lẽ tôi cũng sẽ sống một mình gần trường. Vì nhà tôi xa trường quá. Thật ra tôi đã đắn đo từ mấy hôm trước, hôm nay chắc phải nói thử với bố mẹ một lần.\u0026quot;,\u0026quot;start\u0026quot;:64.24,\u0026quot;end\u0026quot;:85.68,\u0026quot;w\u0026quot;:[64.24,66.92,67.6,69.2,69.9,70.36,71.06,71.6,72.08,73.7,74.4,75.5,76.1,78.32,79.02,79.82,80.36,81.3,82.54,83.58,83.93,84.28,85.02]},{\u0026quot;who\u0026quot;:\u0026quot;리사\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Lisa\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;그래요? 그럼 우리 집 근처로 오세요. 후안 씨가 이사하게 되면 제가 도와줄게요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vậy à? Thế thì chuyển đến gần nhà tôi đi. Nếu Juan chuyển nhà thì tôi sẽ giúp cho.\u0026quot;,\u0026quot;start\u0026quot;:85.68,\u0026quot;end\u0026quot;:99.72,\u0026quot;w\u0026quot;:[85.68,88.8,89.54,90.74,91.12,91.94,94.18,94.88,95.28,96.42,96.88,97.98]}],\u0026quot;source\u0026quot;:{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;file\u0026quot;:\u0026quot;2_19.mp3\u0026quot;}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eTiếng Hàn\u003c/th\u003e\u003cth\u003eNghĩa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eJuan\u003c/td\u003e\u003ctd lang=\"ko\"\u003e리사 씨, 요즘 혼자 사니까 어때요? 하숙집에 살 때보다 편해요?\u003c/td\u003e\u003ctd\u003eLisa ơi, dạo này sống một mình thấy thế nào? Có thoải mái hơn hồi ở nhà trọ không?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLisa\u003c/td\u003e\u003ctd lang=\"ko\"\u003e네, 편하고 좋아요. 방도 넓고요.\u003c/td\u003e\u003ctd\u003eVâng, thoải mái và thích lắm. Phòng cũng rộng nữa.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJuan\u003c/td\u003e\u003ctd lang=\"ko\"\u003e혼자 살면 심심하거나 무섭지 않아요?\u003c/td\u003e\u003ctd\u003eSống một mình không thấy buồn chán hay sợ à?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLisa\u003c/td\u003e\u003ctd lang=\"ko\"\u003e가끔 좀 심심하지만 좋은 점도 있어요. 하숙집에 살 때는 항상 조용히 해야 했었는데 이제는 집에서 드라마나 음악을 크게 들을 수도 있어요.\u003c/td\u003e\u003ctd\u003eThỉnh thoảng hơi buồn nhưng cũng có cái hay. Hồi ở nhà trọ lúc nào cũng phải giữ yên lặng, giờ thì ở nhà tôi có thể mở phim hay nhạc to cũng được.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJuan\u003c/td\u003e\u003ctd lang=\"ko\"\u003e아, 정말 편하겠네요. 저도 학교 근처에서 혼자 살까 봐요. 집이 학교에서 너무 멀어서요. 사실 얼마 전부터 고민했는데 오늘 부모님께 한 번 얘기해 봐야겠어요.\u003c/td\u003e\u003ctd\u003eÀ, chắc thoải mái thật đấy. Có lẽ tôi cũng sẽ sống một mình gần trường. Vì nhà tôi xa trường quá. Thật ra tôi đã đắn đo từ mấy hôm trước, hôm nay chắc phải nói thử với bố mẹ một lần.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLisa\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그래요? 그럼 우리 집 근처로 오세요. 후안 씨가 이사하게 되면 제가 도와줄게요.\u003c/td\u003e\u003ctd\u003eVậy à? Thế thì chuyển đến gần nhà tôi đi. Nếu Juan chuyển nhà thì tôi sẽ giúp cho.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e36:T3083,\u003ch3\u003e1 · Email của thầy hiệu trưởng\u003c/h3\u003e\n\u003cp\u003eJason – bạn cùng lớp, giáo viên tiếng Anh ở một trường tiểu học – nhận email của thầy hiệu trưởng trước ngày\nkhai giảng.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e받는 사람 / 보낸 사람\u003c/span\u003e – người nhận / người gửi · \u003cspan lang=\"ko\"\u003e제목\u003c/span\u003e –\ntiêu đề · \u003cspan lang=\"ko\"\u003e돌아오다\u003c/span\u003e – trở về · \u003cspan lang=\"ko\"\u003e곧\u003c/span\u003e – sắp · \u003cspan lang=\"ko\"\u003e개학\u003c/span\u003e –\nkhai giảng · \u003cspan lang=\"ko\"\u003e원어민\u003c/span\u003e – người bản ngữ · \u003cspan lang=\"ko\"\u003e계속\u003c/span\u003e – suốt ·\n\u003cspan lang=\"ko\"\u003e-(으)실래요?\u003c/span\u003e – kính ngữ của \u003cspan lang=\"ko\"\u003e-(으)ㄹ래요?\u003c/span\u003e · \u003cspan lang=\"ko\"\u003e교장\u003c/span\u003e –\nhiệu trưởng · \u003cspan lang=\"ko\"\u003e드림\u003c/span\u003e – kính thư.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;titleKo\u0026quot;:\u0026quot;다음 주에 학교에 오실래요?\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;받는 사람: 제이슨〈jasonmckay@kmail.com〉\\n보낸 사람: 박경일〈kipark64@hanmail.com〉\\n제목: 다음 주에 학교에 오실래요?\\n\\n제이슨 씨,\\n\\n안녕하세요. 박경일입니다.\\n방학 잘 보내셨어요? 미국에서 돌아오셨지요?\\n곧 개학입니다. 그래서 원어민 선생님들과 함께 먼저 회의를 하고 싶습니다.\\n다음 주에 언제 시간이 괜찮으세요?\\n저는 다음 주에 계속 출근하니까 다음 주에 한 번 학교에 오실래요?\\n메일 확인하시면 답장 주세요.\\n\\n교장 박경일 드림\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Người nhận: Jason〈jasonmckay@kmail.com〉\\nNgười gửi: Park Kyung-il〈kipark64@hanmail.com〉\\nTiêu đề: Tuần sau anh đến trường được không?\\n\\nAnh Jason,\\n\\nXin chào. Tôi là Park Kyung-il.\\nKỳ nghỉ của anh vui chứ? Anh đã từ Mỹ về rồi phải không?\\nSắp khai giảng rồi. Vì vậy tôi muốn họp trước với các thầy cô giáo bản ngữ.\\nTuần sau anh rảnh vào lúc nào?\\nTuần sau tôi đi làm suốt, nên anh ghé trường một lần vào tuần sau nhé?\\nXem thư xong anh trả lời giúp tôi.\\n\\nHiệu trưởng Park Kyung-il\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Khung cửa sổ trình duyệt email nền xanh nhạt với ba ô Người nhận, Người gửi, Tiêu đề và nội dung thư.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;집들이\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tiệc tân gia (mời khách đến nhà mới)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;손님을 맞이하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đón khách\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;음식을 차리다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bày đồ ăn, dọn cỗ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;휴지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giấy vệ sinh, giấy ăn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;세제\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nước giặt, bột giặt (chất tẩy rửa)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선물을 가져가다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mang quà đến\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;돌잔치\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tiệc thôi nôi (mừng em bé tròn một tuổi)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;손님을 대접하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tiếp đãi khách\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;장난감\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đồ chơi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;금반지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhẫn vàng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;미리 연락하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;liên lạc trước\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;약속 시간을 정하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;định giờ hẹn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;늦지 않게 도착하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đến nơi không muộn, đến đúng giờ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;노크를 하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;gõ cửa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;인사를 나누다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chào hỏi nhau\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;명함을 건네다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;trao danh thiếp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;방학\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kỳ nghỉ (của trường học)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;개학\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;khai giảng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;원어민\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;người bản ngữ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;확인\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kiểm tra, xác nhận\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;답장\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thư trả lời, hồi âm\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;교장\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hiệu trưởng\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e다음 주에 학교에 오실래요?\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e받는 사람: 제이슨〈jasonmckay@kmail.com〉\u003cbr\u003e보낸 사람: 박경일〈kipark64@hanmail.com〉\u003cbr\u003e제목: 다음 주에 학교에 오실래요?\u003cbr\u003e\u003cbr\u003e제이슨 씨,\u003cbr\u003e\u003cbr\u003e안녕하세요. 박경일입니다.\u003cbr\u003e방학 잘 보내셨어요? 미국에서 돌아오셨지요?\u003cbr\u003e곧 개학입니다. 그래서 원어민 선생님들과 함께 먼저 회의를 하고 싶습니다.\u003cbr\u003e다음 주에 언제 시간이 괜찮으세요?\u003cbr\u003e저는 다음 주에 계속 출근하니까 다음 주에 한 번 학교에 오실래요?\u003cbr\u003e메일 확인하시면 답장 주세요.\u003cbr\u003e\u003cbr\u003e교장 박경일 드림\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eNgười nhận: Jason〈jasonmckay@kmail.com〉\u003cbr\u003eNgười gửi: Park Kyung-il〈kipark64@hanmail.com〉\u003cbr\u003eTiêu đề: Tuần sau anh đến trường được không?\u003cbr\u003e\u003cbr\u003eAnh Jason,\u003cbr\u003e\u003cbr\u003eXin chào. Tôi là Park Kyung-il.\u003cbr\u003eKỳ nghỉ của anh vui chứ? Anh đã từ Mỹ về rồi phải không?\u003cbr\u003eSắp khai giảng rồi. Vì vậy tôi muốn họp trước với các thầy cô giáo bản ngữ.\u003cbr\u003eTuần sau anh rảnh vào lúc nào?\u003cbr\u003eTuần sau tôi đi làm suốt, nên anh ghé trường một lần vào tuần sau nhé?\u003cbr\u003eXem thư xong anh trả lời giúp tôi.\u003cbr\u003e\u003cbr\u003eHiệu trưởng Park Kyung-il\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#7/ex-p79-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p79-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기 1\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;다음 글을 읽고 질문에 답해 보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đọc bài sau rồi trả lời câu hỏi.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;교장 선생님이 제이슨 씨에게 이메일을 왜 썼어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Vì sao thầy hiệu trưởng viết email cho Jason?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;회의를 하고 싶어서 이메일을 썼어요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;회의를 하고 싶어서 이메일을 썼어요.\u0026quot;,\u0026quot;미국에 가고 싶어서 이메일을 썼어요.\u0026quot;,\u0026quot;방학 이야기를 하고 싶어서 이메일을 썼어요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;교장 선생님은 제이슨 씨를 언제 만나고 싶어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Thầy hiệu trưởng muốn gặp Jason khi nào?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;다음 주에 만나고 싶어 해요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;다음 주에 만나고 싶어 해요.\u0026quot;,\u0026quot;이번 주에 만나고 싶어 해요.\u0026quot;,\u0026quot;방학에 만나고 싶어 해요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;메일을 읽은 다음에 제이슨 씨가 무엇을 할까요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Đọc thư xong Jason sẽ làm gì?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;답장을 쓸 거예요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;답장을 쓸 거예요.\u0026quot;,\u0026quot;교장 선생님한테 선물을 보낼 거예요.\u0026quot;,\u0026quot;미국에 갈 거예요.\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · thầy hiệu trưởng viết gì cho Jason?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e다음 글을 읽고 질문에 답해 보세요.\u003c/span\u003e\u003c/strong\u003e – Đọc bài sau rồi trả lời câu hỏi.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e교장 선생님이 제이슨 씨에게 이메일을 왜 썼어요?\u003c/span\u003e \u003csmall\u003e(회의를 하고 싶어서 이메일을 썼어요. / 미국에 가고 싶어서 이메일을 썼어요. / 방학 이야기를 하고 싶어서 이메일을 썼어요.)\u003c/small\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e교장 선생님은 제이슨 씨를 언제 만나고 싶어요?\u003c/span\u003e \u003csmall\u003e(다음 주에 만나고 싶어 해요. / 이번 주에 만나고 싶어 해요. / 방학에 만나고 싶어 해요.)\u003c/small\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e메일을 읽은 다음에 제이슨 씨가 무엇을 할까요?\u003c/span\u003e \u003csmall\u003e(답장을 쓸 거예요. / 교장 선생님한테 선물을 보낼 거예요. / 미국에 갈 거예요.)\u003c/small\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003e2 · Thư trả lời của Jason\u003c/h3\u003e\n\u003cp\u003eBạn là Jason: viết thư trả lời thầy hiệu trưởng – cảm ơn, hẹn ngày đến trường, nói lý do chọn ngày đó.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#7/ex-p79-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p79-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기 2\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;write\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Viết thư trả lời – chạm thẻ hoặc tự gõ (잘 보냈습니다 = (kỳ nghỉ) vui ạ; 그날 = hôm đó; 가겠습니다 = 갈게요, trang trọng).\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;받는 사람: 박경일〈kipark64@hanmail.com〉\\n보낸 사람
