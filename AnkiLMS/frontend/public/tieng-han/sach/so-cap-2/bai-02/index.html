n đồ chơi</li><li><span lang="ko">저녁</span> – Bữa tối</li></ul><p><em>Ai nhận việc nào đây?</em></p><ul><li><span lang="ko">쓰레기는 내가 버릴게요.</span> – Rác để anh đi đổ.</li><li><span lang="ko">그럼 나는 청소기를 돌릴게요.</span> – Vậy em hút bụi nhé.</li></ul><p><em>Seul-gi ôm thùng đồ chơi chạy ra.</em></p><ul><li><span lang="ko">저는 노래하면서 장난감을 정리할게요!</span> – Con vừa hát vừa dọn đồ chơi ạ!</li></ul><p><em>Seul-gi ghé vào bếp. Bố đang nấu một món Hà Nội.</em></p><ul><li><span lang="ko">아빠, 엄마가 청소하는 동안에 뭐 해요?</span> – Bố ơi, trong lúc mẹ dọn nhà thì bố làm gì ạ?</li><li><span lang="ko">분짜를 만들어요. 오늘 저녁은 베트남 음식이에요!</span> – Bố làm bún chả. Tối nay ăn món Việt!</li></ul><p><em>Tối, cả nhà ngồi bệt giữa phòng khách sạch bóng.</em></p><ul><li><span lang="ko">와, 집이 정말 깨끗해요!</span> – Oa, nhà sạch quá ạ!</li><li><span lang="ko">다 같이 해서 빨리 끝났어요.</span> – Cả nhà cùng làm nên xong nhanh ghê.</li></ul><p><em>Ai nhận việc gì, vừa làm vừa làm gì? Học xong bài này, bạn hứa và kể được việc nhà.</em></p></div></figure></div></div><div class="v2-body mt-8"><div data-sach-page="mo-bai" class="sach-prose prose max-w-none"><p>Ba việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.</p>

003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저녁\u003c/span\u003e – Bữa tối\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eAi nhận việc nào đây?\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e쓰레기는 내가 버릴게요.\u003c/span\u003e – Rác để anh đi đổ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e그럼 나는 청소기를 돌릴게요.\u003c/span\u003e – Vậy em hút bụi nhé.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eSeul-gi ôm thùng đồ chơi chạy ra.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저는 노래하면서 장난감을 정리할게요!\u003c/span\u003e – Con vừa hát vừa dọn đồ chơi ạ!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eSeul-gi ghé vào bếp. Bố đang nấu một món Hà Nội.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아빠, 엄마가 청소하는 동안에 뭐 해요?\u003c/span\u003e – Bố ơi, trong lúc mẹ dọn nhà thì bố làm gì ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e분짜를 만들어요. 오늘 저녁은 베트남 음식이에요!\u003c/span\u003e – Bố làm bún chả. Tối nay ăn món Việt!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eTối, cả nhà ngồi bệt giữa phòng khách sạch bóng.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e와, 집이 정말 깨끗해요!\u003c/span\u003e – Oa, nhà sạch quá ạ!\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e다 같이 해서 빨리 끝났어요.\u003c/span\u003e – Cả nhà cùng làm nên xong nhanh ghê.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eAi nhận việc gì, vừa làm vừa làm gì? Học xong bài này, bạn hứa và kể được việc nhà.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eBa việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"nhiem-vu\" data-props=\"{\u0026quot;lesson\u0026quot;:\u0026quot;so-cap-2/bai-02\u0026quot;,\u0026quot;viec\u0026quot;:[{\u0026quot;key\u0026quot;:\u0026quot;nhan-viec\u0026quot;,\u0026quot;label\u0026quot;:{\u002 atchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;ㄹ게요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;할게요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;사다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;살게요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;올게요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ (giữ ㄹ)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;게요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만들게요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;널다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;널게요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄷ (듣다, 걷다): ㄷ đổi thành ㄹ trước 을\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;들을게요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;걷다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;걸을게요\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㄹ게요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;hứa, nhận việc với người trước mặt – chỉ việc của mình\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;제가 버릴게요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Để tôi đổ.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㄹ 거예요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;kể kế hoạch; hỏi người khác\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;누가 버릴 거예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ai sẽ đi đổ?\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;만들을게요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;만들게요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Gốc có patchim ㄹ: không thêm 을.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;누가 할게요?\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;누가 할 거예요?\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Hỏi người khác thì không dùng -(으)ㄹ게요.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e동-을게요\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Để tôi …\u0026quot; – nhận làm một việc và hứa với người đang nghe. Chỉ nói việc của chính mình.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e을게요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e찍다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찍을게요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽을게요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㄹ게요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e할게요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e사다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e살게요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e오다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e올게요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ (giữ ㄹ)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e게요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들게요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e널다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e널게요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 방이 좀 더럽네요.\u003c/span\u003e – A: Phòng hơi bẩn nhỉ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 미안해요. 지금 청소할게요.\u003c/span\u003e – B: Xin lỗi. Tôi dọn ngay đây.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 누가 쓰레기를 버릴 거예요?\u003c/span\u003e – A: Ai sẽ đi đổ rác?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 제가 버릴게요.\u003c/span\u003e – B: Để tôi đổ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e오늘 저녁은 제가 만들게요.\u003c/span\u003e – Bữa tối hôm nay để tôi nấu.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e사진은 제가 찍을게요.\u003c/span\u003e – Ảnh để tôi chụp cho.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eBố mẹ Hàn hay tự gọi mình là \u003cspan lang=\"ko\"\u003e엄마\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e아빠\u003c/span\u003e khi nói với con:\n\u003cspan lang=\"ko\"\u003e설거지는 엄마가 할게요\u003c/span\u003e – mẹ rửa bát cho.\u003c/p\u003e\n2e:T295f,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eumyeonseo\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)면서\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;두 가지 이상의 행동이 동시에 이루어짐을 나타냅니다. 두 가지 동작을 동시에 하거나 두 가지 상태가 동시에 유지될 때 사용합니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-으면서/-면서 – \\\u0026quot;vừa … vừa …\\\u0026quot;: hai hành động diễn ra cùng lúc hoặc hai trạng thái cùng tồn tại; hai vế cùng chủ ngữ. Thân có 받침 dùng -으면서, không 받침 hoặc ㄹ 받침 dùng -면서; danh từ + 이면서/면서.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹으면서\u0026quot;],[\u0026quot;받침 ×, ㄹ 받침\u0026quot;,\u0026quot;가다, 살다\u0026quot;,\u0026quot;가면서, 살면서\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 집에 가서 뭐 할 거예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Về nhà bạn sẽ làm gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 저녁을 먹으면서 텔레비전을 볼 거예요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Tôi sẽ vừa ăn tối vừa xem ti vi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u00 an\u003e – túi rác tính phí theo lượng,\nmua ở cửa hàng tiện lợi, siêu thị; mỗi quận một loại túi. Rác thực phẩm đổ riêng: túi riêng, thùng riêng, hoặc máy cân\nrác ở chung cư (quẹt thẻ rồi đổ).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐồ tái chế.\u003c/strong\u003e Giấy, nhựa, chai lọ, lon bỏ vào thùng phân loại – \u003cspan lang=\"ko\"\u003e분리수거\u003c/span\u003e. Chai nhựa trong\n(\u003cspan lang=\"ko\"\u003e페트병\u003c/span\u003e) bóc nhãn, tráng sạch, ép dẹt; thùng giấy gấp phẳng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNgày giờ và đồ to.\u003c/strong\u003e Mỗi khu có ngày, giờ đổ riêng: chung cư thường có ngày phân loại rác trong tuần, nhà riêng để\nrác trước cửa vào buổi tối ngày quy định. Đồ to như tủ, ghế, sofa phải đăng ký và dán tem rồi mới được bỏ.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eĐổ sai loại, sai ngày có thể bị nhắc, thậm chí bị phạt tiền. Mới chuyển đến, hãy hỏi lịch đổ rác ở phòng\nquản lý toà nhà (\u003cspan lang=\"ko\"\u003e관리사무소\u003c/span\u003e).\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eHỏi chỗ đổ rác\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu khi hỏi hàng xóm cách đổ rác.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-02/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;쓰레기는 어디에 버려요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Rác thì đổ ở đâu ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저기 분리수거장에 버려요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đổ ở chỗ phân loại rác đằng kia.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;분리수거는 무슨 요일에 해요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Phân loại rác vào thứ mấy ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;수요일 저녁에 해요.\
