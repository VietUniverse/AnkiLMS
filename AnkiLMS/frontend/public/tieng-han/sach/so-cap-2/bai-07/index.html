n không nói được tiếng Hàn thì sao ạ?</li><li><span lang="ko">괜찮아. 성민이 아빠가 한국 사람이니까 한국말도 할 거야.</span> – Không sao. Bố bạn ấy là người Hàn nên chắc bạn ấy cũng nói được tiếng Hàn.</li></ul><p><em>Cửa mở. Chị Go Cheon và anh Yeong-uk ra đón. Seong-min nấp sau lưng mẹ.</em></p><ul><li><span lang="ko">어서 와요! 이사 때문에 집이 좀 복잡해요.</span> – Vào đi em! Mới chuyển nhà nên nhà còn bừa lắm.</li></ul><ul><li><span lang="ko">엄마, 나 오늘 성민이하고 놀래!</span> – Mẹ ơi, hôm nay con sẽ chơi với Seong-min!</li><li><span lang="ko">저도 오늘은 성민이하고 놀까 봐요.</span> – Chắc hôm nay em cũng chơi với Seong-min thôi, chị ạ.</li></ul><p><em>Vì sao, vì cái gì, định làm gì – học xong bài này, bạn nói được lý do và dự định.</em></p></div></figure></div></div><div class="v2-body mt-8"><div data-sach-page="mo-bai" class="sach-prose prose max-w-none"><p>Ba việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.</p>

cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e성민이도 있어?\u003c/span\u003e – Seong-min cũng ở đó ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e응, 방학이라서 중국에서 왔어.\u003c/span\u003e – Ừ, nghỉ hè nên bạn ấy từ Trung Quốc sang.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eSeong-min bằng tuổi Seul-gi, lâu nay sống với ông bà ngoại ở Trung Quốc. Hè này sang chơi – cuối năm sẽ sang ở hẳn. Đến trước cửa, Seul-gi níu áo mẹ.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e성민이가 한국말을 못 하면 어떻게 해?\u003c/span\u003e – Nhỡ Seong-min không nói được tiếng Hàn thì sao ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e괜찮아. 성민이 아빠가 한국 사람이니까 한국말도 할 거야.\u003c/span\u003e – Không sao. Bố bạn ấy là người Hàn nên chắc bạn ấy cũng nói được tiếng Hàn.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eCửa mở. Chị Go Cheon và anh Yeong-uk ra đón. Seong-min nấp sau lưng mẹ.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e어서 와요! 이사 때문에 집이 좀 복잡해요.\u003c/span\u003e – Vào đi em! Mới chuyển nhà nên nhà còn bừa lắm.\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e엄마, 나 오늘 성민이하고 놀래!\u003c/span\u003e – Mẹ ơi, hôm nay con sẽ chơi với Seong-min!\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저도 오늘은 성민이하고 놀까 봐요.\u003c/span\u003e – Chắc hôm nay em cũng chơi với Seong-min thôi, chị ạ.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eVì sao, vì cái gì, định làm gì – học xong bài này, bạn nói được lý do và dự định.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eBa việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"nhiem-vu\" data-props=\"{\u0026quot;lesson\u0026quot;:\u0026quot;so-cap-2/bai-07\u0026quot;,\u0026quot;viec\u0026quot;:[{\u0026quot;key\u0026quot;:\u0026quot;ly-do\u0026quot;,\u0026quot;label\u0026quot;:{\u0026quot;vi\u0026quot;:\u n / bất tiện\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e밝다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003esáng sủa – 거실이 밝아요.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2c:Ta54,\u003cp\u003e\u003cspan lang=\"ko\"\u003e초대\u003c/span\u003e đọc là \u003cem\u003echiêu đãi\u003c/em\u003e – trong tiếng Hàn nghĩa là \u0026quot;mời\u0026quot;. Các từ nhà cửa, tân gia dưới đây cũng là chữ\nHán: đoán thử xem.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"han-viet\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;step2#7/han-viet\u0026quot;,\u0026quot;pairs\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;초대\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;chiêu đãi\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mời\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이사\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;di tỉ\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chuyển nhà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;휴지\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;hưu chỉ\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giấy vệ sinh, giấy ăn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;세제\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;tẩy tễ\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nước giặt, chất tẩy rửa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;선물\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;thiện vật\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;quà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;대접\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;đãi tiếp\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tiếp đãi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;화장실\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;hoá trang thất\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà vệ sinh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;거실\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;cư thất\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phòng khách\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;하숙\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;hạ túc\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ở trọ (có nấu ăn)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;방학\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;phóng học\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kỳ nghỉ của trường\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTiếng Hàn\u003c/th\u003e\u003cth\u003eHán Việt\u003c/th\u003e\u003cth\u003eNghĩa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e초대\u003c/span\u003e\u003c/td\u003e\u003ctd\u003echiêu đãi\u003c/td\u003e\u003ctd\u003emời\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e이사\u003c/span\u003e\u003c/td\u003e\u003ctd\u003edi tỉ\u003c/td\u003e\u003ctd\u003echuyển nhà\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e휴지\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ehưu chỉ\u003c/td\u003e\u003ctd\u003egiấy vệ sinh, giấy ăn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e세제\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etẩy tễ\u003c/td\u003e\u003ctd\u003enước giặt, chất tẩy rửa\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e선물\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ethiện vật\u003c/td\u003e\u003ctd\u003equà\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e대접\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eđãi tiếp\u003c/td\u003e\u003ctd\u003etiếp đãi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e화장실\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ehoá trang thất\u003c/td\u003e\u003ctd\u003enhà vệ sinh\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e거실\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ecư thất\u003c/td\u003e\u003ctd\u003ephòng khách\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e하숙\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ehạ túc\u003c/td\u003e\u003ctd\u003eở trọ (có nấu ăn)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e방학\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ephóng học\u003c/td\u003e\u003ctd\u003ekỳ nghỉ của trường\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2d:T2495,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eunikka\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-(으)니까\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;어떤 일의 이유나 원인을 말할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;vì … nên …\\\u0026quot;: gắn sau động từ / tính từ để nêu lý do, nguyên nhân. Khác -어서: dùng được với câu đề nghị (-을까요?, -읍시다) và mệnh lệnh (-으세요). Gốc có patchim + -으니까; không có patchim + -니까; gốc tận cùng ㄹ bỏ ㄹ (힘들다 → 힘드니까). Danh từ + 이다 → 이니까.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-으니까 (받침 O)\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹으니까\u0026quot;],[\u0026quot;-으니까 (받침 O)\u0026quot;,\u0026quot;많다\u0026quot;,\u0026quot;많으니까\u0026quot;],[\u0026quot;-니까 (받침 X)\u0026quot;,\u0026quot;사다\u0026quot;,\u0026quot;사니까\u0026quot;],[\u0026quot;-니까 (★ ㄹ 받침)\u0026quot;,\u0026quot;힘들다\u0026quot;,\u0026quot;힘드니까\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 날씨가 좋으니까 산책하러 나갈까요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Trời đẹp nên mình ra ngoài đi dạo nhé?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 지금은 좀 더우니까 이따가 갑시다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Bây giờ hơi nóng, lát nữa hãy đi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;내일 중요한 회의가 있으니까 늦지 마세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mai có cuộc họp quan trọng nên đừng đến muộn nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;밖에 비가 오니까 우산을 쓰세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngoài trời đang mưa nên hãy che ô.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;성민이 아빠가 한국 사람이니까 한국말도 할 거예요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bố Seong-min là người Hàn nên chắc bạn ấy cũng nói được tiếng Hàn.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Văn phòng có dãy máy tính: người đàn ông vest nâu đứng sau bàn dặn dò; người phụ nữ tóc đen dài đeo kính, áo vest xanh, đeo túi đỏ đang chuẩn bị về. Bong bóng thoại: \\\u0026quot;내일 중요한 회의가 있으니까 늦지 마세요.\\\u0026quot; – \\\u0026quot;네, 일찍 오겠습니다.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Vì … nên …\\\u0026quot; – nói lý do; câu sau hay là lời bảo, lời mời, lời rủ (-(으)세요, -(으)ㅂ시다, -(으)ㄹ까요?).\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-으니까\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹으니까\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;많다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;많으니까\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;있으니까\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-니까\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가니까\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;오니까\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;바쁘다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;바쁘니까\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ có patchim\u00 ko\"\u003e일요일\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e일요일이기 때문에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e학생\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e학생이기 때문에\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ (vì cái đó, tại cái đó)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e때문에\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e이사\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e이사 때문에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e비\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e비 때문에\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 저녁에 영화 보러 같이 갈래요?\u003c/span\u003e – A: Tối nay đi xem phim cùng nhé?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 미안해요. 숙제가 많기 때문에 오늘은 못 가요.\u003c/span\u003e – B: Xin lỗi. Bài tập nhiều nên hôm nay tôi không đi được.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e길이 많이 막히기 때문에 지하철을 탔어요.\u003c/span\u003e – Đường tắc lắm nên tôi đã đi tàu điện ngầm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e오늘은 일요일이기 때문에 회사에 안 가요.\u003c/span\u003e – Hôm nay là Chủ nhật nên tôi không đi làm.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이사 때문에 집이 좀 복잡해요.\u003c/span\u003e – Mới chuyển nhà nên nhà còn bừa.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eThử ngay: câu nào chỉ dùng được \u003cspan lang=\"ko\"\u003e-(으)니까\u003c/span\u003e, câu nào dùng được cả hai? Xếp mỗi câu vào đúng ô.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-07/xep-cho-2\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;니까\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;chỉ -(으)니까 – sau là lời bảo, mời, rủ\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;니까 · 기 때문에\u0026quot;,\u0026quot;vi\u0026quot; quot;vi\u0026quot;:\u0026quot;Nhìn đuôi câu sau: bảo, mời, rủ → chỉ 니까. Câu kể → cả hai đều được.\u0026quot;},\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e길이 막히___ 지하철을 탑시다. · 감기에 걸렸___ 학교에 못 갔어요. · 비가 오___ 우산을 가져가세요. · 음식이 맛있___ 손님이 많아요. · 피곤하___ 집에서 쉬세요. · 숙제가 많___ 오늘은 못 가요. · 날씨가 좋___ 공원에 갈까요? · 오늘은 일요일이___ 회사에 안 가요. · 시간이 없___ 빨리 오세요.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e니까\u003c/span\u003e – chỉ -(으)니까 – sau là lời bảo, mời, rủ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e니까 · 기 때문에\u003c/span\u003e – cả hai đều được – sau là câu kể\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e-(으)ㄹ까 보다\u003c/span\u003e – “chắc tôi sẽ …”\u003c/h3\u003e\n\u003cp\u003e\u003cspan lang=\"ko\"\u003e피곤하니까 오늘은 집에서 쉴까 봐요.\u003c/span\u003e – Mệt quá, chắc hôm nay tôi ở nhà nghỉ thôi.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eulkka-boda\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)ㄹ까 보다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;어떤 행동을 하기로 확실히 결정한 것은 아니지만 그렇게 하려는 생각이 있음을 나타냅니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-을까/ㄹ까 보다 – \\\u0026quot;định là …, chắc tôi sẽ … (chưa chắc chắn)\\\u0026quot;: gắn sau động từ, diễn tả ý định làm gì nhưng chưa quyết định hẳn. Thân có 받침 dùng -을까 보다, không 받침 hoặc 받침 ㄹ dùng -ㄹ까 보다 (ㄹ của thân rơi).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹을까 보다\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;갈까 보다\u0026quot;],[\u0026quot;ㄹ 받침\u0026quot;,\u0026quot;살다\u0026quot;,\u0026quot;살까 보다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 날씨가 좋네요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Trời đẹp nhỉ.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 네, 저녁에 산책을 좀 할까 봐요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Vâng, chắc tối nay tôi sẽ đi dạo một chút.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;피곤하니까 오늘은 집에서 쉴까 봐요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mệt quá, chắc hôm nay tôi ở nhà nghỉ thôi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저도 오늘은 성민이하고 놀까 봐요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chắc hôm nay tôi cũng chơi với Seong-min thôi.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Hai tranh nhỏ: tranh trên là chàng trai đeo kính ngồi bên bàn tròn có máy tính xách tay và cốc đồ uống trong quán cà phê buổi tối, cửa kính sau lưng có ánh đèn xanh; tranh dưới là bầu trời đêm đầy sao tím trên mặt biển, một người đứng trên đồi cỏ xanh.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Chắc tôi sẽ …, có lẽ tôi …\\\u0026quot; – nói dự định của chính mình (저, 우리), chưa quyết hẳn; đứng cuối câu: -(으)ㄹ까 봐요.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-을까 봐요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹을까 봐요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;읽을까 봐요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-ㄹ까 봐요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;쉬다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;쉴까 봐요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;하다\u0026quot;,\u0026quot;dang\u0026quot;:\  sẻ\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e세제\u003c/span\u003e – nước giặt – mong tiền vào như bọt xà phòng\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eTân gia.\u003c/strong\u003e Chuyển đến nhà mới, người Hàn mời gia đình, bạn bè, đồng nghiệp đến chơi – gọi là\n\u003cspan lang=\"ko\"\u003e집들이\u003c/span\u003e. Chủ nhà bày đồ ăn (\u003cspan lang=\"ko\"\u003e음식을 차리다\u003c/span\u003e) rồi dẫn khách đi xem nhà.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQuà tân gia.\u003c/strong\u003e Người ta hay tặng đồ dùng hằng ngày. \u003cspan lang=\"ko\"\u003e휴지\u003c/span\u003e – cuộn giấy gỡ ra dễ dàng\n(\u003cspan lang=\"ko\"\u003e잘 풀리다\u003c/span\u003e), mong mọi việc của chủ nhà suôn sẻ. \u003cspan lang=\"ko\"\u003e세제\u003c/span\u003e – mong tiền vào nhiều\nnhư bọt xà phòng. Chủ nhà hay nói \u003cspan lang=\"ko\"\u003e그냥 오세요\u003c/span\u003e, nhưng khách vẫn mang một món nhỏ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVào nhà.\u003c/strong\u003e Cởi giày ở \u003cspan lang=\"ko\"\u003e현관\u003c/span\u003e – chỗ để giày ngay cửa – rồi mới bước lên sàn. Muốn xem nhà thì hỏi\n\u003cspan lang=\"ko\"\u003e집 구경해도 돼요?\u003c/span\u003e – tôi xem nhà một chút được không?\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eĐến đúng giờ hẹn, đến muộn thì gọi báo trước. Chủ nhà chưa mời thì đừng tự mở cửa phòng ngủ, cửa tủ lạnh.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eỞ nhà người quen\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu của một buổi đến thăm.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-07/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;초대해 주셔서 감사합니다.\u0026quot;,\u0026quot;v
