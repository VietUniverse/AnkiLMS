c/td\u003e\u003ctd lang=\"ko\"\u003e여러분도 청도로 놀러 오세요.\u003c/td\u003e\u003ctd\u003eCác bạn cũng hãy đến Thanh Đảo chơi nhé.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T1c7f,\u003cp\u003eBài đọc của giáo trình: Trương kể chuyện đi dã ngoại với các bạn, rồi tả mình trong bức ảnh chụp hôm đó. Chạm từ hoặc\ncâu để xem nghĩa.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e밑\u003c/span\u003e – dưới (gốc cây) · \u003cspan lang=\"ko\"\u003e바지\u003c/span\u003e – quần ·\n\u003cspan lang=\"ko\"\u003e메다\u003c/span\u003e – đeo (ba lô) · \u003cspan lang=\"ko\"\u003e찍은 사진\u003c/span\u003e – bức ảnh đã chụp ·\n\u003cspan lang=\"ko\"\u003e입은 / 멘 사람\u003c/span\u003e – người mặc / người đeo.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;나는 반 친구들하고 같이 공원에 소풍을 갔습니다. 우리는 큰 나무 밑에 앉아서 이야기를 하고 놀았습니다.\\n이것은 그때 찍은 사진입니다. 나는 긴 머리에 짧은 바지를 입고 있습니다. 그리고 큰 가방을 메고 있습니다. 나는 어디에 있습니까? 나를 찾아보세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đã đi dã ngoại ở công viên cùng các bạn cùng lớp. Chúng tôi ngồi dưới gốc cây lớn, trò chuyện và vui chơi.\\nĐây là bức ảnh chụp lúc đó. Tôi để tóc dài và mặc quần ngắn. Và tôi đang đeo một chiếc ba lô to. Tôi ở đâu nhỉ? Hãy tìm tôi xem.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Công viên mùa hoa anh đào: dưới gốc cây anh đào lớn, ba người ngồi trên tấm thảm caro xanh có bánh mì, nho, giỏ picnic: bên trái cô gái tóc đen ngắn áo đỏ; ở giữa chàng trai tóc nâu áo xám; bên phải người tóc đen dài, áo xanh, quần ngắn, đeo ba lô to, cầm quả táo. Xung quanh có các nhóm người khác cũng đang picnic.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;멋있다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đẹp trai, phong độ, ngầu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;귀엽다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;dễ thương, đáng yêu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;얼굴\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;khuôn mặt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;까만색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu đen\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;빨간색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu đỏ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;하얀색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu trắng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;파란색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu xanh dương\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(사람)은 어떻게 생겼어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;(Ai đó) trông như thế nào?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;키가 크다/작다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cao / thấp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;머리가 길다/짧다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tóc dài / tóc ngắn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;소풍\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;dã ngoại, picnic\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e나는 반 친구들하고 같이 공원에 소풍을 갔습니다. 우리는 큰 나무 밑에 앉아서 이야기를 하고 놀았습니다.\u003cbr\u003e이것은 그때 찍은 사진입니다. 나는 긴 머리에 짧은 바지를 입고 있습니다. 그리고 큰 가방을 메고 있습니다. 나는 어디에 있습니까? 나를 찾아보세요.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eTôi đã đi dã ngoại ở công viên cùng các bạn cùng lớp. Chúng tôi ngồi dưới gốc cây lớn, trò chuyện và vui chơi.\u003cbr\u003eĐây là bức ảnh chụp lúc đó. Tôi để tóc dài và mặc quần ngắn. Và tôi đang đeo một chiếc ba lô to. Tôi ở đâu nhỉ? Hãy tìm tôi x uot;}},{\u0026quot;ko\u0026quot;:\u0026quot;{que-mon}{을|를} 좋아해요.\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Tôi thích {que-mon-vi}.\u0026quot;},\u0026quot;dung\u0026quot;:false,\u0026quot;pose\u0026quot;:\u0026quot;thac-mac\u0026quot;,\u0026quot;phanUng\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Em hỏi món nổi tiếng ở quê bạn cơ, không phải món bạn thích.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;{que-mon}{이|가} 유명해요. {que-tieng}로 \u0026#39;{que-mon-goi}\u0026#39;{이라고|라고} 해요.\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;{que-mon-vi} nổi tiếng. Trong {que-tieng-vi} gọi là \\\u0026quot;{que-mon-vi}\\\u0026quot;.\u0026quot;},\u0026quot;dung\u0026quot;:true,\u0026quot;pose\u0026quot;:\u0026quot;vui\u0026quot;,\u0026quot;phanUng\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Anaïs: {que-mon-vi}? Em muốn ăn thử!\u0026quot;},\u0026quot;phanUngKo\u0026quot;:\u0026quot;와, 먹고 싶어요!\u0026quot;}]}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003eTan lớp, Anaïs quay sang bạn.\u003c/p\u003e\u003cp\u003eAnaïs\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e민 씨는 고향이 어디예요?\u003c/p\u003e\u003cp\u003e민 quê ở đâu ạ?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 제 고향은 하노이예요.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e고향은 어떤 곳이에요?\u003c/p\u003e\u003cp\u003eQuê bạn là nơi như thế nào?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 바다가 아름다운 곳이에요. / 사람이 많은 큰 도시예요. / 산이 많은 곳이에요.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e고향에서 무슨 음식이 유명해요?\u003c/p\u003e\u003cp\u003eỞ quê bạn món gì nổi tiếng?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 쌀국수가 유명해요. 베트남어로 \u0026#39;포\u0026#39;라고 해요.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eBạn và bạn thân trông thế nào?\u003c/h3\u003e\n\u003cp\u003eGiờ bạn kể về mình và một người bạn thân: tóc, dáng người, khuôn mặt.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#3/ex-p59-speak-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p59-speak-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;말하기·쓰기 과제 – 말하기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;speak\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Trả lời hai câu hỏi về dáng người (친한 친구 = bạn thân).\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;여러분은 어떻게 생겼어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Bạn trông như thế nào?\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;친한 친구의 머리와 키는 어때요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Tóc và chiều cao của người bạn thân của bạn thế nào?\u0026quot;}]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · bạn và bạn thân trông thế nào?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e\u003c/span\u003e\u003c/strong\u003e – Trả lời hai câu hỏi về dáng người (친한 친구 = bạn thân).\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e여러분은 어떻게 생겼어요?\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e친한 친구의 머리와 키는 어때요?\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e36:T3c70,\u003ch3\u003e1 · Đoạn của Huyền\u003c/h3\u003e\n\u003cp\u003eHuyền viết một đoạn giới thiệu quê, dán lên bảng tin của lớp: quê ở đâu, nơi đó thế nào, có gì nổi tiếng. Đoạn của bạn\ncũng viết theo thứ tự đó.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e제일\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e가장\u003c/span\u003e – nhất · \u003cspan lang=\"ko\"\u003e거의\u003c/span\u003e – hầu như ·\n\u003cspan lang=\"ko\"\u003e여러 개\u003c/span\u003e – nhiều (cái) · \u003cspan lang=\"ko\"\u003e베트남 말\u003c/span\u003e = \u003cspan lang=\"ko\"\u003e베트남어\u003c/span\u003e ·\n\u003cspan lang=\"ko\"\u003e-(이)라서\u003c/span\u003e – vì là.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;titleKo\u0026quot;:\u0026quot;제 고향은 베트남 하노이입니다\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;제 고향은 베트남 하노이입니다. 하노이는 베트남의 수도이고 베트남에서 제일 큰 도시입니다. 하노이에는 높은 건물이 많고 길도 복잡합니다. 특히 오토바이가 많아서 좀 복잡합니다. 하노이는 음식이 싸고 맛있습니다. 가장 유명한 음식은 쌀국수입니다. 베트남 말로는 ‘포’라고 합니다. 베트남 사람들은 거의 매일 ‘포’를 먹습니다. 하노이 근처에 유명한 관광지 ‘하롱베이’가 있습니다. 하롱베이에는 여러 개의 섬이 있어서 배를 타고 갑니다. 경치가 아름다운 곳이라서 외국 사람도 많이 옵니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Quê tôi là Hà Nội, Việt Nam. Hà Nội là thủ đô của Việt Nam và là thành phố lớn nhất Việt Nam. Ở Hà Nội có nhiều toà nhà cao và đường sá cũng đông đúc. Đặc biệt vì nhiều xe máy nên khá đông đúc. Ở Hà Nội đồ ăn rẻ và ngon. Món nổi tiếng nhất là phở. Tiếng Việt gọi là “phở”. Người Việt Nam ăn phở gần như mỗi ngày. Gần Hà Nội có khu du lịch nổi tiếng là “vịnh Hạ Long”. Vịnh Hạ Long có nhiều hòn đảo nên phải đi bằng thuyền. Vì là nơi có phong cảnh đẹp nên khách nước ngoài cũng đến rất nhiều.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Hai ảnh ghép: phố cổ Hà Nội đông đúc, người chở hàng chồng thùng trên xe máy, người ngồi ghế nhựa ven đường; vịnh Hạ Long nước xanh ngọc với những hòn đảo đá vôi và thuyền.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;오래된 건물\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;toà nhà cổ, công trình lâu đời\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;호수\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hồ (nước)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;맥주\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bia\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;박물관\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bảo tàng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;벚꽃\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hoa anh đào\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;절(사원)\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chùa (đền chùa)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;한강\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sông Hàn (Hangang)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;아오자이\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;áo dài (Việt Nam)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;쌀국수\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phở, bún (mì gạo)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;해산물\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hải sản\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;생선회\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;gỏi cá sống (sashimi kiểu Hàn)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;건물이 높다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;toà nhà cao\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;박물관이 많다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;có nhiều bảo tàng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;길이 복잡하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đường sá phức tạp, đông đúc\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;사람이 많다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đông người\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;야경이 아름답다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cảnh đêm đẹp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;교통이 편리하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giao thông thuận tiện\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;차가 많다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhiều xe\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;산과 강이 있다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;có núi và sông\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;한적하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vắng vẻ, yên tĩnh (thanh vắng)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;물이 깨끗하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nước trong sạch\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;공기가 깨끗하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;không khí trong lành\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;조용하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;yên tĩnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;경치가 아름답다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phong cảnh đẹp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;건물이 낮다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhà thấp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;특히\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đặc biệt là\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;관광지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;điểm du lịch, khu du lịch\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;섬\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đảo\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;오래되다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lâu đời, cũ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;건물\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;toà nhà, công trình\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;높다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cao\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;많다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhiều\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;복잡하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;phức tạp, đông đúc, lộn xộn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;야경\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cảnh đêm\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;아름답다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đẹp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;교통\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giao thông\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;편리하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tiện lợi, thuận tiện\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;한적하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vắng vẻ, thanh vắng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;깨끗하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sạch sẽ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;조용하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;yên tĩnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;낮다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thấp\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e제 고향은 베트남 하노이입니다\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e제 고향은 베트남 하노이입니다. 하노이는 베트남의 수도이고 베트남에서 제일 큰 도시입니다. 하노이에는 높은 건물이 많고 길도 복잡합니다. 특히 오토바이가 많아서 좀 복잡합니다. 하노이는 음식이 싸고 맛있습니다. 가장 유명한 음식은 쌀국수입니다. 베트남 말로는 ‘포’라고 합니다. 베트남 사람들은 거의 매일 ‘포’를 먹습니다. 하노이 근처에 유명한 관광지 ‘하롱베이’가 있습니다. 하롱베이에는 여러 개의 섬이 있어서 배를 타고 갑니다. 경치가 아름다운 곳이라서 외국 사람도 많이 옵니다.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eQuê tôi là Hà Nội, Việt Nam. Hà Nội là thủ đô của Việt Nam và là thành phố lớn nhất Việt Nam. Ở Hà Nội có nhiều toà nhà cao và đường sá cũng đông đúc. Đặc biệt vì nhiều xe máy nên khá đông đúc. Ở Hà Nội đồ ăn rẻ và ngon. Món nổi tiếng nhất là phở. Tiếng Việt gọi là “phở”. Người Việt Nam ăn phở gần như mỗi ngày. Gần Hà Nội có khu du lịch nổi tiếng là “vịnh Hạ Long”. Vịnh Hạ Long có nhiều hòn đảo nên phải đi bằng thuyền. Vì là nơi có phong cảnh đẹp nên khách nước ngoài cũng đến rất nhiều.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#1/ex-p19-1-ox\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p19-1-ox\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기 1\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;ox\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;윗글의 내용과 같으면 O, 다르면 X 하세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đúng với nội dung bài đọc thì chọn O, sai thì chọn X.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;이 사람의 고향은 베트남에서 두 번째로 큰 도시예요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Quê người này là thành phố lớn thứ hai Việt Nam.\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;X\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;이 도시는 버스가 많아서 복잡한 곳이에요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Thành phố này đông đúc vì nhiều xe buýt.\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;X\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;이 도시 근처에 유명한 관광지가 있어요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Gần thành phố này có điểm du lịch nổi tiếng.\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · đúng / sai về quê của Huyền\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e윗글의 내용과 같으면 O, 다르면 X 하세요.\u003c/span\u003e\u003c/strong\u003e – Đúng với nội dung bài đọc thì chọn O, sai thì chọn X.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 사람의 고향은 베트남에서 두 번째로 큰 도시예요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 도시는 버스가 많아서 복잡한 곳이에요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 도시 근처에 유명한 관광지가 있어요.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#1/ex-p19-1-q\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p19-1-q\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기 1\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u002
