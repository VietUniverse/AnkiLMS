"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;hago\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N하고 N\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;사람이나 물건을 나열할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Danh từ + 하고 + danh từ: nối hai (hay nhiều) danh từ khi liệt kê người hoặc đồ vật, nghĩa \\\u0026quot;và\\\u0026quot;, \\\u0026quot;với\\\u0026quot;. Gắn trực tiếp sau danh từ, không phân biệt có hay không có 받침. Thường dùng trong văn nói.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;하고\u0026quot;,\u0026quot;빵, 우유\u0026quot;,\u0026quot;빵하고 우유\u0026quot;],[\u0026quot;하고\u0026quot;,\u0026quot;커피, 케이크\u0026quot;,\u0026quot;커피하고 케이크\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;주문하세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mời chị gọi món.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;커피하고 케이크 주세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cho tôi cà phê và bánh kem.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 주스 한 병하고 녹차 세 잔 주세요.\\n나: 네, 잠시만 기다려 주세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Cho tôi một chai nước ép và ba cốc trà xanh.\\nB: Vâng, xin chờ một chút.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;냉장고에 과일하고 채소가 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trong tủ lạnh có trái cây và rau.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Ở quầy quán cà phê: nữ nhân viên tóc buộc đuôi ngựa, đeo tạp dề đen đứng sau máy tính tiền nói \\\u0026quot;주문하세요.\\\u0026quot;; nữ khách tóc dài đeo kính, áo vest xanh đen, cầm ví hồng nói \\\u0026quot;커피하고 케이크 주세요.\\\u0026quot;, bong bóng ý nghĩ có tách cà phê và miếng bánh kem.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;… và …\\\u0026quot; – nối hai (hay nhiều) danh từ khi kể đồ vật, người; 하고 gắn liền sau danh từ đứng trước, như chữ \\\u0026quot;và\\\u0026quot; của tiếng Việt.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi danh từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;하고\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;칫솔\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;칫솔하고 치약\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;커피\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;커피하고 케이크\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;빵\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;빵하고 우유\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;N하고 N\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói hằng ngày, kể cả nói lịch sự với người lạ\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;칫솔하고 치약을 사요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi mua bàn chải và kem đánh răng.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;N와/과 N\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;hay dùng khi viết: có patchim → 과, không có → 와 (한국어와 영어)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;책상과 의자가 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Có bàn học và ghế.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;N이랑/랑 N\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói thân mật với bạn bè: có patchim → 이랑, không có → 랑\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;칫솔이랑 치약을 사요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mua bàn chải với kem đánh răng.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;칫솔을하고 치약을 사요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;칫솔하고 치약을 사요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;을/를 chỉ gắn ở danh từ cuối của cả cụm.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN하고 N\u003c/span\u003e\u003c/strong\u003e: \u0026quot;… và …\u0026quot; – nối hai (hay nhiều) danh từ khi kể đồ vật, người; 하고 gắn liền sau danh từ đứng trước, như chữ \u0026quot;và\u0026quot; của tiếng Việt.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi danh từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e하고\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e칫솔\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e칫솔하고 치약\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e커피\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e커피하고 케이크\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e빵\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e빵하고 우유\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e주문하세요.\u003c/span\u003e – Mời chị gọi món.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e커피하고 케이크 주세요.\u003c/span\u003e – Cho tôi cà phê và bánh kem.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 주스 한 병하고 녹차 세 잔 주세요.\n나: 네, 잠시만 기다려 주세요.\u003c/span\u003e – A: Cho tôi một chai nước ép và ba cốc trà xanh.\nB: Vâng, xin chờ một chút.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e냉장고에 과일하고 채소가 있어요.\u003c/span\u003e – Trong tủ lạnh có trái cây và rau.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e만\u003c/span\u003e – “chỉ”\u003c/h3\u003e\n\u003cp\u003e\u003cspan lang=\"ko\"\u003e치약은 안 사요. 칫솔만 사요.\u003c/span\u003e – Tôi không mua kem đánh răng, chỉ mua bàn chải.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;man\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N만\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;명사 뒤에 붙어서 다른 모든 것을 배제합니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Gắn sau danh từ, nghĩa là \\\u0026quot;chỉ …\\\u0026quot; (loại trừ mọi thứ khác). Không phân biệt có hay không có 받침; có thể thay vào chỗ của 이/가, 을/를.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;동생, 연필\u0026quot;,\u0026quot;동생만, 연필만\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;드라마, 한국어\u0026quot;,\u0026quot;드라마만, 한국어만\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;저와 언니는 회사원이에요.\\n동생만 학생이에요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi và chị gái là nhân viên công ty. Chỉ có em tôi là học sinh.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Ba chị em: hai chị lớn (áo hồng và áo vàng, một người ôm tập hồ sơ) đứng sau, em gái nhỏ đeo cặp ôm chồng sách đứng giữa.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Chỉ …\\\u0026quot; – gắn sau danh từ, loại hết những thứ khác; 만 đứng vào chỗ của 이/가, 을/를.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi danh từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;만\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;칫솔\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;칫솔만\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;물\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;물만\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;커피\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;커피만\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;N도 (Bài 8)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;thêm một thứ nữa – \\\u0026quot;cũng\\\u0026quot;\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;계란도 싸요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trứng cũng rẻ.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;N만\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;chỉ một thứ, không có thứ khác\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;칫솔만 사요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi chỉ mua bàn chải.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;칫솔을만 사요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;칫솔만 사요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;만 thay hẳn 을/를 – không đứng cạnh nhau.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN만\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Chỉ …\u0026quot; – gắn sau danh từ, loại hết những thứ khác; 만 đứng vào chỗ của 이/가, 을/를.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi danh từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e칫솔\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e칫솔만\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e물\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e물만\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e커피\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e커피만\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저와 언니는 회사원이에요.\n동생만 학생이에요.\u003c/span\u003e – Tôi và chị gái là nhân viên công ty. Chỉ có em tôi là học sinh.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eThử ngay: xếp mỗi câu vào chữ hợp với nó – nối thêm một món, \u0026quot;cũng\u0026quot;, hay \u0026quot;chỉ\u0026quot;.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-13/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;하고\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;và – nối hai món\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;도\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;cũng\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;만\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;chỉ\u00 026quot;,\u0026quot;시계\u0026quot;,\u0026quot;시계입니다, 시계입니까?\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;이 텔레비전이 얼마입니까?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cái ti vi này bao nhiêu tiền ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;팔십이만 원입니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;820.000 won ạ.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 어느 컴퓨터가 좋습니까?\\n나: 이 컴퓨터가 좋습니다. 그리고 쌉니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Máy tính nào tốt ạ?\\nB: Máy tính này tốt ạ. Lại còn rẻ nữa.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이 노트북이 큽니다. 그리고 가볍습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chiếc laptop này to. Mà lại nhẹ.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong cửa hàng điện máy: một cặp nam nữ (nữ tóc buộc, áo xanh lá, váy vàng nâu; nam đeo kính áo trắng) đứng trước chiếc ti vi màn hình lớn đang chiếu con bọ rùa trên bông hoa; nữ hỏi \\\u0026quot;이 텔레비전이 얼마입니까?\\\u0026quot;, nam nhân viên áo sơ mi trắng, cà vạt sọc giơ tay giới thiệu \\\u0026quot;팔십이만 원입니다.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;Đuôi câu trang trọng – kể thì 습니다, hỏi thì 습니까?; nghĩa như -아요/어요 nhưng cứng và lịch sự hơn: nhân viên cửa hàng, ngân hàng, công ty nói với khách.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;습니다 / 습니까?\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹습니다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;있습니까?\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;ㅂ니다 / ㅂ니까?\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;사다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;삽니다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;비싸다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;비쌉니까?\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;입니다 / 입니까?\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;책\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;책입니다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;얼마\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;얼마입니까?\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄹ: bỏ ㄹ rồi thêm ㅂ니다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;살다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;삽니다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;팔다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;팝니다\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-아요/어요 (Bài 8)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói hằng ngày – người học nói -요 với nhân viên là đủ lịch sự\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;칫솔이 어디에 있어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bàn chải ở đâu ạ?\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-습니다/ㅂ니다\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nhân viên nói với khách, thông báo\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;네, 여기 있습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Vâng, đây ạ.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;이 사과는 얼마습니까?\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;이 사과는 얼마입니까?\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Danh từ thêm 입니까?, không thêm 습니까?.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;살습니다\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;삽니다\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Gốc có patchim ㄹ: bỏ ㄹ rồi thêm ㅂ니다.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-습니다/ㅂ니다, -습니까?/ㅂ니까?\u003c/span\u003e\u003c/strong\u003e: Đuôi câu trang trọng – kể thì 습니다, hỏi thì 습니까?; nghĩa như -아요/어요 nhưng cứng và lịch sự hơn: nhân viên cửa hàng, ngân hàng, công ty nói với khách.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e습니다 / 습니까?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹습니다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e있습니까?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㅂ니다 / ㅂ니까?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e사다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e삽니다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e비싸다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e비쌉니까?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e입니다 / 입니까?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e책\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e책입니다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e얼마\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e얼마입니까?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 텔레비전이 얼마입니까?\u003c/span\u003e – Cái ti vi này bao nhiêu tiền ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e팔십이만 원입니다.\u003c/span\u003e – 820.000 won ạ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 어느 컴퓨터가 좋습니까?\n나: 이 컴퓨터가 좋습니다. 그리고 쌉니다.\u003c/span\u003e – A: Máy tính nào tốt ạ?\nB: Máy tính này tốt ạ. Lại còn rẻ nữa.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이 노트북이 큽니다. 그리고 가볍습니다.\u003c/span\u003e – Chiếc laptop này to. Mà lại nhẹ.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e-(으)십시오\u003c/span\u003e – “Xin mời …”\u003c/h3\u003e\n\u003cp\u003eHay nghe ở quầy: \u003cspan lang=\"ko\"\u003e이쪽으로 오십시오\u003c/span\u003e – mời quý khách đi lối này,\n\u003cspan lang=\"ko\"\u003e안녕히 가십시오\u003c/span\u003e – chào quý khách.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eusipsio\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)십시오\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;듣는 사람에게 어떤 일을 정중하게 명령하거나 권유함을 나타내는 종결 어미입니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đuôi câu mệnh lệnh / đề nghị trang trọng, lịch sự: \\\u0026quot;Xin hãy …, mời …\\\u0026quot;. Thân động từ có 받침 + -으십시오; không 받침 + -십시오. Bất quy tắc: ㄷ → ㄹ (듣다 → 들으십시오), ㅂ → 우 (돕다 → 도우십시오), ㄹ bị lược (만들다 → 만드십시오).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;읽다\u0026quot;,\u0026quot;읽으십시오\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;가십시오\u0026quot;],[\u0026quot;ㄹ 받침\u0026quot;,\u0026quot;만들다, 살다\u0026quot;,\u0026quot;만드십시오, 사십시오\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 전화번호는 어디에 써요?\\n나: 여기에 쓰십시오.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Số điện thoại viết ở đâu ạ?\\nB: Xin hãy viết vào đây.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Người đàn ông mặc vest xanh và người phụ nữ áo đỏ đứng cạnh nhau; người phụ nữ cầm tờ giấy chỉ vào, người đàn ông cầm bút chuẩn bị viết.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Xin mời …, xin hãy …\\\u0026quot; – bản trang trọng của -(으)세요 (Bài 12): lịch sự mời hay bảo khách làm gì.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;으십시오\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;읽으십시오\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;앉다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;앉으십시오\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;십시오\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가십시오\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;오십시오\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;쓰다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;쓰십시오\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄹ: bỏ ㄹ như với 습니다, rồi thêm 십시오\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만드십시오\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;살다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;사십시오\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-(으)세요 (Bài 12)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;mời, bảo lịch sự hằng ngày\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;이쪽으로 오세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mời đi lối này.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-(으)십시오\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;trang trọng hơn – nhân viên nói với khách\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;이쪽으로 오십시오.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mời quý khách đi lối này.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;여기에 앉십시오.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;여기에 앉으십시오.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;앉 có patchim nên phải có 으.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-(으)십시오\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Xin mời …, xin hãy …\u0026quot; – bản trang trọng của -(으)세요 (Bài 12): lịch sự mời hay bảo khách làm gì.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e으십시오\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽으십시오\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e앉다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e앉으십시오\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e십시오\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e가다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e가십시오\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e오다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e오십시오\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e쓰다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e쓰십시오\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 전화번호는 어디에 써요?\n나: 여기에 쓰십시오.\u003c/span\u003e – A: Số điện thoại viết ở đâu ạ?\nB: Xin hãy viết vào đây.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eThử ngay: gốc có patchim hay không? Xếp mỗi từ vào ô \u003cspan lang=\"ko\"\u003e습니다\u003c/span\u003e hoặc \u003cspan lang=\"ko\"\u003eㅂ니다\u003c/span\u003e –\nxếp đúng, máy hiện dạng đã chia.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-13/xep-cho-2\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;습니다\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;ㅂ니다\u0026quot;,
