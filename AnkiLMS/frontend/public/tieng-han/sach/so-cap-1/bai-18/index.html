 \u0026quot;nhé?\u0026quot; cuối câu, tiếng Hàn gắn (으)ㄹ까요? sau gốc động từ.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e을까요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹을까요?\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽을까요?\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e찍다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찍을까요?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc không có patchim (kể cả 하다)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003eㄹ까요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e가다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e갈까요?\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e만나다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만날까요?\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e보다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e볼까요?\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e공부하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e공부할까요?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ: giữ nguyên ㄹ, không thêm ㄹ nữa\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e까요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e만들다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만들까요?\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e커피 마실까요?\u003c/span\u003e – Mình uống cà phê nhé?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e네, 좋아요.\u003c/span\u003e – Vâng, được đấy.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 후엔 씨, 오늘 같이 저녁 먹을까요?\n나: 네, 좋아요. 같이 먹어요.\u003c/span\u003e – A: Chị Huyền, hôm nay mình cùng ăn tối nhé?\nB: Vâng, được ạ. Cùng ăn nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 내일 몇 시에 만날까요?\n나: 11시에 만나요.\u003c/span\u003e – A: Mai mình gặp lúc mấy giờ nhỉ?\nB: Gặp lúc 11 giờ.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eHỏi thêm cũng dùng đuôi này: \u003cspan lang=\"ko\"\u003e몇 시에 만날까요?\u003c/span\u003e – mấy giờ mình gặp nhau?\n\u003cspan lang=\"ko\"\u003e어디에서 만날까요?\u003c/span\u003e – mình gặp nhau ở đâu?\u003c/p\u003e\n\u003cp\u003eThử ngay: gốc có patchim hay không? Xếp mỗi động từ vào đúng ô.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-18/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;을까요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;ㄹ까요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;không patchim / patchim ㄹ\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;찍다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;만나다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;o\u0026quot;:1}],\u0026quot;luat\u0026quot;:\u0026quot;goc\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e읽다 · 만들다 · 듣다 · 가다 · 찍다 · 만나다 · 먹다 · 보다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e을까요\u003c/span\u003e – gốc có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003eㄹ까요\u003c/span\u003e – không patchim / patchim ㄹ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T19eb,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eup-sida\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-(으)ㅂ시다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;동사 뒤에 붙어서 행동을 함께하자고 제안합니다. 격식적인 상황에서 말합니다. 나이가 많거나 높은 사람에게는 사용하지 않습니다. ‘-을까요?’에 대한 대답으로 사용할 수 있습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-읍시다/-ㅂ시다 – \\\u0026quot;chúng ta hãy …\\\u0026quot;: gắn sau động từ để rủ cùng làm, dùng trong tình huống trang trọng; không dùng với người lớn tuổi hay người trên. Có thể dùng để đáp lại câu hỏi -을까요?. Gốc có 받침 + -읍시다; không có 받침 + -ㅂ시다.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹읍시다\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;갑시다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 점심에 뭘 먹을까요?\\n나: 비빔밥을 먹읍시다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Trưa nay mình ăn gì nhỉ? / B: Chúng ta ăn bibimbap đi.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Một bát bibimbap: cơm với các loại rau, cà rốt, trứng ốp la ở giữa, bên cạnh là đôi đũa và chiếc thìa gỗ, đặt trên đĩa trắng.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Chúng ta hãy …\\\u0026quot; – rủ cùng làm và chốt luôn (hơi trang trọng); hay dùng để đáp lại lời rủ -(으)ㄹ까요?.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;읍시다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹읍시다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;읽읍시다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;찍다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;찍읍시다\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc không có patchim (kể cả 하다)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;ㅂ시다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;갑시다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;만나다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만납시다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;공부하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;공부합시다\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㄹ: bỏ ㄹ rồi thêm ㅂ시다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만듭시다\u0026quot;}]},{\u0026quot;luat\u0026quot;:\u0026quot;듣다: ㄷ đổi thành ㄹ rồi thêm 읍시다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;듣다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;들읍시다\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㄹ까요?\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;hỏi ý người kia, rủ – chờ người kia trả lời\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;일요일에 만날까요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chủ nhật mình gặp nhau nhé?\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㅂ시다\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;chốt luôn: chúng ta hãy …\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;네, 좋아요. 7시에 만납시다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ừ, được. 7 giờ chúng ta gặp nhau nhé.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;만나읍시다\u0026quot;,\u0026quot; \u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eVới thầy cô, người lớn tuổi hơn, \u003cspan lang=\"ko\"\u003e-(으)ㅂ시다\u003c/span\u003e nghe như ra lệnh – hãy rủ bằng\n\u003cspan lang=\"ko\"\u003e-(으)ㄹ까요?\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cp\u003eThử ngay: gốc có patchim hay không? Xếp mỗi động từ vào ô \u003cspan lang=\"ko\"\u003e읍시다\u003c/span\u003e hoặc\n\u003cspan lang=\"ko\"\u003eㅂ시다\u003c/span\u003e – xếp đúng, máy hiện dạng đã chia.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-18/xep-cho-2\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;읍시다\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;ㅂ시다\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;không patchim / patchim ㄹ\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;찍다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;만나다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;공부하다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;만들다\u0026quot;,\u0026quot;o\u0026quot;:1}],\u0026quot;luat\u0026quot;:\u0026quot;goc\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e보다 · 읽다 · 가다 · 찍다 · 만나다 · 먹다 · 공부하다 · 만들다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e읍시다\u003c/span\u003e – gốc có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003eㅂ시다\u003c/span\u003e – không patchim / patchim ㄹ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T2e27,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;go-itda\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V-고 있다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;동사에 붙어 어떤 동작이 끝나지 않고 진행되고 있음을 나타냅니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;-고 있다 – \\\u0026quot;đang …\\\u0026quot;: gắn sau động từ để diễn tả hành động đang diễn ra, chưa kết thúc. Có hay không có 받침 đều thêm -고 있다.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;찾다\u0026quot;,\u0026quot;찾고 있다\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;가고 있다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 쯔엉 씨, 지금 뭐 하고 있어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Trương, bây giờ bạn đang làm gì vậy?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;나: 저는 지금 영화를 보고 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;B: Bây giờ tôi đang xem phim.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Chàng trai tóc đen áo xanh ngồi trên ghế bành đỏ, tay cầm điều khiển, đang xem phim hành động trên chiếc ti vi đặt trên kệ gỗ, cạnh đó là chậu cây.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Đang …\\\u0026quot; – việc đang diễn ra lúc này, hoặc dạo này đang làm; tiếng Việt thêm \\\u0026quot;đang\\\u0026quot; trước động từ, tiếng Hàn gắn 고 있어요 sau gốc.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi gốc động từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;고 있어요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹고 있어요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가고 있어요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;기다리다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;기다리고 있어요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;공부하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;공부하고 있어요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-아요/어요 (Bài 8)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;việc hằng ngày, thói quen\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;저는 매일 한국어를 공부해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày nào tôi cũng học tiếng Hàn.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-고 있어요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;việc đang làm lúc này, dạo này\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;지금 한국어를 공부하고 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bây giờ tôi đang học tiếng Hàn.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;오늘 날씨가 덥고 있어요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;오늘 날씨가 더워요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;고 있다 chỉ gắn vào động từ – tính từ (덥다, 좋다) không dùng \\\u0026quot;đang\\\u0026quot;.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV-고 있다\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Đang …\u0026quot; – việc đang diễn ra lúc này, hoặc dạo này đang làm; tiếng Việt thêm \u0026quot;đang\u0026quot; trước động từ, tiếng Hàn gắn 고 있어요 sau gốc.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi gốc động từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e고 있어요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹고 있어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e가다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e가고 있어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e기다리다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e기다리고 있어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e공부하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e공부하고 있어요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 쯔엉 씨, 지금 뭐 하고 있어요?\u003c/span\u003e – A: Trương, bây giờ bạn đang làm gì vậy?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 저는 지금 영화를 보고 있어요.\u003c/span\u003e – B: Bây giờ tôi đang xem phim.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eAi gọi, hỏi \u003cspan lang=\"ko\"\u003e지금 뭐 하고 있어요?\u003c/span\u003e – trả lời \u003cspan lang=\"ko\"\u003e지금 숙제하고 있어요\u003c/span\u003e,\n\u003cspan lang=\"ko\"\u003e야근을 하고 있어요\u003c/span\u003e. Dạo này đang học gì cũng nói được: \u003cspan lang=\"ko\"\u003e요즘 요리를 배우고 있어요\u003c/span\u003e.\u003c/p\u003e\n\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e-지요?\u003c/span\u003e – “… phải không?”\u003c/h3\u003e\n\u003cp\u003eBiết rồi nhưng muốn người kia xác nhận: \u003cspan lang=\"ko\"\u003e내일 시험이 있지요?\u003c/span\u003e – Mai có bài thi phải không?\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;jiyo\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-지요?\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;이미 알고 있는 것을 다시 확인할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Dùng để xác nhận lại điều mình đã biết — \\\u0026quot;…phải không?\\\u0026quot;, \\\u0026quot;…nhỉ?\\\u0026quot;. Gắn -지요? vào thân động từ / tính từ (không phân biệt patchim).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-지요?\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹지요?\u0026quot;],[\u0026quot;-지요?\u0026quot;,\u0026quot;좋다\u0026quot;,\u0026quot;좋지요?\u0026quot;],[\u0026quot;-지요?\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;가지요?\u0026quot;],[\u0026quot;-지요?\u0026quot;,\u0026quot;예쁘다\u0026quot;,\u0026quot;예쁘지요?\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 라민 씨, 오늘 날씨가 많이 덥지요?\\n나: 네, 정말 더워요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Anh Ramin, hôm nay trời nóng quá nhỉ?\\nB: Vâng, nóng thật.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 우리 토요일에 만나지요?\\n나: 네, 맞아요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Thứ Bảy mình gặp nhau nhỉ?\\nB: Vâng, đúng rồi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 단풍이 아름답지요?\\n나: 네, 정말 아름답네요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Lá phong đẹp nhỉ?\\nB: Vâng, đẹp thật.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong lớp học, người phụ nữ tóc xoăn áo vàng phe phẩy quạt giấy hỏi Ramin (tóc xoăn, đeo kính, áo hồng) đang toát mồ hôi; trên bàn có sách mở.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;… phải không?\\\u0026quot;, \\\u0026quot;… nhỉ?\\\u0026quot; – hỏi lại điều mình đã biết để người kia xác nhận; gắn 지요? sau gốc động từ, tính từ.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi gốc động từ / tính từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;지요?\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹지요?\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가지요?\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;덥다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;덥지요?\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;바쁘다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;바쁘지요?\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Nói nhanh, 지요 rút thành 죠 – nghĩa không đổi\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;좋다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;좋죠\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;있죠\u0026quot;}]}],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-(으)ㄹ까요?\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;rủ, hỏi ý – chưa biết câu trả lời\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;일곱 시에 만날까요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;7 giờ mình gặp nhau nhé?\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-지요?\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;hỏi lại điều đã biết cho chắc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;일곱 시에 만나지요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mình hẹn gặp lúc 7 giờ phải không?\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;내일 시험이 있을까요?\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;내일 시험이 있지요?\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Đã biết mai có thi, muốn người kia xác nhận → 지요?; 까요? là để rủ.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-지요?\u003c/span\u003e\u003c/strong\u003e: \u0026quot;… phải không?\u0026quot;, \u0026quot;… nhỉ?\u0026quot; – hỏi lại điều mình đã biết để người kia xác nhận; gắn 지요? sau gốc động từ, tính từ.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi gốc động từ / tính từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e지요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u00 03cspan lang=\"ko\"\u003e미안해요. 시험이 있어요\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAi trả tiền?\u003c/strong\u003e Bạn bè ngang hàng hay chia đều tiền bữa ăn – không ai thấy ngại. Người rủ hoặc người lớn tuổi hơn\nđôi khi mời cả bàn; lần sau người kia mời lại, chẳng hạn mời cà phê.\u003c/p\u003e\n\u003ch3\u003eHẹn gặp và báo muộn\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu khi hẹn gặp và khi đến muộn.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-18/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;몇 시에 만날까요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mình gặp nhau lúc mấy giờ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;어디에서 만날까요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mình gặp nhau ở đâu?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;극장 앞에서 만나요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Gặp nhau trước rạp nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;도착해서 전화하세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đến nơi rồi gọi cho mình nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;미안해요. 조금 늦어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Xin lỗi, mình đến muộn một chút.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;언제 밥 한번 먹어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bữa nào mình đi ăn nhé.\u0026quot;}],\u0026quot;names\u0026quot;:[]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e몇 시에 만날까요?\u003c/span\u003e – Mình gặp nhau lúc mấy giờ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e어디에서 만날까요?\u003c/span\u003e – Mình gặp nhau ở đâu?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e극장 앞에서 만나요.\u003c/span\u003e – Gặp nhau trước rạp nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e도착해서 전화하세요.\u003c/span\u003e – Đến nơi rồi gọi cho mình nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lan
