an lang=\"ko\"\u003e여러분, 앉으세요.\u003c/span\u003e – Các bạn, mời ngồi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 오늘 7시에 전화하세요.\n나: 네, 알겠습니다.\u003c/span\u003e – A: Hôm nay hãy gọi điện lúc 7 giờ nhé.\nB: Vâng, tôi biết rồi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e영화가 7시에 시작해요. 빨리 오세요.\u003c/span\u003e – Phim bắt đầu lúc 7 giờ. Anh đến nhanh nhé.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e주세요\u003c/span\u003e là \u003cspan lang=\"ko\"\u003e주다\u003c/span\u003e (cho) + \u003cspan lang=\"ko\"\u003e세요\u003c/span\u003e: \u0026quot;xin cho tôi\u0026quot;. Gọi món:\ngọi \u003cspan lang=\"ko\"\u003e여기요\u003c/span\u003e, rồi món + số + \u003cspan lang=\"ko\"\u003e주세요\u003c/span\u003e – \u003cspan lang=\"ko\"\u003e비빔밥 하나 주세요\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003eThử ngay: xếp mỗi động từ vào ô \u003cspan lang=\"ko\"\u003e으세요\u003c/span\u003e hoặc \u003cspan lang=\"ko\"\u003e세요\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-12/xep-cho-2\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;으세요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc có patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;세요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;gốc không có patchim\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;기다리다\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;리 không có patchim → 기다리세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;입다\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;입 có patchim → 입으세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;보 không có patchim → 보세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;앉다\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;앉 có patchim → 앉으세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;주다\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;주 không có patchim → 주세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;읽 có patchim → 읽으세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;주문하다\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;하 không có patchim → 주문하세요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;가다\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;가 không có patchim → 가세요.\u0026quot;}}],\u0026quot;luat\u0026quot;:\u0026quot;tu-do\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e기다리다 · 입다 · 보다 · 앉다 · 주다 · 읽다 · 주문하다 · 가다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e으세요\u003c/span\u003e – gốc có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e세요\u003c/span\u003e – gốc không có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T1d3f,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eoseo\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-아서/어서\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;동사나 형용사에 붙어 앞의 내용이 뒤의 내용의 이유나 원인이 됨을 나타냅니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;Vì … nên …\\\u0026quot;: gắn sau động từ / tính từ, vế trước là lý do, nguyên nhân của vế sau. Gốc có nguyên âm ㅏ, ㅗ + -아서 (찾아서); nguyên âm khác + -어서 (먹어서); 하다 → 해서. Không chia thì quá khứ trước -어서 và không dùng với câu mệnh lệnh / rủ rê.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;‘ㅏ’, ‘ㅗ’ ×\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹어서\u0026quot;],[\u0026quot;‘ㅏ’, ‘ㅗ’ ○\u0026quot;,\u0026quot;찾다\u0026quot;,\u0026quot;찾아서\u0026quot;],[\u0026quot;하다\u0026quot;,\u0026quot;하다\u0026quot;,\u0026quot;해서\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;가: 지훈 씨, 지금 어디에 가요?\\n나: 배가 고파서 식당에 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Ji-hun, bây giờ bạn đi đâu thế?\\nB: Tôi đói bụng nên đi đến quán ăn.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Cô gái tóc đỏ đeo túi đứng cạnh chàng trai (Ji-hun) áo xanh đeo ba lô; bong bóng suy nghĩ có bát bibimbap với trứng ốp la.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Vì … nên …\\\u0026quot; – tiếng Việt đặt \\\u0026quot;vì\\\u0026quot; ở đầu vế lý do, tiếng Hàn gắn 아서/어서 vào cuối vế lý do rồi mới nói kết quả.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối của gốc là ㅏ hoặc ㅗ\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-아서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;좋다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;좋아서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;많다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;많아서\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Nguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;-어서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;먹어서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;맛있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;맛있어서\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc là 하다\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;해서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;좋아하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;좋아해서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;주문하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;주문해서\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc hết bằng ㅏ (không patchim): 아 nhập vào\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;싸다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;싸서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;짜다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;짜서\u0026quot;}]},{\u0026quot;luat\u0026quot;:\u0026quot;ㅗ + 아 gộp thành ㅘ\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;와서\u0026quot;}]}],\u0026quot;batQuyTac\u0026quot;:[{\u0026quot;luat\u0026quot;:\u0026quot;Gốc hết bằng ㅡ: bỏ ㅡ, rồi nhìn nguyên âm đứng trước nó\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;배고프다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;배고파서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;바쁘다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;바빠서\u0026quot;}]},{\u0026quot;luat\u0026quot;:\u0026quot;Gốc có patchim ㅂ: ㅂ đổi thành 우, gộp với 어서 thành 워서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;맵다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;매워서\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;싱겁다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;싱거워서\u0026quot;}]}],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-아요/어요 (Bài 8)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói một việc, hết câu\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;김치찌개가 매워요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Canh kim chi cay.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-아서/어서\u0026qu
