요.\u0026quot;},\u0026quot;khay\u0026quot;:[\u0026quot;사람예요\u0026quot;,\u0026quot;이링 씨은\u0026quot;,\u0026quot;중국\u0026quot;,\u0026quot;이링 씨는\u0026quot;,\u0026quot;사람이에요\u0026quot;]},{\u0026quot;hoi\u0026quot;:\u0026quot;라흐만 씨는 학생이에요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Rahman là sinh viên à?\u0026quot;,\u0026quot;dung\u0026quot;:[\u0026quot;아니요,\u0026quot;,\u0026quot;공장 직원이에요\u0026quot;],\u0026quot;sai\u0026quot;:{\u0026quot;네,\u0026quot;:\u0026quot;Rahman là công nhân nhà máy (thẻ tên), không phải sinh viên – trả lời 아니요.\u0026quot;,\u0026quot;공장 직원예요\u0026quot;:\u0026quot;직원 có patchim (ㄴ) nên dùng 이에요.\u0026quot;},\u0026quot;khay\u0026quot;:[\u0026quot;공장 직원이에요\u0026quot;,\u0026quot;아니요,\u0026quot;,\u0026quot;네,\u0026quot;,\u0026quot;공장 직원예요\u0026quot;]},{\u0026quot;hoi\u0026quot;:\u0026quot;라민 씨는 직업이 뭐예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ramin làm nghề gì?\u0026quot;,\u0026quot;dung\u0026quot;:[\u0026quot;라민 씨는\u0026quot;,\u0026quot;학생이에요\u0026quot;],\u0026quot;sai\u0026quot;:{\u0026quot;라민 씨은\u0026quot;:\u0026quot;씨 không có patchim nên dùng 는.\u0026quot;,\u0026quot;학생예요\u0026quot;:\u0026quot;학생 có patchim (ㅇ) nên dùng 이에요.\u0026quot;},\u0026quot;khay\u0026quot;:[\u0026quot;학생이에요\u0026quot;,\u0026quot;학생예요\u0026quot;,\u0026quot;라민 씨는\u0026quot;,\u0026quot;라민 씨은\u0026quot;]}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e후엔 씨는 어느 나라에서 왔어요?\u003c/span\u003e – Huyền đến từ nước nào?\u003cbr\u003e\u003cspan lang=\"ko\"\u003e저는 베트남에서 왔어요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e직업이 뭐예요?\u003c/span\u003e – Nghề của Huyền là gì?\u003cbr\u003e\u003cspan lang=\"ko\"\u003e저는 회사원이에요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이링 씨는 어느 나라 사람이에요?\u003c/span\u003e – Yi Ling là người nước nào?\u003cbr\u003e\u003cspan lang=\"ko\"\u003e이링 씨는 중국 사람이에요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e라흐만 씨는 학생이에요?\u003c/span\u003e – Rahman là sinh viên à?\u003cbr\u003e\u003cspan lang=\"ko\"\u003e아니요, 공장 직원이에요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e라민 씨는 직업이 뭐예요?\u003c/span\u003e – Ramin làm nghề gì?\u003cbr\u003e\u003cspan lang=\"ko\"\u003e라민 씨는 학생이에요.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003e2 · Angela tập nói\u003c/h3\u003e\n\u003cp\u003eAngela nhờ Huyền giúp ghép mấy câu tiếng Hàn cho buổi làm quen. Ghép từng câu.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ghep-cau\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-06/ghep-cau-2\u0026quot;,\u0026quot;nhan\u0026quot;:\u0026quot;Ghép câu · Angela tập nói\u0026quot;,\u0026quot;cau\u0026quot;:[{\u0026quot;vi\u0026quot;:\u0026quot;Tôi là Angela.\u0026quot;,\u0026quot;dung\u0026quot;:[\u0026quot;저는\u0026quot;,\u0026quot;안젤라예요\u0026quot;],\u0026quot;sai\u0026quot;:{\u0026quot;안젤라 씨예요\u0026quot;:\u0026quot;Nói về mình thì không thêm 씨.\u0026quot;,\u0026quot;안젤라이에요\u0026quot;:\u0026quot;안젤라 hết bằng nguyên âm nên dùng 예요.\u0026quot;},\u0026quot;khay\u0026quot;:[\u0026quot;안젤라예요\u0026quot;,\u0026quot;저는\u0026quot;,\u0026quot;안젤라이에요\u0026quot;,\u0026quot;안젤라 씨예요\u0026quot;]},{\u0026quot;vi\u0026quot;:\u0026quot;Huyền là nhân viên công ty.\u0026quot;,\u0026quot;dung\u0026quot;:[\u0026quot;후엔 씨는\u0026quot;,\u0026quot;회사원이에요\u0026quot;],\u0026quot;sai\u0026quot;:{\u0026quot;후엔 씨은\u0026quot;:\u0026quot;씨 không có patchim nên dùng 는.\u0026quot;,\u0026quot;회사원예요\u0026quot;:\u0026quot;회사원 có patchim (ㄴ) nên dùng 이에요.\u0026quot;},\u0026quot;khay\u0026quot;:[\u0026quot;후엔 씨은\u0026quot;,\u0026quot;회사원이에요\u0026quot;,\u0026quot;회사원예요\u0026quot;,\u0026quot;후엔 씨는\u0026quot;]},{\u0026quot;vi\u0026quot;:\u0026quot;(Hỏi bạn mới) Tên bạn là gì?\u0026quot;,\u0026quot;dung\u0026quot;:[\u0026quot;이름이\u0026quot;,\u0026quot;뭐예요?\u0026quot;],\u0026quot;sai\u0026quot;:{\u0026quot;이름는\u0026quot;:\u0026quot;이름 có patchim (ㅁ) – sau 이름
