026quot;:\u0026quot;speak\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;여러분도 친구에게 오늘 어디에 가는지 물어보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Bạn cũng hãy hỏi bạn mình hôm nay đi đâu.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;오늘 어디에 가요?\\n거기에 어떻게 가요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Hôm nay bạn đi đâu?\\nĐến đó bằng gì?\u0026quot;}]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · hỏi bạn đi đâu, bằng gì\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e여러분도 친구에게 오늘 어디에 가는지 물어보세요.\u003c/span\u003e\u003c/strong\u003e – Bạn cũng hãy hỏi bạn mình hôm nay đi đâu.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e오늘 어디에 가요?\n거기에 어떻게 가요?\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003e3 · Đến lượt bạn\u003c/h3\u003e\n\u003cp\u003eHôm nay bạn đi đâu, để làm gì, đi bằng gì? Nói theo ba câu mẫu, rồi thay bằng chuyện của bạn.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-17/noi-theo-3\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;오늘 도서관에 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Hôm nay tôi đi thư viện.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;책을 읽으러 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi để đọc sách.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;버스로 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi bằng xe buýt.\u0026quot;}],\u0026quot;names\u0026quot;:[]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e오늘 도서관에 가요.\u003c/span\u003e – Hôm nay tôi đi thư viện.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e책을 읽으러 가요.\u003c/span\u003e – Tôi đi để đọc sách.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e버스로 가요.\u003c/span\u003e – Tôi đi bằng xe buýt.\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e31:Tfd0,\u003cp\u003eBạn hay đi đâu – xa hay gần, đi bằng gì, mất bao lâu? Chạm thẻ (hoặc tự gõ) để viết bốn, năm câu.\nĐoạn mẫu viết đuôi -습니다, bạn viết đuôi -요 cũng được.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#16/ex-p219-write-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p219-write-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;말하기·쓰기 과제 – 쓰기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;write\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;여러분은 어디에 자주 가요? 그때 무슨 교통수단을 이용해요? \u0026lt;보기\u0026gt;와 같이 쓰세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Bạn hay đi đâu? Khi đó bạn dùng phương tiện giao thông gì? Viết giống mẫu.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Viết về nơi bạn hay đến, quãng đường, phương tiện và thời gian di chuyển.\u0026quot;}],\u0026quot;bank\u0026quot;:[\u0026quot;저는 도서관에 자주 갑니다. 집에서 도서관까지 멀지 않습니다. 그래서 걸어갑니다. 하지만 가끔 버스도 탑니다. 집 앞에 버스 정류장이 있습니다. 집에서 도서관까지 10분 걸립니다.\u0026quot;]},\u0026quot;tiles\u0026quot;:[{\u0026quot;words\u0026quot;:[\u0026quot;집에서\u0026quot;,\u0026quot;회사까지\u0026quot;,\u0026quot;학교까지\u0026quot;,\u0026quot;지하철로 가요\u0026quot;,\u0026quot;버스로 가요\u0026quot;,\u0026quot;걸어서 가요\u0026quot;,\u0026quot;삼십 분 걸려요\u0026quot;,\u0026quot;한 시간 걸려요\u0026quot;,\u0026quot;가까워요\u0026quot;,\u0026quot;멀어요\u0026quot;,\u0026quot;갈아타요\u0026quot;]}],\u0026quot;nhan\u0026quot;:\u0026quot;Viết · nơi bạn hay đến và cách đi\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e여러분은 어디에 자주 가요? 그때 무슨 교통수단을 이용해요? \u0026lt;보기\u0026gt;와 같이 쓰세요.\u003c/span\u003e\u003c/strong\u003e – Bạn hay đi đâu? Khi đó bạn dùng phương tiện giao th \u0026quot;qVi\u0026quot;:\u0026quot;Mẫu: A: Jason đi đâu? Đến đó làm gì? B: Anh ấy ra bến xe buýt. Đi để đón xe buýt.\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;이링 / 교실 / 수업을 듣다\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Yi Ling / lớp học / nghe giảng\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;안젤라 / 회사 / 일하다\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Angela / công ty / làm việc\u0026quot;},{\u0026quot;q\u0026quot;:\u0026quot;아나이스 / 도서관 / 책을 빌리다\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Anaïs / thư viện / mượn sách\u0026quot;}]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · ai đi đâu, để làm gì\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e다음 사람들은 어디에 가요? 거기에 왜 가요?\u003c/span\u003e\u003c/strong\u003e – Những người sau đi đâu? Đến đó để làm gì? (Nói theo mẫu, dùng -(으)러 가요.)\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e보기: 제이슨 / 버스 정류장 / 버스를 타다\n가: 제이슨 씨가 어디에 가요? 거기에 왜 가요?\n나: 버스 정류장에 가요. 버스를 타러 가요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이링 / 교실 / 수업을 듣다\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e안젤라 / 회사 / 일하다\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아나이스 / 도서관 / 책을 빌리다\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e36:T2dff,\u003ch3\u003e1 · Đoạn mẫu\u003c/h3\u003e\n\u003cp\u003eCô giáo mang đến lớp bài viết của một bạn du học sinh về chuyến đi Busan: đi bằng gì, mất bao lâu, đổi xe ở đâu. Đoạn\ncủa bạn cũng sẽ như vậy.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;지난 주말에 부산에 다녀왔습니다. 서울역에서 기차를 탔습니다. 부산역까지 세 시간이 걸렸습니다. 부산역에서 해운대까지 버스를 타고 갔습니다. 해운대 바다가 정말 예뻤습니다. 해운대에서 저녁을 먹고 서울에 돌아가려고 부산역에 갔습니다. 해운대에서 부산역까지는 지하철을 탔습니다. 서면역에서 한 번 갈아탔습니다. 그리고 서울에 무사히 돌아왔습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần trước tôi đã đi Busan về. Tôi đi tàu hoả từ ga Seoul. Đến ga Busan mất ba tiếng. Từ ga Busan tôi đi xe buýt đến Haeundae. Biển Haeundae thật đẹp. Ăn tối ở Haeundae xong, tôi đến ga Busan để về Seoul. Từ Haeundae đến ga Busan tôi đi tàu điện ngầm. Tôi chuyển tàu một lần ở ga Seomyeon. Rồi tôi đã về đến Seoul an toàn.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Bản đồ minh hoạ bán đảo Hàn Quốc màu xanh lá giữa biển xanh, các con đường cao tốc chạy dọc ngang, núi và đảo nhỏ; ngôi sao vàng đánh dấu \\\u0026quot;부산\\\u0026quot; ở góc đông nam.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;버스\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;xe buýt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;지하철\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tàu điện ngầm\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;기차\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tàu hoả\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;비행기\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;máy bay\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;배\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tàu thuỷ, thuyền\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;역\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ga, nhà ga\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;정류장\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;trạm (xe buýt), bến đỗ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;터미널\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bến xe\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;타다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đi, cưỡi, lên (xe, tàu…)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;걸어가다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đi bộ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;갈아타다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chuyển tuyến, đổi xe/tàu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;거리\u0026quot;,\u00
