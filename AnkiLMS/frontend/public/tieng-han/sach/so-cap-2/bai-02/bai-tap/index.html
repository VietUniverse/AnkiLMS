u003e편찮으시다\u003c/span\u003e – (người trên) ốm · \u003cspan lang=\"ko\"\u003e가야 해\u003c/span\u003e – phải đi ·\n\u003cspan lang=\"ko\"\u003e닫다\u003c/span\u003e – đóng · \u003cspan lang=\"ko\"\u003e있으면\u003c/span\u003e – nếu có · \u003cspan lang=\"ko\"\u003e언제든지\u003c/span\u003e – bất cứ\nlúc nào. Mẹ nói trống không với con: \u003cspan lang=\"ko\"\u003e해 줘\u003c/span\u003e = \u003cspan lang=\"ko\"\u003e해 주세요\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;titleKo\u0026quot;:\u0026quot;이것은 엄마가 지연 씨에게 남긴 메모입니다. 메모를 잘 읽고 답하세요.\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;지연아, 엄마가 아빠하고 며칠 동안 할머니께 다녀올 거야. 할머니께서 갑자기 편찮으셔서 지금 가야 해. 엄마 없는 동안에 네가 요리 좀 해줘. 동생하고 밥 잘 먹고 방 정리도 부탁해. 그리고 요즘 저녁에 쌀쌀하니까 밤에는 창문도 잘 닫고 자. 서로 도와주면서 지내고, 문제 있으면 언제든지 연락해.\\n10월 27일 사랑하는 엄마가\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ji-yeon à, mẹ với bố sẽ đến chỗ bà mấy hôm rồi về. Bà đột nhiên bị ốm nên bây giờ bố mẹ phải đi. Trong lúc mẹ đi vắng, con nấu ăn giúp mẹ nhé. Con với em ăn uống đầy đủ và nhờ con dọn dẹp phòng nữa. Với lại dạo này buổi tối trời se lạnh nên ban đêm nhớ đóng cửa sổ cẩn thận rồi hãy ngủ. Hai chị em giúp đỡ nhau mà sống nhé, có chuyện gì thì gọi cho mẹ bất cứ lúc nào.\\nNgày 27 tháng 10, mẹ yêu con.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Góc bếp gọn gàng: tủ treo có kệ bày bát đĩa nhiều màu, giá treo muôi và xẻng, bồn rửa, chậu cây nhỏ; trên cửa tủ lạnh dán một tờ giấy nhớ màu xanh lá có chữ.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;빨래\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giặt giũ, đồ giặt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;요리\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nấu ăn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;설거지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;rửa bát\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;세탁기\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;máy giặt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;청소하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;dọn dẹp, lau dọn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;정리하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sắp xếp, dọn gọn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(창문)을 닦다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lau (cửa sổ)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(세탁기)를 돌리다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chạy (máy giặt)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;집안일을 하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;làm việc nhà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;집안일을 나누다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chia nhau làm việc nhà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;쓰레기를 버리다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;vứt rác\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;다녀오다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đi rồi về\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;갑자기\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đột nhiên\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;편찮다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ốm, không khỏe (kính ngữ)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;부탁하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhờ, nhờ vả\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;쌀쌀하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;se lạnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;언제든지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bất cứ lúc nào\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e이것은 엄마가 지연 씨에게 남긴 메모입니다. 메모를 잘 읽고 답하세요.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e지연아, 엄마가 아빠하고 며칠 동안 할머니께 다녀올 거야. 할머니께서 갑자기 편찮으셔서 지금 가야 해. 엄마 없는 동안에 네가 요리 좀 해줘. 동생하고 밥 잘 먹고 방 정리도 부탁해. 그리고 요즘 저녁에 쌀쌀하니까 밤에는 창문도 잘 닫고 자. 서로 도와주면서 지내고, 문제 있으면 언제든지 연락해.\u003cbr\u003e10월 27일 사랑하는 엄마가\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eJi-yeon à, mẹ với bố sẽ đến chỗ bà mấy hôm rồi về. Bà đột nhiên bị ốm nên bây giờ bố mẹ phải đi. Trong lúc mẹ đi vắng, con nấu ăn giúp mẹ nhé. Con với em ăn uống đầy đủ và nhờ con dọn dẹp phòng nữa. Với lại dạo này buổi tối trời se lạnh nên ban đêm nhớ đóng cửa sổ cẩn thận rồi hãy ngủ. Hai chị em giúp đỡ nhau mà sống nhé, có chuyện gì thì gọi cho mẹ bất cứ lúc nào.\u003cbr\u003eNgày 27 tháng 10, mẹ yêu con.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#13/ex-p182-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p182-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;choose\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;요즘 밤에 날씨가 쌀쌀해요. 그래서 엄마가 지연 씨에게 어떤 일을 부탁했어요?\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Dạo này ban đêm trời se lạnh. Vì vậy mẹ đã nhờ Ji-yeon làm việc gì?\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Mẹ nhờ Ji-yeon làm gì vì ban đêm trời se lạnh?\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;요리를 해요.\u0026quot;,\u0026quot;창문을 닫아요.\u0026quot;,\u0026quot;쓰레기를 버려요.\u0026quot;,\u0026quot;엄마께 전화를 해요.\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;창문을 닫아요.\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · trời se lạnh, mẹ dặn gì?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e요즘 밤에 날씨가 쌀쌀해요. 그래서 엄마가 지연 씨에게 어떤 일을 부탁했어요?\u003c/span\u003e\u003c/strong\u003e – Dạo này ban đêm trời se lạnh
