hòng. 6 giờ chiều chị đi chợ ở siêu thị. Buổi tối chị không tập thể dục. Từ 8 giờ tối chị làm bài tập tiếng Hàn ở nhà. Và 10 giờ rưỡi chị đi ngủ.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step1#6/ex-p69-1-ox\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p69-1-ox\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;ox\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;맞으면 ○, 틀리면 X 하세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đúng ghi O, sai ghi X.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;안젤라 씨는 일곱 시에 일어나요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Angela thức dậy lúc bảy giờ.\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;X\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;안젤라 씨는 오전 여덟 시부터 일해요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Angela làm việc từ tám giờ sáng.\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · đúng / sai về một ngày của Angela\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e맞으면 ○, 틀리면 X 하세요.\u003c/span\u003e\u003c/strong\u003e – Đúng ghi O, sai ghi X.\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e안젤라 씨는 일곱 시에 일어나요.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e안젤라 씨는 오전 여덟 시부터 일해요.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step1#6/ex-p69-1-q\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot; ;,\u0026quot;phanUng\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần thì phải nghỉ chứ!\u0026quot;}}]},{\u0026quot;nhan\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Sáng thứ Bảy\u0026quot;},\u0026quot;hoi\u0026quot;:{\u0026quot;ko\u0026quot;:\u0026quot;토요일 아침에 뭐 해요?\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Sáng thứ Bảy bạn làm gì?\u0026quot;}},\u0026quot;dap\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;한국어를 배워요. 열 시부터 열두 시까지 배워요.\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Tôi học tiếng Hàn, từ 10 giờ đến 12 giờ.\u0026quot;},\u0026quot;dung\u0026quot;:true,\u0026quot;pose\u0026quot;:\u0026quot;vui\u0026quot;,\u0026quot;phanUng\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;À, bạn học cùng lớp với Huyền!\u0026quot;},\u0026quot;phanUngKo\u0026quot;:\u0026quot;와, 후엔 씨도 열 시부터 배워요!\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;한국어를 배워요. 열 시까지 열두 시부터 배워요.\u0026quot;,\u0026quot;dung\u0026quot;:false,\u0026quot;pose\u0026quot;:\u0026quot;thac-mac\u0026quot;,\u0026quot;phanUng\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Ơ, giờ bắt đầu với giờ kết thúc đổi chỗ cho nhau rồi.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;공원에서 운동해요.\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Tôi tập thể dục ở công viên.\u0026quot;},\u0026quot;dung\u0026quot;:true,\u0026quot;pose\u0026quot;:\u0026quot;vui\u0026quot;,\u0026quot;phanUng\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Sáng thứ Bảy ra công viên – chị cũng thích lắm.\u0026quot;}}]}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003eChị Ji-eun rót cho bạn cốc cà phê, rồi hỏi chuyện.\u003c/p\u003e\u003cp\u003echị Ji-eun\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e민 씨는 몇 시부터 몇 시까지 일해요?\u003c/p\u003e\u003cp\u003e민 làm việc từ mấy giờ đến mấy giờ?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 저는 일 안 해요. 학생이에요. / 아홉 시부터 여섯 시까지 일해요. / 여덟 시부터 다섯 시까지 일해요.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e주말에도 일해요?\u003c/p\u003e\u003cp\u003eCuối tuần bạn cũng làm việc à?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 네, 토요일에 일해요. / 아니요, 주말에는 일 안 해요.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e토요일 아침에 뭐 해요?\u003c/p\u003e\u003cp\u003eSáng thứ Bảy bạn làm gì?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 한국어를 배워요. 열 시부터 열두 시까지 배워요. / 공원에서 운동해요.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eBạn làm gì, không làm gì?\u003c/h3\u003e\n\u003cp\u003eChị Ji-eun hỏi thêm về những việc trong tuần. Câu 1 và 3: \u003cspan lang=\"ko\"\u003e아니요\u003c/span\u003e – thêm\n\u003cspan lang=\"ko\"\u003e안\u003c/span\u003e; câu 2, 4, 5: \u003cspan lang=\"ko\"\u003e네\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step1#6/ex-p67-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p67-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;어휘와 문법 2\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;speak\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Hỏi và trả lời theo bảng. (숙제 = bài tập về nhà, 노래 = bài hát, 들어요 = nghe, 프랑스 = Pháp)\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;아침에 운동해요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Buổi sáng bạn có tập thể dục không? (bảng đánh dấu 아니요)\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;아니요, 아침에 운동 안 해요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;도서관에서 책을 읽어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Bạn có đọc sách ở thư viện không? (bảng đánh dấu 네)\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;네, 도서관에서 책을 읽어요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;한국어 숙제를 해요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Bạn có làm bài tập tiếng Hàn không? (bảng đánh dấu 아니요)\
