u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;제 가족 사진이에요. 우리 가족은 아버지, 어머니, 저예요. 이 사람이 제 아버지예요. 아버지는 회사원이에요. 그리고 이 사람은 어머니예요. 어머니는 배우예요. 가수가 아니에요. 저는 대학생이에요. 회사원이 아니에요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đây là ảnh gia đình tôi. Gia đình tôi gồm bố, mẹ và tôi. Người này là bố tôi. Bố tôi là nhân viên công ty. Còn người này là mẹ tôi. Mẹ tôi là diễn viên. Mẹ không phải ca sĩ. Tôi là sinh viên đại học. Tôi không phải nhân viên công ty.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Bức ảnh gia đình lồng khung đen treo trên tường xanh nhạt: bên trái người mẹ tóc nâu dài, áo đỏ; giữa là chàng trai trẻ áo sơ mi xám nhạt; bên phải người bố râu quai nón, mặc vest đen, cà vạt xanh.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;아버지\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bố, cha\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;어머니\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mẹ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;동생\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;em (trai / gái)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;언니\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chị (em gái gọi)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;누나\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chị (em trai gọi)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;오빠\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;anh (em gái gọi)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;형\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;anh (em trai gọi)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가수\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ca sĩ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;배우\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;diễn viên\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;회사원\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhân viên công ty\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;의사\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bác sĩ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;우리 가족이에요\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đây là gia đình tôi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;이름이 뭐예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tên bạn là gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;직업이 뭐예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bạn làm nghề gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;부모님\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bố mẹ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;사진\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ảnh, bức ảnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;그리고\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;và, rồi thì\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;대학생\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sinh viên đại học\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e제 가족 사진이에요. 우리 가족은 아버지, 어머니, 저예요. 이 사람이 제 아버지예요. 아버지는 회사원이에요. 그리고 이 사람은 어머니예요. 어머니는 배우예요. 가수가 아니에요. 저는 대학생이에요. 회사원이 아니에요.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eĐây là ảnh gia đình tôi. Gia đình tôi gồm bố, mẹ và tôi. Người này là bố tôi. Bố tôi là nhân viên công ty. Còn người này là mẹ tôi. Mẹ tôi là diễn viên. Mẹ không phải ca sĩ. Tôi là sinh viên đại học. Tôi không phải nhân viên công ty.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#2/ex-p44-3\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p44-3\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;ox\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;맞으면 ○, 틀리면 ×를 고르세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đúng chọn ○, sai chọn ×.\u0026quot;,\u0026quot;items\u0
