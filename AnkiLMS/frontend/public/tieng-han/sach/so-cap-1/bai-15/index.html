ng=\"ko\"\u003e어린이날\u003c/span\u003e, 15/5 là \u003cspan lang=\"ko\"\u003e스승의 날\u003c/span\u003e –\nhọc trò viết thư cảm ơn thầy cô; theo luật chống quà biếu (2016), thường chỉ đại diện lớp tặng một bông cẩm chướng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHai tay với người trên.\u003c/strong\u003e Đưa, nhận đồ hay rót đồ uống cho người trên đều bằng hai tay, hơi cúi đầu.\nChạm bà để bà nhận quà:\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"cui-chao\" data-props=\"{\u0026quot;muc\u0026quot;:[],\u0026quot;canh\u0026quot;:[{\u0026quot;kind\u0026quot;:\u0026quot;dua\u0026quot;,\u0026quot;cua\u0026quot;:{\u0026quot;who\u0026quot;:\u0026quot;후엔\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;어머님, 이거 받으세요.\u0026quot;},\u0026quot;trong\u0026quot;:{\u0026quot;who\u0026quot;:\u0026quot;할머니\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;고마워요.\u0026quot;}}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cul\u003e\u003cli\u003eKhi đưa – nhận đồ: \u003cspan lang=\"ko\"\u003e어머님, 이거 받으세요.\u003c/span\u003e (người đưa (hai tay)) · \u003cspan lang=\"ko\"\u003e고마워요.\u003c/span\u003e (người nhận (hai tay)) – Với người lớn tuổi, người trên: đưa và nhận bằng hai tay (hoặc một tay đỡ dưới cổ tay kia), hơi cúi đầu.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eCon dâu, con rể thường gọi bố mẹ chồng / vợ là \u003cspan lang=\"ko\"\u003e어머님\u003c/span\u003e,\n\u003cspan lang=\"ko\"\u003e아버님\u003c/span\u003e – Huyền gọi mẹ của Jun-ho như vậy. Sau người trên không thêm \u003cspan lang=\"ko\"\u003e씨\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eLời chúc, lời cảm ơn\u003c/h3\u003e\n\u003cp\u003eNói theo bảy câu chúc mừng, cảm ơn trong những ngày đặc biệt.\u003c/p\u003e\n\u003cfigure class=\"lesson-i
