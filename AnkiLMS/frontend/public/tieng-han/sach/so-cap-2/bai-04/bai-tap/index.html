\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e오셔서\u003c/span\u003e – (bố mẹ) đến, sang (kính ngữ của \u003cspan lang=\"ko\"\u003e와서\u003c/span\u003e) ·\n\u003cspan lang=\"ko\"\u003e그렇구나\u003c/span\u003e – ra vậy · \u003cspan lang=\"ko\"\u003e즐거운 시간 보내\u003c/span\u003e – chơi vui nhé ·\n\u003cspan lang=\"ko\"\u003e맞다\u003c/span\u003e – đúng · \u003cspan lang=\"ko\"\u003e알지?\u003c/span\u003e – biết chứ? · \u003cspan lang=\"ko\"\u003e알려 줘\u003c/span\u003e – cho\nbiết với · \u003cspan lang=\"ko\"\u003e물어보다\u003c/span\u003e – hỏi.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"hoi-thoai\" data-props=\"{\u0026quot;lines\u0026quot;:[{\u0026quot;who\u0026quot;:\u0026quot;이링\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Yi Ling\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;안젤라, 오늘 한국어 수업에 왜 안 왔어? 혹시 무슨 일이 있어? 걱정이 돼서 연락했어.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chị Angela ơi, sao hôm nay chị không đến lớp tiếng Hàn? Có chuyện gì không? Em lo nên nhắn cho chị.\u0026quot;},{\u0026quot;who\u0026quot;:\u0026quot;안젤라\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Angela\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;아, 아니. 고향에서 부모님이 오셔서 못 갔어. 지금 시내에서 구경하고 있어.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;À không. Bố mẹ chị từ quê sang nên chị không đi được. Giờ chị đang đi chơi ngắm cảnh trong trung tâm thành phố.\u0026quot;},{\u0026quot;who\u0026quot;:\u0026quot;이링\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Yi Ling\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;그렇구나. 부모님과 즐거운 시간 보내. 그런데 다음 시간에 시험이 있어. 알지?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ra vậy. Chị đi chơi vui vẻ với bố mẹ nhé. Mà buổi sau có bài kiểm tra đấy. Chị biết rồi chứ?\u0026quot;},{\u0026quot;who\u0026quot;:\u0026quot;안젤라\u0026quot;,\u0026quot;name\u0026quot;:\u0026quot;Angela\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;아, 맞다! 시험이 있지? 이따가 전화할게. 시험 범위 좀 알려 줘.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;À đúng rồi! Có bài kiểm tra nhỉ? Lát nữa chị gọi cho em. Em báo chị phạm vi thi với nhé.\u0026quot;}],\u0026quot;nhan\u0026quot;:\u0026quot;Tin nhắn\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eTiếng Hàn\u003c/th\u003e\u003cth\u003eNghĩa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eYi Ling\u003c/td\u003e\u003ctd lang=\"ko\"\u003e안젤라, 오늘 한국어 수업에 왜 안 왔어? 혹시 무슨 일이 있어? 걱정이 돼서 연락했어.\u003c/td\u003e\u003ctd\u003eChị Angela ơi, sao hôm nay chị không đến lớp tiếng Hàn? Có chuyện gì không? Em lo nên nhắn cho chị.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAngela\u003c/td\u003e\u003ctd lang=\"ko\"\u003e아, 아니. 고향에서 부모님이 오셔서 못 갔어. 지금 시내에서 구경하고 있어.\u003c/td\u003e\u003ctd\u003eÀ không. Bố mẹ chị từ quê sang nên chị không đi được. Giờ chị đang đi chơi ngắm cảnh trong trung tâm thành phố.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eYi Ling\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그렇구나. 부모님과 즐거운 시간 보내. 그런데 다음 시간에 시험이 있어. 알지?\u003c/td\u003e\u003ctd\u003eRa vậy. Chị đi chơi vui vẻ với bố mẹ nhé. Mà buổi sau có bài kiểm tra đấy. Chị biết rồi chứ?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAngela\u003c/td\u003e\u003ctd lang=\"ko\"\u003e아, 맞다! 시험이 있지? 이따가 전화할게. 시험 범위 좀 알려 줘.\u003c/td\u003e\u003ctd\u003eÀ đúng rồi! Có bài kiểm tra nhỉ? Lát nữa chị gọi cho em. Em báo chị phạm vi thi với nhé.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#4/ex-p49-1\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p49-1\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽기와 쓰기 1\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;다음 글을 읽고 질문에 답해 보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Đọc đoạn tin nhắn sau và trả lời câu hỏi.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;이링은 왜 안젤라에게 문자를 보냈어요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Vì sao Yi Ling nhắn tin cho Angela?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;걱정이 돼서 문자를 보냈어요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;걱정이 돼서 문자를 보냈어요.\u0026quot;,\u0026quot;부모님이 오셔서 문자를 보냈어요.\u0026quot;,\u0026quot;시험이 있어서 문자를 보냈어요.\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;이 메시지의 내용과 같으면 O, 다르면 X 하세요.\\n① 이링은 오늘 학교에 안 갔어요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Đúng ghi O, sai ghi X. ① Hôm nay Yi Ling không đến trường.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;X\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;안젤라는 지금 부모님을 만났어요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Bây giờ Angela đã gặp bố mẹ.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;안젤라는 이따가 이링에게 전화를 할 거예요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Lát nữa Angela sẽ gọi điện cho Yi Ling.\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;O\u0026quot;,\u0026quot;X\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;O\u0026quot;]},{\u0026quot;q\u0026quot;:\u0026quot;안젤라는 이링에게 무엇을 물어볼 거예요?\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Angela sẽ hỏi Yi Ling điều gì?\u0026quot;,\u0026quot;answer\u0026quot;:[\u0026quot;시험 범위를 물어볼 거예요.\u0026quot;],\u0026quot;options\u0026quot;:[\u0026quot;수업 시간을 물어볼 거예요.\u0026quot;,\u0026quot;시험 범위를 물어볼 거예요.\u0026quot;,\u0026quot;숙제를 물어볼 거예요.\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · Yi Ling và Ange nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003eN에게서/한테서\u003c/span\u003e – \u0026quot;Từ (ai)\u0026quot; – gắn sau người mà việc nhận, học, cuộc gọi… xuất phát từ đó; thêm 에게로 \u0026quot;về phía (ai)\u0026quot;.\u003cbr\u003e\u003cspan lang=\"ko\"\u003e친구한테서 문자를 받았어요.\u003c/span\u003e – Tôi nhận được tin nhắn của bạn.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e전화를 걸다\u003c/span\u003e gọi điện thoại (cho ai) · \u003cspan lang=\"ko\"\u003e전화를 받다\u003c/span\u003e nghe máy, nhận cuộc gọi · \u003cspan lang=\"ko\"\u003e전화를 끊다\u003c/span\u003e cúp máy, tắt cuộc gọi · \u003cspan lang=\"ko\"\u003e문자를 보내다\u003c/span\u003e gửi tin nhắn · \u003cspan lang=\"ko\"\u003e문자를 받다\u003c/span\u003e nhận tin nhắn · \u003cspan lang=\"ko\"\u003e문자를 지우다\u003c/span\u003e xoá tin nhắn · \u003cspan lang=\"ko\"\u003e전화를 바꾸다\u003c/span\u003e chuyển máy, đưa máy cho người khác nghe · \u003cspan lang=\"ko\"\u003e국제 전화를 하다\u003c/span\u003e gọi điện quốc tế · \u003cspan lang=\"ko\"\u003e영상 통화를 하다\u003c/span\u003e gọi video · \u003cspan lang=\"ko\"\u003e여보세요?\u003c/span\u003e A lô? · \u003cspan lang=\"ko\"\u003e지금 통화할 수 있어요?\u003c/span\u003e Bây giờ nói chuyện điện thoại được không? – 팀장님, 지금 통화할 수 있어요? · \u003cspan lang=\"ko\"\u003e전화 왔어요.\u003c/span\u003e Có điện thoại đến kìa. · \u003cspan lang=\"ko\"\u003e통화 중이에요.\u003c/span\u003e Máy đang bận (đang có cuộc gọi khác). · \u003cspan lang=\"ko\"\u003e지금 안 계세요.\u003c/span\u003e Bây giờ (người đó) không có ở đây ạ. · \u003cspan lang=\"ko\"\u003e전화를 잘못 걸었어요.\u003c/span\u003e Tôi gọi nhầm số rồi. · \u003cspan lang=\"ko\"\u003e전화번호가 몇 번이에요?\u003c/span\u003e Số điện thoại của bạn là bao nhiêu? · \u003cspan lang=\"ko\"\u003e답장이 없어요.\u003c/span\u003e Không có tin nhắn trả lời. · \u003cspan lang=\"ko\"\u003e진동으로 해요.\u003c/span\u003e Để điện thoại ở chế độ rung. · \u003cspan lang=\"ko\"\u003e매너 모드로 해요.\u003c/span\u003e Để điện thoại ở chế độ im lặng. · \u003cspan lang=\"ko\"\u003e휴대 전화 배터리가 없어요.\u003c/span\u003e Điện t d\u003e\u003ctd lang=\"ko\"\u003e명동은 어때요? 명동에 여러 가게가 있으니까요. 가영 씨한테서 들었어요.\u003c/td\u003e\u003ctd\u003eMyeongdong thì sao? Vì ở Myeongdong có nhiều cửa hàng. Tôi nghe Ga-yeong nói vậy.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eXiaoyu\u003c/td\u003e\u003ctd lang=\"ko\"\u003e명동은 너무 복잡해요.\u003c/td\u003e\u003ctd\u003eMyeongdong đông đúc quá.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJuan\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그러면 동대문에 가 보세요. 동대문 시장에 옷 가게가 많이 있어요.\u003c/td\u003e\u003ctd\u003eVậy thì bạn thử đến Dongdaemun xem. Ở chợ Dongdaemun có nhiều cửa hàng quần áo.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e"])</script><script>self.__next_f.push([1,"36:T2520,\u003ch3\u003e1 · Hỏi bạn: mua hoa tai ở đâu?\u003c/h3\u003e\n\u003cp\u003eMột đoạn tin nhắn của giáo trình: một người muốn mua đôi hoa tai làm quà, nhắn hỏi bạn nên đi đâu.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"tu-can-dung\" role=\"note\" aria-label=\"Từ cần dùng\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eTừ cần dùng\u003c/p\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e귀걸이\u003c/span\u003e – hoa tai · \u003cspan lang=\"ko\"\u003e선물하다\u003c/span\u003e – tặng quà ·\n\u003cspan lang=\"ko\"\u003e-(으)려고 해요\u003c/span\u003e – định … · \u003cspan lang=\"ko\"\u003e시끄럽다\u003c/span\u003e – ồn ào ·\n\u003cspan lang=\"ko\"\u003e-고 싶지 않아요\u003c/span\u003e – không muốn … · \u003cspan lang=\"ko\"\u003e강남\u003c/span\u003e – (khu) Gangnam ·\n\u003cspan lang=\"ko\"\u003e알겠어요\u003c/span\u003e – tôi hiểu rồi.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;귀걸이를 선물하려고 해요. 어디에서 살 수 있어요?\\n명동에 가 보세요.\\n명동은 너무 시끄러웠어요. 명동에 가고 싶지 않아요.\\n강남은 어때요? 강남에 귀걸이 가게가 많으니까요. 후안 씨에게서 들었어요.\\n아, 알겠어요. 고마워요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi định tặng quà là đôi hoa tai. Tôi có thể mua ở đâu?\\nBạn thử đến Myeongdong xem.\\nMyeongdong (lúc tôi đến) ồn ào quá. Tôi không muốn đến Myeongdong.\\nGangnam thì sao? Vì ở Gangnam có nhiều cửa hàng hoa tai. Tôi nghe Juan nói vậy.\\nÀ, tôi biết rồi. Cảm ơn bạn.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Đoạn tin nhắn trò chuyện: bong bóng vàng bên trái (người hỏi) và bong bóng xanh bên phải (người trả lời) xen kẽ. Phía trên là một hộp quà màu cam buộc nơ vàng và đôi hoa tai dài đính đá trắng và ba viên đá đỏ hình giọt nước.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;명동\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Myeongdong (khu mua sắm ở Seoul)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;동대문\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Dongdaemun (khu chợ, mua quần áo ở Seoul)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;강남\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Gangnam (khu phía nam sông Hàn, Seoul)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;인사동\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Insadong (phố truyền thống ở Seoul)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;카페\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;quán cà phê\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;시장\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;chợ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;더럽다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;bẩn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;깨끗하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;sạch sẽ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;복잡하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đông đúc, chen chúc\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;시끄럽다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ồn ào\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;그러면\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nếu vậy thì, vậy thì\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(장소/물건/음식)은 어때요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;(địa điểm / đồ vật / món ăn) thì thế nào? – dùng để gợi ý\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;알겠어요\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi biết rồi / được rồi\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e귀걸이를 선물하려고 해요. 어디에서 살 수 있어요?\u003cbr\u003e명동에 가 보세요.\u003cbr\u003e명동은 너무 시끄러웠어요. 명동에 가고 싶지 않아요.\u003cbr\u003e강남은 어때요? 강남에 귀걸이 가게가 많으니까요. 후안 씨에게서 들었어요.\u003cbr\u003e아, 알겠어요. 고마워요.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eTôi định tặng quà là đôi hoa tai. Tôi có thể mua ở đâu?\u003cbr\u003eBạn thử đến Myeongdong xem.\u003cbr\u003eMyeongdong (lúc tôi đến) ồn ào quá. Tôi không muốn đến Myeongdong.\u003cbr\u003eGangnam thì sao? Vì ở Gangnam có nhiều cửa hàng hoa tai. Tôi nghe Juan nói vậy.\u003cbr\u003eÀ, tôi biết rồi. Cảm ơn bạn.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-2\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-2#2/ex-p44-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p44-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;귀걸이를 사러 어디에 갑니까?\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Người viết sẽ đi đâu để mua hoa tai?\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;Đi đâu để mua hoa tai?\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;①\u0026quot;,\u0026quot;②\u0026quot;,\u0026quot;③\u0026quot;,\u0026quot;④\u0026quot;],\u0026quot;optionsTranh\u0026quot;:[\u0026quot;Myeongdong: chàng trai đeo máy ảnh
