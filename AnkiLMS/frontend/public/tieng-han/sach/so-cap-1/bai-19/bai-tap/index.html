\u003e\u003ctd\u003eĐúng vậy.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHuyền\u003c/td\u003e\u003ctd lang=\"ko\"\u003e너무 더워서 어젯밤에 잠을 못 잤어요.\u003c/td\u003e\u003ctd\u003eNóng quá nên đêm qua tôi không ngủ được.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJason\u003c/td\u003e\u003ctd lang=\"ko\"\u003e그런데 후엔 씨 고향은 여름에 한국보다 더 덥죠?\u003c/td\u003e\u003ctd\u003eMà quê chị Huyền vào mùa hè nóng hơn Hàn Quốc phải không?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHuyền\u003c/td\u003e\u003ctd lang=\"ko\"\u003e네, 베트남은 한국보다 비도 많이 오고 더 더워요.\u003c/td\u003e\u003ctd\u003eVâng, Việt Nam mưa nhiều hơn và cũng nóng hơn Hàn Quốc.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T2583,\u003cp\u003eCô giáo phát bài đọc về bốn mùa ở Hàn Quốc: mỗi mùa kéo dài từ tháng nào, thời tiết ra sao, người Hàn làm gì? Chạm từ\nhoặc câu để xem nghĩa.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;한국은 봄, 여름, 가을, 겨울, 사계절이 있습니다. 봄은 3월부터 5월까지입니다. 봄은 따뜻하고 꽃이 많이 핍니다. 사람들은 봄에 꽃을 보러 갑니다. 여름은 6월부터 8월까지입니다. 아주 덥고 비가 많이 옵니다. 그래서 한국 사람들은 봄, 가을, 겨울보다 여름에 휴가를 많이 갑니다. 9월부터 11월까지는 가을입니다. 가을은 쌀쌀하고 단풍이 매우 아름답습니다. 그래서 등산을 많이 합니다. 12월부터 2월까지는 겨울입니다. 겨울에는 눈이 오고 춥습니다. 사람들은 겨울에 눈썰매, 스키를 타러 갑니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Hàn Quốc có bốn mùa: xuân, hạ, thu, đông. Mùa xuân từ tháng 3 đến tháng 5. Mùa xuân ấm áp và hoa nở rất nhiều. Mọi người đi ngắm hoa vào mùa xuân. Mùa hè từ tháng 6 đến tháng 8. Trời rất nóng và mưa nhiều. Vì vậy người Hàn Quốc đi nghỉ vào mùa hè nhiều hơn mùa xuân, mùa thu hay mùa đông. Từ tháng 9 đến tháng 11 là mùa thu. Mùa thu se lạnh và lá đỏ rất đẹp. Vì vậy mọi người hay đi leo núi. Từ tháng 12 đến tháng 2 là mùa đông. Mùa đông có tuyết và trời lạnh. Vào mùa đông, mọi người đi chơi xe trượt tuyết và trượt ski.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Bốn tranh tròn: 봄 – khóm hoa tulip, cúc, thủy tiên nhiều màu; 여름 – bãi biển có ô che nắng sặc sỡ, người tắm nắng trên ghế; 가을 – sườn núi phủ lá đỏ cam; 겨울 – người trượt ski và trượt ván trên dốc tuyết.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;봄\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa xuân\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;따뜻하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ấm áp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;여름\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa hè\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;덥다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nóng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가을\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa thu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;쌀쌀하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;se lạnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;겨울\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa đông\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;춥다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lạnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;맑다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;trời trong, quang đãng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;흐리다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;trời âm u, nhiều mây\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;비가 오다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;trời mưa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;눈이 오다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tuyết rơi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;구름이 끼다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;có mây, mây giăng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;안개가 끼다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;có sương mù\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;바람이 불다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;gió thổi\u0026quot;},{\u0026quot ó thổi nhiều. Nhưng trời ấm áp. Mùa hè rất nóng. Trời hay mưa. Mùa thu trời trong. Không lạnh. Và cũng không nóng. Mùa đông lạnh. Tuyết cũng rơi.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Tranh bốn ô cùng một cái cây giữa núi: ô trên trái (xuân) trời hồng, cây lá non, cỏ xanh có hoa; ô trên phải (hè) trời xanh, cây sai quả đỏ; ô dưới phải (thu) trời cam, cây lá úa vàng nâu đang rụng; ô dưới trái (đông) trời xanh nhạt mây trắng, cây trụi lá, núi và mặt đất phủ tuyết.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;날씨\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thời tiết\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;맑다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;trong, quang (trời)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;흐리다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;âm u, nhiều mây\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;비\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mưa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;눈\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tuyết\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;rơi (mưa, tuyết); đến\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;덥다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nóng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;춥다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;lạnh\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;따뜻하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ấm áp\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;시원하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mát mẻ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;봄\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa xuân\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;여름\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa hè\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가을\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mùa thu\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;겨울\u0026quot;,\u0026quot;vi\u đứng sau danh từ.\u003cbr\u003e\u003cspan lang=\"ko\"\u003e알래스카는 서울보다 추워요.\u003c/span\u003e – Alaska lạnh hơn Seoul.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e계절\u003c/span\u003e mùa · \u003cspan lang=\"ko\"\u003e사계절\u003c/span\u003e bốn mùa · \u003cspan lang=\"ko\"\u003e봄\u003c/span\u003e mùa xuân · \u003cspan lang=\"ko\"\u003e따뜻하다\u003c/span\u003e ấm áp · \u003cspan lang=\"ko\"\u003e여름\u003c/span\u003e mùa hè · \u003cspan lang=\"ko\"\u003e덥다\u003c/span\u003e nóng · \u003cspan lang=\"ko\"\u003e가을\u003c/span\u003e mùa thu · \u003cspan lang=\"ko\"\u003e쌀쌀하다\u003c/span\u003e se lạnh · \u003cspan lang=\"ko\"\u003e시원하다\u003c/span\u003e mát mẻ – 가을은 시원해요. Mùa thu mát mẻ. · \u003cspan lang=\"ko\"\u003e겨울\u003c/span\u003e mùa đông · \u003cspan lang=\"ko\"\u003e춥다\u003c/span\u003e lạnh · \u003cspan lang=\"ko\"\u003e날씨\u003c/span\u003e thời tiết · \u003cspan lang=\"ko\"\u003e맑다\u003c/span\u003e trời trong, quang đãng · \u003cspan lang=\"ko\"\u003e흐리다\u003c/span\u003e trời âm u, nhiều mây · \u003cspan lang=\"ko\"\u003e비가 오다\u003c/span\u003e trời mưa · \u003cspan lang=\"ko\"\u003e눈이 오다\u003c/span\u003e tuyết rơi · \u003cspan lang=\"ko\"\u003e구름이 끼다\u003c/span\u003e có mây, mây giăng · \u003cspan lang=\"ko\"\u003e안개가 끼다\u003c/span\u003e có sương mù · \u003cspan lang=\"ko\"\u003e바람이 불다\u003c/span\u003e gió thổi · \u003cspan lang=\"ko\"\u003e천둥/번개가 치다\u003c/span\u003e có sấm / có chớp · \u003cspan lang=\"ko\"\u003e기온\u003c/span\u003e nhiệt độ không khí – 오늘은 기온이 낮아요. Hôm nay nhiệt độ thấp. · \u003cspan lang=\"ko\"\u003e도\u003c/span\u003e độ (nhiệt độ) – 오늘은 33도예요. Hôm nay 33 độ. · \u003cspan lang=\"ko\"\u003e태풍\u003c/span\u003e bão – 태풍이 와요. Bão đến. · \u003cspan lang=\"ko\"\u003e우산\u003c/span\u003e cái ô, cái dù · \u003cspan lang=\"ko\"\u003e선풍기\u003c/span\u003e quạt máy – 여름에는 선풍기가 있어서 좋아요. Mùa hè có quạt máy nên dễ chịu. · \u003cspan lang=\"ko\"\u003e패딩\u003c/span\u003e áo phao – 겨울에는 패딩을 입어요. Mùa đông mặc áo phao. · \u003cspan lang=\"ko\"\u003e더\u0
