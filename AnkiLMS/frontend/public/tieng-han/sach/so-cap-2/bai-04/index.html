an> – Chị ơi, hôm nay vui ghê! Tuần sau gặp nhé.</li><li>후엔 (21:41): <span lang="ko">응, 나도! 잘 자.</span> – Ừ, chị cũng thế! Ngủ ngon nhé.</li></ul><p><em>Seul-gi ngó qua vai mẹ.</em></p><ul><li><span lang="ko">엄마, 반말 잘하네! 그럼 나한테도 반말해.</span> – Mẹ nói trống không giỏi ghê! Thế mẹ nói trống không với con luôn đi.</li></ul><p><em>Lần đầu tiên Huyền gọi con là 슬기야 (Seul-gi à – tiếng gọi thân).</em></p><ul><li><span lang="ko">알았어, 슬기야!</span> – Được rồi, Seul-gi!</li></ul><p><em>Điện thoại reo. Sắp đến sinh nhật Seul-gi rồi…</em></p><ul><li><span lang="ko">엄마, 할머니한테서 전화 왔어!</span> – Mẹ ơi, bà nội gọi kìa!</li></ul><p><em>Nói trống không với ai, khi nào? Ai gọi cho ai? Học xong bài này, bạn biết.</em></p></div></figure></div></div><div class="v2-body mt-8"><div data-sach-page="mo-bai" class="sach-prose prose max-w-none"><p>Ba việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.</p>

uot;:[{\u0026quot;who\u0026quot;:\u0026quot;슬기\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;엄마, 할머니한테서 전화 왔어!\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mẹ ơi, bà nội gọi kìa!\u0026quot;,\u0026quot;at\u0026quot;:[700,170]}]}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003eTập 4 · Mẹ nói trống không được rồi!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eThứ Bảy 24/4, giờ giải lao. Angela nhìn Huyền, có một đề nghị…\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e후엔 씨, 우리 이제 말 놓을까요?\u003c/span\u003e – Chị Huyền, mình nói trống không với nhau nhé?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e좋아요… 아, 아니, 좋아!\u003c/span\u003e – Được chứ… à không, được thôi!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eAngela cười tít mắt.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e그럼 이제 언니라고 부를게!\u003c/span\u003e – Thế từ giờ em gọi là \u0026quot;chị\u0026quot; nhé!\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e그래, 안젤라!\u003c/span\u003e – Ừ, Angela!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eTối hôm đó, Angela nhắn tin cho Huyền.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e안젤라 (21:40): \u003cspan lang=\"ko\"\u003e언니, 오늘 재미있었어! 다음 주에 봐.\u003c/span\u003e – Chị ơi, hôm nay vui ghê! Tuần sau gặp nhé.\u003c/li\u003e\u003cli\u003e후엔 (21:41): \u003cspan lang=\"ko\"\u003e응, 나도! 잘 자.\u003c/span\u003e – Ừ, chị cũng thế! Ngủ ngon nhé.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eSeul-gi ngó qua vai mẹ.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e엄마, 반말 잘하네! 그럼 나한테도 반말해.\u003c/span\u003e – Mẹ nói trống không giỏi ghê! Thế mẹ nói trống không với con luôn đi.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eLần đầu tiên Huyền gọi con là 슬기야 (Seul-gi à – tiếng gọi thân).\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e알았어, 슬기야!\u003c/span\u003e – Được rồi, Seul-gi!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eĐiện thoại reo. Sắp đến sinh nhật Seul-gi rồi…\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e엄마, 할머니한테서 전화 왔어!\u003c/span\u003e – Mẹ ơi, bà nội gọi kìa!\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eNói trống không với ai, khi nào? Ai gọi cho ai? Học xong bài này, bạn biết.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eBa việc của bài này – làm xong việc nào, danh sách tự đánh dấu việc đó.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"nhiem-vu\" data-props=\"{\u0026quot;lesson\u0026quot;:\u0026quot;so-cap-2/bai-04\u0026quot;,\u0026quot;viec\u0026quot;:[{\u0026quot;key\u0026quot;:\u0026quot;goi-dien\u0026quot;,\u0026quot;label\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Gọi điện, hỏi ai gọi cho ai\u0026quot;},\u0026quot;ko\u0026quot;:\u0026quot;지금 통화할 수 있어요?\u0026quot;,\u0026quot;can\u0026quot;:[{\u0026quot;kind\u0026quot;:\u0026quot;xepcho\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/xep-cho-2\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;quiz\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/quiz\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;truyen\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/truyen/bai-04-hoi-thoai\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;exercise\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#4/ex-p48-1\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;exercise\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step2#4/ex-p48-2\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;quiz\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/quiz-3\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;ngheso\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/nghe-so\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;exercise\u0026quot;,\u0026quot;id\u0026quot;:\u0026quo 03e\u003cth\u003eNghĩa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화를 걸다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003egọi điện thoại (cho ai)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화를 받다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003enghe máy, nhận cuộc gọi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화를 끊다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ecúp máy, tắt cuộc gọi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e문자를 보내다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003egửi tin nhắn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e문자를 받다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003enhận tin nhắn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e문자를 지우다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003exoá tin nhắn\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화를 바꾸다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003echuyển máy, đưa máy cho người khác nghe\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e국제 전화를 하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003egọi điện quốc tế\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e영상 통화를 하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003egọi video\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e여보세요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eA lô?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e지금 통화할 수 있어요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eBây giờ nói chuyện điện thoại được không? – 팀장님, 지금 통화할 수 있어요?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화 왔어요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eCó điện thoại đến kìa.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e통화 중이에요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eMáy đang bận (đang có cuộc gọi khác).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e지금 안 계세요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eBây giờ (người đó) không có ở đây ạ.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화를 잘못 걸었어요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eTôi gọi nhầm số rồi.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e전화번호가 몇 번이에요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eSố điện thoại của bạn là bao nhiêu?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e답장이 없어요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eKhông có tin nhắn trả lời.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e진동으로 해요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eĐể điện thoại ở chế độ rung.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e매너 모드로 해요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eĐể điện thoại ở chế độ im lặng.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e휴대 전화 배터리가 없어요.\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eĐiện thoại hết pin.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e반말\u003c/span\u003e\u003c/td\u003e\u003ctd\u003elối nói trống không (thân mật, bỏ 요) – 친구한테 반말해요.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e존댓말\u003c/span\u003e\u003c/td\u003e\u003ctd\u003elối nói lịch sự, kính trọng (-요, -습니다) – 선생님한테는 존댓말을 해요.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e말을 놓다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ethôi nói lịch sự, chuyển sang nói trống không – 우리 말 놓을까요?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e반말하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003enói trống không – 나한테도 반말해.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e나\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etôi, mình (khi nói trống không – thay cho 저) – 나 후엔이야.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e응\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eừ (thay cho 네) – 응, 좋아!\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e아니\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ekhông (thay cho 아니요) – 아니, 시간이 없어.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e그래\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eừ, được (đồng ý) – 그래, 같이 가자!\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e알았어\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ebiết rồi, được rồi (thay cho 알았어요) – 응, 알았어.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e또\u003c/span\u003e\u003c/td\u003e\u003ctd\u003elại, nữa – 다음에 또 통화해.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e혹시\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eliệu có phải, không biết có… (hỏi dè dặt) \u003csmall\u003e(hoặc thị)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e걱정이 되다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003elo lắng, thấy lo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e구경하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eđi xem, ngắm cảnh, tham quan\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e시험 범위\u003c/span\u003e\u003c/td\u003e\u003ctd\u003ephạm vi (nội dung) thi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e연락하다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eliên lạc (gọi, nhắn) – 내일 다시 연락할게. \u003csmall\u003e(liên lạc)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e스마트폰\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eđiện thoại thông minh\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e앱\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eứng dụng (app) trên điện thoại\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e메시지\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etin nhắn (trong ứng dụng chat)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e명함\u003c/span\u003e\u003c/td\u003e\u003ctd\u003edanh thiếp – 명함을 주세요. \u003csmall\u003e(danh hàm)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e위치\u003c/span\u003e\u003c/td\u003e\u003ctd\u003evị trí – 지금 위치가 어디예요? \u003csmall\u003e(vị trí)\u003c/small\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2c:Ta3c,\u003cp\u003e\u003cspan lang=\"ko\"\u003e전화\u003c/span\u003e đọc là \u003cem\u003eđiện thoại\u003c/em\u003e – y như tiếng Việt. Những từ điện thoại khác cũng là chữ Hán: đoán thử\nxem.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"han-viet\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;step2#4/han-viet\u0026quot;,\u0026quot;pairs\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;전화\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;điện thoại\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;điện thoại\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;통화\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;thông thoại\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nói chuyện qua điện thoại\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;번호\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;phiên hiệu\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;số (số điện thoại, số thứ tự)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;문자\u0026quot;,\u0026quot;hv\u0026quot;:\u0026quot;v o\u0026quot;:\u0026quot;Với cô giáo luôn giữ 요.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-아/어\u003c/span\u003e\u003c/strong\u003e: Lối nói thân mật với người nhà, người nhỏ tuổi hơn, bạn thân (khi cả hai đã đồng ý) – phần lớn chỉ cần bỏ 요 ở cuối câu.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eĐuôi có 요: -아요/어요, -(으)ㄹ까요, -(으)ㄹ게요, -네요\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003ebỏ 요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹어요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹어\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e전화해요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e전화해\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e갈까요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e갈까\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e갈게요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e갈게\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e예쁘네요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e예쁘네\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ có patchim + 이에요\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e이야\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e후엔이에요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e후엔이야\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e학생이에요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e학생이야\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ không có patchim + 예요\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e야\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e친구예요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e친구야\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e슬기예요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e슬기야\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRủ nhau -(으)ㅂ시다\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-자\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e갑시다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e가자\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e먹읍시다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹자\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eĐáp 네 / 아니요\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e응 / 아니\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e네\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e응\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e아니요\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e아니\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTừ xưng 저, 제가\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e나, 내가\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e저\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e나\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e제가\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e내가\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e저도\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e나도\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGọi tên: bỏ 씨, có patchim thêm 아, không patchim thêm 야\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e아 / 야\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e지은 씨\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e지은아\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e슬기 씨\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e슬기야\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 지금 뭐 해?\u003c/span\u003e – A: Đang làm gì đấy?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 집에서 쉬어.\u003c/span\u003e – B: Đang nghỉ ở nhà.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 주말에 시간 있어?\u003c/span\u003e – A: Cuối tuần rảnh không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나: 아니. 약속이 있어.\u003c/span\u003e – B: Không. Có hẹn rồi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e나 후엔이야. 지금 통화할 수 있어?\u003c/span\u003e – Chị Huyền đây. Giờ nói chuyện được không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e내일 같이 점심 먹자.\u003c/span\u003e – Mai cùng ăn trưa nhé.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eThử ngay: câu nào nói với bạn thân, người nhà; câu nào nói với cô giáo, nhân viên? Xếp mỗi câu vào đúng ô.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;친구 · 가족\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;bạn thân, người nhà – nói trống không\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;선생님 · 직원\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;cô giáo, nhân viên – nói -요\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;와, 예쁘네!\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;-네 không có 요 – nói với người thân.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;네, 괜찮아요.\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;네 và câu có 요 – lịch sự.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;내일 같이 가자!\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Rủ bằng -자 – chỉ nói với bạn thân, người nhà.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;정아라 선생님 좀 바꿔 주세요.\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Có 요 – câu nhờ lịch sự khi gọi đến trung tâm.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;지금 뭐 해?\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Câu không có 요 – chỉ hỏi người thân như vậy.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;오늘 수업에 갈 수 없어요.\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Có 요 – câu báo lịch sự với cô giáo.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;아니, 시간이 없어.\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;아니 và câu bỏ 요 – nói với người thân.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;이거 얼마예요?\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Có 요 – hỏi nhân viên cửa hàng.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;응, 알았어.\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;응 và câu bỏ 요 – nói với người thân.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;지금 통화할 수 있어요?\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Có 요 – câu lịch sự, hợp với cô giáo, nhân viên.\u0026quot;}}],\u0026quot;luat\u0026quot;:\u0026quot;tu-do\u0026quot;,\u0026quot;dan\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Câu bỏ 요 – nói với người thân. Câu có 요 – nói với cô giáo, nhân viên.\u0026quot;},\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e와, 예쁘네! · 네, 괜찮아요. · 내일 같이 가자! · 정아라 선생님 좀 바꿔 주세요. · 지금 뭐 해? · 오늘 수업에 갈 수 없어요. · 아니, 시간이 없어. · 이거 얼마예요? · 응, 알았어. · 지금 통화할 수 있어요?\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e친구 · 가족\u003c/span\u003e – bạn thân, người nhà – nói trống không\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e선생님 · 직원\u003c/span\u003e – cô giáo, nhân viên – nói -요\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T20a8,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot an\u003e – tin nhắn – Angela nhắn cho bạn\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e탁자\u003c/span\u003e – bàn\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e영상 통화\u003c/span\u003e – gọi video\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eKhi nào nói trống không?\u003c/strong\u003e Người Hàn nói \u003cspan lang=\"ko\"\u003e반말\u003c/span\u003e với bạn thân cùng tuổi, người nhỏ tuổi hơn,\nngười trong nhà. Mới quen thì nói \u003cspan lang=\"ko\"\u003e-요\u003c/span\u003e, kể cả với người cùng tuổi; thân rồi, một người hỏi\n\u003cspan lang=\"ko\"\u003e우리 말 놓을까요?\u003c/span\u003e – cả hai đồng ý mới đổi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGọi điện lịch sự.\u003c/strong\u003e Mở đầu bằng \u003cspan lang=\"ko\"\u003e여보세요\u003c/span\u003e, nói tên mình, rồi hỏi\n\u003cspan lang=\"ko\"\u003e지금 통화할 수 있어요?\u003c/span\u003e – được thì mới nói tiếp. Nhắn tin cho người lớn tuổi, cô giáo, sếp vẫn giữ\n\u003cspan lang=\"ko\"\u003e-요\u003c/span\u003e; trong lớp, chỗ đông người thì để điện thoại chế độ rung (\u003cspan lang=\"ko\"\u003e진동\u003c/span\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eỨng dụng trên điện thoại.\u003c/strong\u003e Người Hàn nhắn tin chủ yếu qua \u003cspan lang=\"ko\"\u003e카카오톡\u003c/span\u003e – ứng dụng chat phổ biến\nnhất ở Hàn Quốc; tin nhắn thường (\u003cspan lang=\"ko\"\u003e문자\u003c/span\u003e) hay dùng cho tin báo của ngân hàng, giao hàng. Gặp nguy\nhiểm thì gọi \u003cspan lang=\"ko\"\u003e112\u003c/span\u003e (cảnh sát) hoặc \u003cspan lang=\"ko\"\u003e119\u003c/span\u003e (cứu hoả, cấp cứu).\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eNgười lớn tuổi hơn có thể nói trống không với bạn – bạn vẫn đáp \u003cspan lang=\"ko\"\u003e-요\u003c/span\u003e. Tự nói trống\nkhông với người lớn tuổi hơn, người mới quen là thất lễ.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eGọi điện cho cô giáo\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu của một cuộc gọi báo nghỉ học.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-2/bai-04/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;여보세요? 선생님, 안녕하세요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A lô? Em chào cô ạ.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;지금 괜찮으세요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bây giờ cô có tiện nghe máy không ạ?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;내일 일이 있어서 수업에 갈 수 없어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Mai em có việc nên không đến lớp được ạ.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;죄송해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Em xin lỗi cô.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;괜찮아요. 다음 주에 봐요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Không sao. Tuần sau gặp em nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;안녕히 계세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Em chào cô, em cúp máy ạ.\u0026quot;}],\u0026quot;names\u0026quot;:[]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003col\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e여보세요? 선생님, 안녕하세요?\u003c/span\u003e – A lô? Em chào cô ạ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e지금 괜찮으세요?\u003c/span\u003e – Bây giờ cô có tiện nghe máy không ạ?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e내일 일이 있어서 수업에 갈 수 없어요.\u003c/span\u003e – Mai em có việc nên không đến lớp được ạ.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e죄송해요.\u003c/span\u003e – Em xin lỗi cô.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e괜찮아요. 다음 주에 봐요.\u003c/span\u003e – Không sao. Tuần sau gặp em nhé.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e안녕히 계세요.\u003c/span\u003e – Em chào cô, em cúp m
