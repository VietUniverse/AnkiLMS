r\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2f:T4433,\u003cp\u003eCô giáo mang đến lớp bài viết của một bạn du học sinh. Bài dùng đuôi \u003cspan lang=\"ko\"\u003e-습니다\u003c/span\u003e và thì quá khứ của\nbài 13, 14 – giờ chỉ cần bắt ý.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;저는 한국 음식 중에서 김치를 제일 좋아합니다. 처음에는 너무 짜고 매워서 잘 못 먹었습니다. 그런데 어느 날 김치를 라면과 같이 먹었습니다. 조금 매웠습니다. 그렇지만 맛이 괜찮았습니다. 그때부터 한국 음식과 같이 김치를 자주 먹습니다. 지금은 방학 때 고향에서도 김치가 생각납니다. 다음에 고향 집에 김치를 사 가고 싶습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trong các món ăn Hàn Quốc, tôi thích kim chi nhất. Lúc đầu kim chi mặn và cay quá nên tôi không ăn được mấy. Nhưng một hôm tôi ăn kim chi cùng với mì ramen. Hơi cay một chút. Nhưng vị cũng khá ổn. Từ đó tôi thường ăn kim chi cùng với các món Hàn. Bây giờ, ngay cả khi về quê vào kỳ nghỉ tôi cũng nhớ đến kim chi. Lần sau tôi muốn mua kim chi mang về nhà ở quê.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Nền hồng: chàng trai tóc đen mặc hoodie tím ngồi trước nồi mì ramen vàng có trứng, dùng đũa gắp sợi mì dài lên miệng; cạnh nồi là đĩa kim chi đỏ.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;떡볶이\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tteokbokki (bánh gạo xào cay)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;김밥\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;gimbap (cơm cuộn rong biển)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;음료수\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đồ uống, nước ngọt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;메뉴\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thực đơn, món\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;인분\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;suất, phần (cho một người)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;주세요\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cho tôi (gọi món)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;맛있다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ngon\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;맛없다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;không ngon, dở\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;맵다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;cay\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;달다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;ngọt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;싱겁다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhạt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;짜다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mặn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;쓰다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đắng\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(명사)는 어때요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;(N) thì sao? / (N) thế nào? – dùng để gợi ý, hỏi ý kiến\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;(명사)가 좋다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;thích (N) / (N) tốt\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;김치\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kim chi\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;라면\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;mì ramen, mì gói\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;괜찮다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;được, ổn, không tệ\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;방학\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;kỳ nghỉ (của trường học)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;고향\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;quê hương, quê nhà\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;생각나다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;nhớ đến, chợt nghĩ đến\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cspan lang=\"ko\"\u003e저는 한국 음식 중에서 김치를 제일 좋아합니다. 처음에는 너무 짜고 매워서 잘 못 먹었습니다. 그런데 어느 날 김치를 라면과 같이 먹었습니다. 조금 매웠습니다. 그렇지만 맛이 괜찮았습니다. 그때부터 한국 음식과 같이 김치를 자주 먹습니다. 지금은 방학 때 고향에서도 김치가 생각납니다. 다음에 고향 집에 김치를 사 가고 싶습니다.\u003c/span\u003e\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDịch\u003c/summary\u003e\u003cp\u003eTrong các món ăn Hàn Quốc, tôi thích kim chi nhất. Lúc đầu kim chi mặn và cay quá nên tôi không ăn được mấy. Nhưng một hôm tôi ăn kim chi cùng với mì ramen. Hơi cay một chút. Nhưng vị cũng khá ổn. Từ đó tôi thường ăn kim chi cùng với các món Hàn. Bây giờ, ngay cả khi về quê vào kỳ nghỉ tôi cũng nhớ đến kim chi. Lần sau tôi muốn mua kim chi mang về nhà ở quê.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;sejong-1#11/ex-p156-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p156-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;읽고 쓰기 연습\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;read-answer\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;이 사람은 김치와 무엇을 같이 먹었습니까?\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Người này đã ăn kim chi cùng với món gì?\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;\u0026quot;,\u0026quot;options\u0026quot;:[\u0026quot;비빔밥\u0026quot;,\u0026quot;라면\u0026quot;,\u0026quot;김밥\u0026quot;,\u0026quot;떡볶이\u0026quot;],\u0026quot;optionsTranh\u0026quot;:[\u0026quot;Bát bibimbap có trứng ốp la và rau.\u0026quot;,\u0026quot;Nồi mì ramen vàng có trứng.\u0026quot;,\u0026quot;Đĩa gimbap.\u0026quot;,\u0026quot;Đĩa tteokbokki có trứng.\u0026quot;],\u0026quot;answer\u0026quot;:[\u0026quot;라면\u0026quot;]}]},\u0026quot;nhan\u0026quot;:\u0026quot;Đọc · ăn kim chi cùng món gì?\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e이 사람은 김치와 무엇을 같이 먹었습니까?\u003c/span\u003e\u003c/strong\u003e – Người này đã ăn kim chi cùng v
