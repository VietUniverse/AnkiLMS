1,"\u003cp\u003eRamin, bạn cùng lớp, nhắn cho cả lớp. \u003cspan lang=\"ko\"\u003e답장해 주세요\u003c/span\u003e – trả lời giúp mình nhé. Chạm từ hoặc câu\nđể xem nghĩa.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"doc\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;reading\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;r-1\u0026quot;,\u0026quot;titleKo\u0026quot;:\u0026quot;라민\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;여러분 안녕하세요?\\n우리 반 친구 디요라 씨가 다음 달에 고향에 갈 거예요. 다음 달부터 우리와 같이 한국어 공부를 못 해요. 그래서 다음 주 토요일 6시 30분에 우리 반 모임을 할 거예요. 센터 옆 한국 식당에서 식사할까요? 토요일에 누가 못 와요? 답장해 주세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chào cả lớp.\\nBạn Diyora lớp mình tháng sau sẽ về quê. Từ tháng sau bạn ấy không học tiếng Hàn cùng chúng ta được nữa. Vì vậy 6 giờ 30 thứ Bảy tuần sau lớp mình sẽ họp mặt. Chúng ta ăn ở nhà hàng Hàn Quốc cạnh trung tâm nhé? Thứ Bảy có ai không đến được không? Trả lời giúp mình nhé.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Màn hình tin nhắn điện thoại: thanh trên ghi tên người gửi \u0026#39;라민\u0026#39;, bong bóng tin nhắn dài kết thúc bằng biểu tượng mặt cười, giờ gửi 오후 4:16.\u0026quot;},\u0026quot;gloss\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;친구 모임(반 모임)\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;buổi họp mặt bạn bè (họp lớp)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;직장 모임(회식)\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;buổi họp mặt công ty (liên hoan, ăn uống cùng đồng nghiệp)\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;약속하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;hẹn, hứa\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;약속을 지키다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;giữ lời hẹn, đúng hẹn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;약속 시간을 정하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;định giờ hẹn\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;약속 장소를 정하다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;định nơi hẹn\u0026quot;},{\u0026qu quay sang bạn.\u003c/p\u003e\u003cp\u003eAngela\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e민 씨, 이번 주말에 같이 영화 볼까요?\u003c/p\u003e\u003cp\u003e민 ơi, cuối tuần này mình cùng xem phim nhé?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 네, 좋아요! / 미안해요. 주말에 약속이 있어요.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e몇 시에 만날까요?\u003c/p\u003e\u003cp\u003eMình gặp nhau lúc mấy giờ?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 오후 2시에 만납시다. / 저녁 7시에 만나요.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp lang=\"ko\"\u003e민 씨, 지금 뭐 하고 있어요?\u003c/p\u003e\u003cp\u003e민 đang làm gì đấy?\u003c/p\u003e\u003cp lang=\"ko\"\u003e→ 커피를 마시고 있어요. / 한국어를 공부하고 있어요. / 친구를 기다리고 있어요.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eRủ bạn, hẹn gặp\u003c/h3\u003e\n\u003cp\u003eGiờ bạn rủ lại: rủ một bạn làm một việc hôm nay. Bạn ấy nhận lời hoặc từ chối, rồi hai người hẹn giờ và nơi gặp.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"bai-tap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;step1#14/ex-p158-2\u0026quot;,\u0026quot;exercise\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;ex-p158-2\u0026quot;,\u0026quot;section\u0026quot;:\u0026quot;말하기와 듣기\u0026quot;,\u0026quot;kind\u0026quot;:\u0026quot;speak\u0026quot;,\u0026quot;promptKo\u0026quot;:\u0026quot;여러분은 오늘 뭐 하고 싶어요? 친구와 약속을 해 보세요.\u0026quot;,\u0026quot;promptVi\u0026quot;:\u0026quot;Hôm nay bạn muốn làm gì? Hãy thử hẹn với bạn.\u0026quot;,\u0026quot;items\u0026quot;:[{\u0026quot;q\u0026quot;:\u0026quot;가: 오늘 같이 쇼핑할까요?\\n나: 미안해요. 오늘은 약속이 있어요.\u0026quot;,\u0026quot;qVi\u0026quot;:\u0026quot;A: Hôm nay mình cùng đi mua sắm nhé?\\nB: Xin lỗi. Hôm nay tôi có hẹn rồi.\u0026quot;}]},\u0026quot;nhan\u0026quot;:\u0026quot;Nói · rủ bạn và hẹn gặp\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e여러분은 오늘 뭐 하고 싶어요? 친구와 약속을 해 보세요.\u003
