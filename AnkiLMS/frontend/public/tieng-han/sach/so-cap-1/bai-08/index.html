026quot;dung\u0026quot;:\u0026quot;추워요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Gốc có ㅂ không ghép thẳng – ㅂ thành 워요.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;보어요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;봐요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;보 có ㅗ nên đi với 아요 (không phải 어요), rồi gộp ㅗ + 아 thành 봐요.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-아요/어요\u003c/span\u003e\u003c/strong\u003e: Đuôi câu lịch sự hằng ngày – như thêm \u0026quot;ạ\u0026quot; cuối câu tiếng Việt. Cùng một câu, lên giọng cuối câu là thành câu hỏi.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối của gốc là ㅏ hoặc ㅗ\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-아요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e좋다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e좋아요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e많다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e많아요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNguyên âm cuối khác (ㅓ, ㅜ, ㅡ, ㅣ…)\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e-어요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e먹다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e먹어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e읽다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e읽어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e맛있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e맛있어요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc là 하다\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e해요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e공부하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e공부해요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e청소하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e청소해요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e빵이 맛있어요?\u003c/span\u003e – Bánh mì có ngon không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e네, 맛있어요.\u003c/span\u003e – Vâng, ngon.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 사과가 싸요?\n나: 아니요, 사과가 비싸요.\u003c/span\u003e – A: Táo có rẻ không?\nB: Không, táo đắt.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e한국어는 쉬워요. 영어는 어려워요.\u003c/span\u003e – Tiếng Hàn thì dễ. Tiếng Anh thì khó.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eThử ngay:\u003c/strong\u003e máy chia động từ – bỏ \u003cspan lang=\"ko\"\u003e다\u003c/span\u003e, nhìn nguyên âm cuối của gốc, rồi đưa từng từ vào đúng\nngăn.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-08/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;아요\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;어요\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;해요\u0026quot;}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;재미있다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;바쁘다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;읽다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;만나다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;마시다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;청소하다\u0026quot;,\u0026quot;o\u0026quot;:2},{\u0026quot;ko\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;공부하다\u0026quot;,\u0026quot;o\u0026quot;:2},{\u0026quot;ko\u0026quot;:\u0026quot;좋다\u0026quot;,\u0026quot;o\u0026quot;:0}],\u0026quot;luat\u0026quot;:\u0026quot;a-eo\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e재미있다 · 바쁘다 · 읽다 · 만나다 · 마시다 · 청소하다 · 보다 · 먹다 · 공부하다 · 좋다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e아요\u003c/span\u003e\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e어요\u003c/span\u003e\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e해요\u003c/span\u003e\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2d:T1583,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eul-reul\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N을/를 V-아요/어요\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;명사에 붙어 문장에서 목적어임을 나타낼 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trợ từ tân ngữ: gắn sau danh từ để đánh dấu đối tượng chịu tác động của hành động (ăn gì, xem gì, học gì). Danh từ có 받침 + 을 (책을); không có 받침 + 를 (사과를).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;을\u0026quot;,\u0026quot;책\u0026quot;,\u0026quot;책을\u0026quot;],[\u0026quot;을\u0026quot;,\u0026quot;옷\u0026quot;,\u0026quot;옷을\u0026quot;],[\u0026quot;를\u0026quot;,\u0026quot;사과\u0026quot;,\u0026quot;사과를\u0026quot;],[\u0026quot;를\u0026quot;,\u0026quot;영화\u0026quot;,\u0026quot;영화를\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;지금 뭐 해요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bây giờ bạn đang làm gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;책을 읽어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đang đọc sách.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 무엇을 마셔요?\\n나: 주스를 마셔요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Bạn uống gì?\\nB: Tôi uống nước hoa quả.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저는 텔레비전을 봐요.\\n성민 씨는 한국어를 공부해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi xem ti vi.\\nSeong-min học tiếng Hàn.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Tranh chia đôi: bên trái chàng trai tóc xoăn đeo kính, áo cardigan xanh lá, ngồi bàn có tách cà phê, gọi điện hỏi \\\u0026quot;지금 뭐 해요?\\\u0026quot;; bên phải cô gái tóc nâu áo sơ mi caro đỏ nghe điện thoại, ngồi đọc sách trước giá sách, đáp \\\u0026quot;책을 읽어요.\\\u0026quot;\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;Gắn sau danh từ chịu tác động của hành động – trả lời câu hỏi \\\u0026quot;ăn gì, xem gì, học gì\\\u0026quot;. Tiếng Việt không có chữ nào tương ứng.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;을\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;책\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;책을\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;옷\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;옷을\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;를\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;사과\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;사과를\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;영화\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;영화를\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;한국어을\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;한국어를\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;어 không có patchim nên dùng 를.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN을/를 V-아요/어요\u003c/span\u003e\u003c/strong\u003e: Gắn sau danh từ chịu tác động của hành động – trả lời câu hỏi \u0026quot;ăn gì, xem gì, học gì\u0026quot;. Tiếng Việt không có chữ nào tương ứng.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDanh từ có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e을\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e책\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e책을\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e옷\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e옷을\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e를\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e사과\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e사과를\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e영화\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e영화를\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e지금 뭐 해요?\u003c/span\u003e – Bây giờ bạn đang làm gì?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e책을 읽어요.\u003c/span\u003e – Tôi đang đọc sách.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 무엇을 마셔요?\n나: 주스를 마셔요.\u003c/span\u003e – A: Bạn uống gì?\nB: Tôi uống nước hoa quả.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저는 텔레비전을 봐요.\n성민 씨는 한국어를 공부해요.\u003c/span\u003e – Tôi xem ti vi.\nSeong-min học tiếng Hàn.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eTính từ (\u003cspan lang=\"ko\"\u003e맛있다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e재미있다\u003c/span\u003e…) không đi với \u003cspan lang=\"ko\"\u003e을/를\u003c/span\u003e:\n\u003cspan lang=\"ko\"\u003e영화가 재미있어요\u003c/span\u003e, không nói \u003cspan lang=\"ko\"\u003e영화를 재미있어요\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThử ngay:\u003c/strong\u003e nhìn chữ cuối của danh từ – có patchim đi với \u0
