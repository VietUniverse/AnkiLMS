pVi\u0026quot;:\u0026quot;Dáng người\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;머리가 길다/짧다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;tóc dài / tóc ngắn\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;제 여자 친구는 머리가 길어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Bạn gái tôi có tóc dài.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Hai ô ảnh: bên trái nền hồng, cô gái tóc nâu dài bay trong gió, áo khoác hồng; bên phải nền cam, chàng trai tóc nâu ngắn, áo xanh dương.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;외모\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Dáng người\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;멋있다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;đẹp trai, phong độ, ngầu\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;제 남자친구는 아주 멋있어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Bạn trai tôi rất đẹp trai.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Chàng trai tóc nâu, áo raglan trắng tay xanh lá, cầm quả bóng bay đỏ, xung quanh có các ngôi sao lấp lánh trên nền xanh dương.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;외모\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Dáng người\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;귀엽다\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;dễ thương, đáng yêu\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;제 동생은 5살이에요. 정말 귀여워요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Em tôi 5 tuổi. Thật là dễ thương.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Hai em bé mẫu giáo đội mũ vàng, mặc đồng phục xanh nhảy lên vui vẻ cùng chú chó nhỏ, phía sau là ngôi trường mái đỏ, cầu vồng, cây xanh, mặt trời và chim bồ câu.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;색\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Màu sắc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;까만색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu đen\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;저는 까만색 바지를 입고 있어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Tôi đang mặc quần màu đen.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Bộ trang phục: áo polo trắng, quần dài đen có thắt lưng, đôi giày da đen, nền xám.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;색\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Màu sắc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;하얀색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu trắng\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;제 동생은 하얀색 모자를 좋아해요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Em tôi thích mũ màu trắng.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Chiếc mũ rộng vành màu trắng trên nền xanh dương.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;색\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Màu sắc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;빨간색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu đỏ\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;제 가방은 빨간색이에요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Túi của tôi màu đỏ.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Chiếc túi xách tay màu đỏ đặt trên bàn tròn trong cửa hàng, phía sau là kệ trưng bày giày và mũ.\u0026quot;},{\u0026quot;group\u0026quot;:\u0026quot;색\u0026quot;,\u0026quot;groupVi\u0026quot;:\u0026quot;Màu sắc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;파란색\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;màu xanh dương\u0026quot;,\u0026quot;exKo\u0026quot;:\u0026quot;우리 형은 파란색 티셔츠를 자주 입어요.\u0026quot;,\u0026quot;exVi\u0026quot;:\u0026quot;Anh trai tôi hay mặc áo phông màu xanh dương.\u0026quot;,\u0026quot;tranh\u0026quot;:\u0026quot;Bốn chiếc áo phông màu xanh dương xếp hai hàng trên nền trắng xanh nhạt.\u0026quot;}]}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTiếng Hàn\u003c/th\u003e\u003cth\u003eNghĩa\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e어떻게 생겼어요?\u003c/span\u003e\u003c/td\u003e\u003ctd\u003etrông như thế nào? – 그 사람은 어떻
