u0026quot;goc\u0026quot;:\u0026quot;가방\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;가방이\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;책\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;책이\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Danh từ không có patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;가\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;의자\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;의자가\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;침대\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;침대가\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;시계\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;시계가\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;이/가\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói có cái gì – nhắc tới lần đầu\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;방에 책상이 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trong phòng có bàn học.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;은/는 (Bài 6)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nói tiếp về cái đã nhắc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;책상은 침대 옆에 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bàn học thì ở cạnh giường.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;침대이 있어요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;침대가 있어요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;침대 không có patchim nên dùng 가.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;방에 뭐는 있어요?\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;방에 뭐가 있어요?\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Hỏi \\\u0026quot;có gì?\\\u0026quot; thì 뭐 đi với 가.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN이/가 있어요 / 없어요\u003c/span\u003e\u003c/strong\u003e: 이/가 gắn sau danh từ làm chủ ngữ: N이/가 있어요 = có N, N이/가 없어요 = không có N – tiếng Việt không có chữ nào tương ứng.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDanh từ có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e이\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e책상\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e책상이\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e가방\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e가방이\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e책\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e책이\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDanh từ không có patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e가\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e의자\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e의자가\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e침대\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e침대가\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e시계\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e시계가\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가방이 있어요?\u003c/span\u003e – Có cặp không?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e네, 가방이 있어요.\u003c/span\u003e – Vâng, có cặp.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 컴퓨터가 있어요?\n나: 네, 컴퓨터가 있어요.\u003c/span\u003e – A: Có máy tính không?\nB: Vâng, có máy tính.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 책이 있어요?\n나: 아니요, 책이 없어요.\u003c/span\u003e – A: Có sách không?\nB: Không, không có sách.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eHỏi \u0026quot;có gì?\u0026quot;: \u003cspan lang=\"ko\"\u003e방에 뭐가 있어요?\u003c/span\u003e Hỏi thêm \u0026quot;còn gì nữa?\u0026quot; thì chen \u003cspan lang=\"ko\"\u003e또\u003c/span\u003e:\n\u003cspan lang=\"ko\"\u003e또 뭐가 있어요?\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThử ngay:\u003c/strong\u003e xếp đồ trong phòng vào đúng ô – chữ cuối có patchim đi với \u003cspan lang=\"ko\"\u003e이\u003c/span\u003e, không có thì đi với\n\u003cspan lang=\"ko\"\u003e가\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-07/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;이\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;sau patchim\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;가\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;sau nguyên âm\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;침대\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;옷장\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;소파\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;텔레비전\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;컴퓨터\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;책상\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;시계\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;의자\u0026quot;,\u0026quot;o\u0026quot;:1}],\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e침대 · 옷장 · 소파 · 텔레비전 · 컴퓨터 · 책상 · 시계 · 의자\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e이\u003c/span\u003e – sau patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e가\u003c/span\u003e – sau nguyên âm\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T1cc3,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0 chốn, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;에\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;방\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;방에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;거실\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;거실에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;부엌\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;부엌에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;학교\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;학교에\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Đồ vật + từ vị trí (위, 아래, 옆…)\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;에\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;책상 위\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;책상 위에\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;침대 옆\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;침대 옆에\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;텔레비전은 거실이 있어요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;텔레비전은 거실에 있어요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Nơi chốn đi với 에, không phải 이/가.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN(nơi chốn)에 있어요 / 없어요\u003c/span\u003e\u003c/strong\u003e: \u0026quot;(Người, vật) ở …\u0026quot; – 에 đứng sau nơi chốn, ngược với \u0026quot;ở\u0026quot; tiếng Việt đứng trước; không ở đó thì 에 없어요.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eNơi chốn, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e에\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e방\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e방에\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e거실\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e거실에\u003c/span\u003e, \u003cspan lang
