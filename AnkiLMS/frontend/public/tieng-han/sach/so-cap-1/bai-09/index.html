03e\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e에\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/details\u003e\u003c/div\u003e\u003c/figure\u003e2e:T19e4,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;eseo\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;명에서\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;어떤 행위나 동작이 이루어지는 장소를 나타낼 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chỉ nơi diễn ra hành động (làm gì ở đâu): 에서 gắn sau danh từ nơi chốn. Khác 에 (chỉ nơi đến hoặc nơi có mặt).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;에서\u0026quot;,\u0026quot;시장\u0026quot;,\u0026quot;시장에서\u0026quot;],[\u0026quot;에서\u0026quot;,\u0026quot;백화점\u0026quot;,\u0026quot;백화점에서\u0026quot;],[\u0026quot;에서\u0026quot;,\u0026quot;학교\u0026quot;,\u0026quot;학교에서\u0026quot;],[\u0026quot;에서\u0026quot;,\u0026quot;카페\u0026quot;,\u0026quot;카페에서\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;어디에서 운동해요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bạn tập thể dục ở đâu?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;카페에서 커피를 마셔요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi uống cà phê ở quán cà phê.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;서점에 가요. 서점에서 책을 사요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi đến hiệu sách. Tôi mua sách ở hiệu sách.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong quán cà phê, hai phụ nữ ngồi bên bàn có ấm trà, tách cà phê và bánh ngọt. Cô gái buộc tóc đuôi ngựa áo gi-lê xanh chống cằm hỏi \\\u0026quot;어디에서 운동해요?\\\u0026quot;; người phụ nữ tóc xoăn ngắn áo len be trả lời \\\u0026quot;헬스장에서 운동해요.\\\u0026quot;, bong bóng nghĩ vẽ chính chị đang chạy trên máy chạy bộ trong phòng tập.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;Làm gì ở …\\\u0026quot; – 에서 đứng sau nơi chốn khi cuối câu là việc làm (ăn, học, đọc, tập…). Tiếng Việt đều nói \\\u0026quot;ở\\\u0026quot;, tiếng Hàn tách hai chữ.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi danh từ chỉ nơi chốn, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;에서\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;도서관\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;도서관에서 공부해요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;식당\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;식당에서 밥을 먹어요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;공원\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;공원에서 운동해요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;에 가요 / 와요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nơi đến\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;도서관에 가요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đi đến thư viện.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;에 있어요 / 없어요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nơi có mặt (Bài 7)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;책이 방에 있어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Sách ở trong phòng.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;에서 + việc làm\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nơi làm việc gì\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;도서관에서 책을 읽어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đọc sách ở thư viện.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;에서 왔어요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;từ đâu đến (Bài 6)\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;베트남에서 왔어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đến từ Việt Nam.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;회사 근처에 먹어요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;회사 근처에서 먹어요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Ăn là việc làm ở đó nên dùng 에서.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003e명에서\u003c/span\u003e\u003c/strong\u003e: \u0026quot;Làm gì ở …\u0026quot; – 에서 đứng sau nơi chốn khi cuối câu là việc làm (ăn, học, đọc, tập…). Tiếng Việt đều nói \u0026quot;ở\u0026quot;, tiếng Hàn tách hai chữ.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi danh từ chỉ nơi chốn, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e에서\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e도서관\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e도서관에서 공부해요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e식당\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e식당에서 밥을 먹어요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e공원\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e공원에서 운동해요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e어디에서 운동해요?\u003c/span\u003e – Bạn tập thể dục ở đâu?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e카페에서 커피를 마셔요.\u003c/span\u003e – Tôi uống cà phê ở quán cà phê.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e서점에 가요. 서점에서 책을 사요.\u003c/span\u003e – Tôi đi đến hiệu sách. Tôi mua sách ở hiệu sách.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eHỏi \u0026quot;làm gì ở đó?\u0026quot;: \u003cspan lang=\"ko\"\u003e거기에서 뭐 해요?\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThử ngay:\u003c/strong\u003e xếp từng câu vào ô \u003cspan lang=\"ko\"\u003e에\u003c/span\u003e hoặc \u003cspan lang=\"ko\"\u003e에서\u003c/span\u003e – câu đi tới, có mặt ở đâu\nvào ô \u003cspan lang=\"ko\"\u003e에\u003c/span\u003e; câu làm việc gì ở đó vào ô \u003cspan lang=\"ko\"\u003e에서\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-09/xep
