gure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;neyo\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-네요\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;새롭게 알게 된 사실에 대해 자신의 느낌이나 생각을 표현할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Thốt lên cảm nhận về điều vừa mới nhận ra — \\\u0026quot;…thật đấy!\\\u0026quot;, \\\u0026quot;…nhỉ!\\\u0026quot;. Gắn -네요 vào thân động từ / tính từ (không phân biệt patchim); thân có patchim ㄹ thì bỏ ㄹ (살다 → 사네요). Với danh từ: (danh từ)이네요.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-네요\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹네요\u0026quot;],[\u0026quot;-네요\u0026quot;,\u0026quot;좋다\u0026quot;,\u0026quot;좋네요\u0026quot;],[\u0026quot;-네요\u0026quot;,\u0026quot;오다\u0026quot;,\u0026quot;오네요\u0026quot;],[\u0026quot;-네요\u0026quot;,\u0026quot;예쁘다\u0026quot;,\u0026quot;예쁘네요\u0026quot;],[\u0026quot;-네요\u0026quot;,\u0026quot;★살다\u0026quot;,\u0026quot;사네요\u0026quot;],[\u0026quot;-네요\u0026quot;,\u0026quot;★멀다\u0026quot;,\u0026quot;머네요\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;이링 씨, 우리 가족 사진이에요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chị Yi Ling, đây là ảnh gia đình tôi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;아이가 정말 예쁘네요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Đứa bé xinh thật đấy!\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 이 잡채 좀 드세요. 제가 만들었어요.\\n나: 와! 정말 맛있네요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Anh ăn thử món japchae này đi. Tôi tự làm đấy.\\nB: Ồ! Ngon thật đấy!\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;라민 씨는 한국어를 정말 잘하네요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Anh Ramin nói tiếng Hàn giỏi thật đấy!\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Hai người phụ nữ ngồi cạnh nhau bên bàn; cô tóc buộc đuôi ngựa, áo gile xanh rêu đưa máy tính bảng có ảnh một bé gái cho Yi Ling tóc ngang vai áo sơ mi trắng xem, cả hai mỉm cười.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;… thật đấy!\\\u0026quot;, \\\u0026quot;… quá!\\\u0026quot; – cảm thán điều mình vừa thấy, vừa cảm nhận; tiếng Việt thêm \\\u0026quot;quá\\\u0026quot;, \\\u0026quot;thật đấy\\\u0026quot; cuối câu, tiếng Hàn gắn 네요 sau gốc động từ, tính từ.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi gốc động từ / tính từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;네요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;덥다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;덥네요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;춥다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;춥네요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;맛있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;맛있네요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;오다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;오네요\u0026quot;}]},{\u0026quot;dieuKien\u0026quot;:\u0026quot;Gốc có patchim ㄹ: ㄹ rụng\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;네요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;멀다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;머네요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;살다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;사네요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-네요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;vừa thấy, vừa cảm nhận – bước ra ngoài thấy lạnh, nhấp ngụm cà phê thấy ngon\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;와, 밖에 눈이 오네요!\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ồ, ngoài trời tuyết rơi kìa!\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-아요/어요 (Bài 8)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;kể điều mình đã biết từ trước\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;한국은 겨울에 눈이 많이 와요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ở Hàn Quốc mùa đông tuyết rơi nhiều.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;더워네요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;덥네요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;네요 gắn thẳng vào gốc (bỏ 다) – không chia ㅂ thành 워 như -아요/어요.\u0026quot;},{\u0026quot;sai\u0026quot;:\u0026quot;멀네요\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;머네요\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Gốc có patchim ㄹ: ㄹ rụng trước 네요.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-네요\u003c/span\u003e\u003c/strong\u003e: \u0026quot;… thật đấy!\u0026quot;, \u0026quot;… quá!\u0026quot; – cảm thán điều mình vừa thấy, vừa cảm nhận; tiếng Việt thêm \u0026quot;quá\u0026quot;, \u0026quot;thật đấy\u0026quot; cuối câu, tiếng Hàn gắn 네요 sau gốc động từ, tính từ.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi gốc động từ / tính từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e네요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e덥다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e덥네요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e춥다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e춥네요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e맛있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e맛있네요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e오다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e오네요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGốc có patchim ㄹ: ㄹ rụng\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e네요\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e멀다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e머네요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e살다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e사네요\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e이링 씨, 우리 가족 사진이에요.\u003c/span\u003e – Chị Yi Ling, đây là ảnh gia đình tôi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e아이가 정말 예쁘네요.\u003c/span\u003e – Đứa bé xinh thật đấy!\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 이 잡채 좀 드세요. 제가 만들었어요.\n나: 와! 정말 맛있네요.\u003c/span\u003e – A: Anh ăn thử món japchae này đi. Tôi tự làm đấy.\nB: Ồ! Ngon thật đấy!\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e라민 씨는 한국어를 정말 잘하네요.\u003c/span\u003e – Anh Ramin nói tiếng Hàn giỏi thật đấy!\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eVới danh từ: có patchim + \u003cspan lang=\"ko\"\u003e이네요\u003c/span\u003e, không có + \u003cspan lang=\"ko\"\u003e네요\u003c/span\u003e –\n\u003cspan lang=\"ko\"\u003e겨울이네요\u003c/span\u003e / \u003cspan lang=\"ko\"\u003e커피네요\u003c/span\u003e. Câu mở bằng \u003cspan lang=\"ko\"\u003e와\u003c/span\u003e – \u0026quot;Ồ!\u0026quot;,\n\u0026quot;Ôi!\u0026quot; – thường kết thúc bằng \u003cspan lang=\"ko\"\u003e-네요\u003c/span\u003e: \u003cspan lang=\"ko\"\u003e와, 정말 맛있네요!\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eThử ngay: câu nào vừa thấy, câu nào kể điều mình biết? Xếp mỗi câu vào đúng ô.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"xep-cho\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-19/xep-cho\u0026quot;,\u0026quot;o\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;네요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;vừa thấy, vừa cảm nhận\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;아요/어요\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;kể điều mình biết từ trước\u0026quot;}}],\u0026quot;ten\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;방글라데시는 여름에 아주 ___. (덥다)\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Rahman kể chuyện quê anh – điều anh biết từ lâu → 더워요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;와, 이 커피 정말 ___! (맛있다)\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Vừa nhấp thử cà phê → 맛있네요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;한국은 겨울에 눈이 많이 ___. (오다)\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Kể điều mình biết về Hàn Quốc → 와요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;와, 바닷가에 사람이 정말 ___! (많다)\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Vừa tới bãi biển, thấy đông người → 많네요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;가을은 날씨가 ___. (맑다)\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Kể về mùa thu nói chung → 맑아요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;와, 밖에 눈이 ___! (오다)\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Vừa nhìn ra ngoài, thấy tuyết đang rơi → 오네요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;저는 겨울보다 여름을 더 ___. (좋아하다)\u0026quot;,\u0026quot;o\u0026quot;:1,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Kể sở thích của mình → 좋아해요.\u0026quot;}},{\u0026quot;ko\u0026quot;:\u0026quot;와, 꽃이 많이 ___! (피다)\u0026quot;,\u0026quot;o\u0026quot;:0,\u0026quot;ly\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Vừa thấy hoa đã nở → 피었네요.\u0026quot;}}],\u0026quot;luat\u0026quot;:\u0026quot;tu-do\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e방글라데시는 여름에 아주 ___. (덥다) · 와, 이 커피 정말 ___! (맛있다) · 한국은 겨울에 눈이 많이 ___. (오다) · 와, 바닷가에 사람이 정말 ___! (많다) · 가을은 날씨가 ___. (맑다) · 와, 밖에 눈이 ___! (오다) · 저는 겨울보다 여름을 더 ___. (좋아하다) · 와, 꽃이 많이 ___! (피다)\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e네요\u003c/span\u003e – vừa thấy, vừa cảm nhận\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e아요/어요\u003c/span\u003e – kể điều mình biết từ trước\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T227d,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;boda\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;N보다\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;앞의 것이 비교 대상임을 나타낼 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trợ từ so sánh — gắn sau danh từ được đem ra so, nghĩa là \\\u0026quot;hơn…\\\u0026quot;; thường đi với 더 (A는 B보다 더 …). Gắn 보다 vào danh từ (không phân biệt patchim).\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;보다\u0026quot;,\u0026quot;작년\u0026quot;,\u0026quot;작년보다\u0026quot;],[\u0026quot;보다\u0026quot;,\u0026quot;러시아\u0026quot;,\u0026quot;러시아보다\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;알래스카 겨울 날씨는 어때요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Thời tiết mùa đông ở Alaska thế nào?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;알래스카는 서울보다 추워요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Alaska lạnh hơn Seoul.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 시간이 늦었네요. 택시를 탈까요?\\n나: 아니요, 지금은 택시보다 지하철이 더 빨라요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Muộn rồi nhỉ. Mình đi taxi nhé?\\nB: Không, giờ này tàu điện ngầm nhanh hơn taxi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;저는 농구보다 축구를 잘해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi chơi bóng đá giỏi hơn bóng rổ.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Phố tuyết mùa đông: cô gái đội mũ len, quàng khăn kẻ, áo khoác xanh than hỏi người đàn ông tóc vàng đội mũ phớt, áo măng tô nâu, khăn kẻ; phía sau là dãy nhà mái phủ tuyết và cột đèn.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;… hơn …\\\u0026quot; – A은/는 B보다 (더) + tính từ / động từ = \\\u0026quot;A … hơn B\\\u0026quot;; 보다 gắn ngay sau thứ đem ra so (B), như chữ \\\u0026quot;hơn B\\\u0026quot; của tiếng Việt nhưng đứng sau danh từ.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi danh từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;보다\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;버스\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;버스보다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;여름\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;여름보다\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;작년\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;작년보다\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;버스가 지하철보다 빨라요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;지하철이 버스보다 빨라요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Muốn nói tàu điện ngầm nhanh hơn: 보다 gắn sau thứ đem ra so (xe buýt).\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eN보다\u003c/span\u003e\u003c/strong\u003e: \u0026quot;… hơn …\u0026quot; – A은/는 B보다 (더) + tính từ / động từ = \u0026quot;A … hơn B\u0026quot;; 보다 gắn ngay sau thứ đem ra so (B), như chữ \u0026quot;hơn B\u0026quot; của tiếng Việt nhưng đứng sau danh từ.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi danh từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e보다\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e버스\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e버스보다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e여름\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e여름보다\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e작년\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e작년보다\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e알래스카 겨울 날씨는 어때요?\u003c/span\u003e – Thời tiết mùa đông ở Alaska thế nào?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e알래스카는 서울보다 추워요.\u003c/span\u003e – Alaska lạnh hơn Seoul.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 시간이 늦었네요. 택시를 탈까요?\n나: 아니요, 지금은 택시보다 지하철이 더 빨라요.\u003c/span\u003e – A: Muộn rồi nhỉ. Mình đi taxi nhé?\nB: Không, giờ này tàu điện ngầm nhanh hơn taxi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e저는 농구보다 축구를 잘해요.\u003c/span\u003e – Tôi chơi bóng đá giỏi hơn bóng rổ.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003eThứ tự đổi được: \u003cspan lang=\"ko\"\u003e버스보다 지하철이 빨라요\u003c/span\u003e và \u003cspan lang=\"ko\"\u003e지하철이 버스보다 빨라요\u003c/span\u003e\ncùng nghĩa – tàu điện ngầm nhanh hơn xe buýt. \u003cspan lang=\"ko\"\u003e더\u003c/span\u003e bỏ đi cũng được, có thì nghe rõ hơn.\u003c/p\u003e\n\u003cp\u003eNhiệt độ đọc bằng số Hán Hàn + \u003cspan lang=\"ko\"\u003e도\u003c/span\u003e: \u003cspan lang=\"ko\"\u003e33도\u003c/span\u003e là\n\u003cspan lang=\"ko\"\u003e삼십삼 도\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003eThử ngay: Huyền mở ứng dụng thời tiết, đọc nhiệt độ hôm nay của bốn thành phố. Bấm \u003cstrong\u003eNghe\u003c/strong\u003e từng câu rồi ghi lại.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"nghe-so\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-19/nghe-so\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;go\u0026quot;,\u0026quot;cau\u0026quot;:[{\u0026quot;loai\u0026quot;:\u0026quot;so\u0026quot;,\u0026quot;hien\u0026quot;:\u0026quot;32도\u0026quot;,\u0026quot;digits\u0026quot;:\u0026quot;32\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;삼십이 도\u0026quot;,\u0026quot;vi\u0026quot;:{\u0026quot;vi\u0026quot;:\u0026quot;Manila\u0026quot;}},{\u0026quot;loai\u0026quot;:\u0026qu :270,\u0026quot;pose\u0026quot;:\u0026quot;phone\u0026quot;},{\u0026quot;kind\u0026quot;:\u0026quot;person\u0026quot;,\u0026quot;id\u0026quot;:\u0026quot;rahman\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;라흐만\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Rahman\u0026quot;,\u0026quot;label\u0026quot;:[860,380],\u0026quot;who\u0026quot;:\u0026quot;라흐만\u0026quot;,\u0026quot;x\u0026quot;:700,\u0026quot;y\u0026quot;:504,\u0026quot;h\u0026quot;:280,\u0026quot;pose\u0026quot;:\u0026quot;umbrella\u0026quot;,\u0026quot;flip\u0026quot;:true}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e호우\u003c/span\u003e – mưa lớn\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e호우 경보\u003c/span\u003e – Cảnh báo mưa lớn\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e후엔\u003c/span\u003e – Huyền\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e라흐만\u003c/span\u003e – Rahman\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eMỗi mùa một chuyện.\u003c/strong\u003e Cuối tháng 6 đến cuối tháng 7 là mùa mưa dầm \u003cspan lang=\"ko\"\u003e장마\u003c/span\u003e – mưa nhiều ngày\nliền, ra đường nhớ mang ô. Những ngày nóng nhất giữa hè (\u003cspan lang=\"ko\"\u003e복날\u003c/span\u003e), người Hàn xếp hàng ăn\n\u003cspan lang=\"ko\"\u003e삼계탕\u003c/span\u003e nóng – \u0026quot;lấy nóng trị nóng\u0026quot;. Tuyết đầu mùa \u003cspan lang=\"ko\"\u003e첫눈\u003c/span\u003e là chuyện vui:\nnhiều người nhắn tin cho nhau, hẹn người thương gặp đúng hôm đó.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBụi mịn và tin nhắn cảnh báo.\u003c/strong\u003e Mùa xuân, người Hàn xem chỉ số bụi mịn \u003cspan lang=\"ko\"\u003e미세 먼지\u003c/span\u003e mỗi sáng như\nxem thời tiết; ngày bụi nhiều thì đeo khẩu trang (\u003cspan lang=\"ko\"\u003e마스크\u003c/span\u003e), ít ra ngoài. Khi có nắng nóng, mưa\nlớn, điện thoại nhận tin nhắn cảnh báo (\u003cspan lang=\"ko\"\u003e안전 안내 문자\u003c/span\u003e) – \u003cspan lang=\"ko\"\u003e폭염 경보\u003c/span\u003e là\n\u003cem\u003ebạo viêm cảnh báo\u003c/em\u003e: cảnh báo nắng nóng gay gắt. Mưa rất to thì là \u003cspan lang=\"ko\"\u003e호우 경보\u003c/span\u003e – cảnh báo mưa\nlớn (như trong tranh).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMở lời bằng thời tiết.\u003c/strong\u003e Gặp đồng nghiệp, hàng xóm, người Hàn hay bắt chuyện bằng một câu về trời:\n\u003cspan lang=\"ko\"\u003e오늘 날씨가 정말 춥네요\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e날씨가 좋네요\u003c/span\u003e – như người Việt nói \u0026quot;Hôm nay\nnóng nhỉ!\u0026quot;.\u003c/p\u003e\n\u003caside class=\"sach-callout\" data-callout=\"chu-y\" role=\"note\" aria-label=\"Chú ý\"\u003e\u003cdiv class=\"sach-callout-body\"\u003e\u003cp class=\"sach-callout-title\"\u003eChú ý\u003c/p\u003e\u003cp\u003eMiền Bắc Việt Nam cũng có bốn mùa, nhưng mùa đông Seoul lạnh hơn nhiều – tháng 1 thường dưới 0 độ, có\ntuyết. Miền Nam Việt Nam chỉ có mùa mưa và mùa khô.\u003c/p\u003e\n\u003c/div\u003e\u003c/aside\u003e\n\u003ch3\u003eNói chuyện thời tiết\u003c/h3\u003e\n\u003cp\u003eNói theo sáu câu về thời tiết hằng ngày.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"noi-theo\" data-props=\"{\u0026quot;id\u0026quot;:\u0026quot;so-cap-1/bai-19/noi-theo-2\u0026quot;,\u0026quot;lines\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;폭염 경보 문자가 왔어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Có tin nhắn cảnh báo nắng nóng.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;오늘은 미세 먼지가 많아요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Hôm nay nhiều bụi mịn.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;마스크를 쓰세요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Bạn đeo khẩu trang nhé.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;비가 와요. 우산이 있어요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Trời mưa rồi. Bạn có ô không?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;내일은 눈이 많이 와요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Ngày mai tuyết rơi nhiều.\u0026quot;},{\u002
