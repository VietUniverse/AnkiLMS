u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;먹다\u0026quot;,\u0026quot;o\u0026quot;:0},{\u0026quot;ko\u0026quot;:\u0026quot;쉬다\u0026quot;,\u0026quot;o\u0026quot;:1},{\u0026quot;ko\u0026quot;:\u0026quot;찍다\u0026quot;,\u0026quot;o\u0026quot;:0}],\u0026quot;luat\u0026quot;:\u0026quot;goc\u0026quot;,\u0026quot;kieu\u0026quot;:\u0026quot;chung\u0026quot;}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp lang=\"ko\"\u003e만나다 · 듣다 · 가다 · 읽다 · 만들다 · 먹다 · 쉬다 · 찍다\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003e을 거예요\u003c/span\u003e – gốc có patchim\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003e\u003cspan lang=\"ko\"\u003eㄹ 거예요\u003c/span\u003e – không patchim / patchim ㄹ\u003c/th\u003e\u003ctd\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/figure\u003e2e:T2def,\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;step1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;go-list\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-고\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;두 가지 이상의 일을 연결해서 말할 때 사용해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Nối hai việc hay hai tính chất ngang hàng trong một câu — \\\u0026quot;…và…\\\u0026quot;, \\\u0026quot;vừa… vừa…\\\u0026quot;. Gắn -고 vào thân động từ / tính từ (không phân biệt patchim); hay đi với -도: 등산도 하고 캠핑도 해요.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;-고\u0026quot;,\u0026quot;먹다\u0026quot;,\u0026quot;먹고\u0026quot;],[\u0026quot;-고\u0026quot;,\u0026quot;맛있다\u0026quot;,\u0026quot;맛있고\u0026quot;],[\u0026quot;-고\u0026quot;,\u0026quot;가다\u0026quot;,\u0026quot;가고\u0026quot;],[\u0026quot;-고\u0026quot;,\u0026quot;크다\u0026quot;,\u0026quot;크고\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;안젤라 씨, 이번 휴가에 뭐 할 거예요?\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Chị Angela, kỳ nghỉ này chị sẽ làm gì?\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;산에서 등산도 하고 캠핑도 할 거예요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi sẽ leo núi và cắm trại trên núi.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 주말에 보통 뭐 해요?\\n나: 저는 장도 보고 운동도 해요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Cuối tuần bạn thường làm gì?\\nB: Tôi đi chợ và tập thể dục.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;가: 한국어 공부는 어때요?\\n나: 한국어 공부는 쉽고 재미있습니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;A: Học tiếng Hàn thế nào?\\nB: Học tiếng Hàn vừa dễ vừa thú vị.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong văn phòng, người đàn ông đeo cà vạt cầm cốc nước hỏi; Angela đeo kính, cầm cặp và chai nước đứng trả lời; bong bóng suy nghĩ vẽ cô leo núi và nướng thịt bên lều cắm trại.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;… và …\\\u0026quot; – nối hai việc ngang hàng trong một câu; việc trước chỉ gắn 고, đuôi cuối câu quyết định chuyện sắp làm hay đã làm.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi gốc động từ / tính từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;고\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;하다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;하고\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;찍다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;찍고\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;만나다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만나고\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;맛있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;맛있고\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-고 … -(으)ㄹ 거예요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;đuôi cuối câu là \\\u0026quot;sẽ\\\u0026quot; – kế hoạch\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;수영도 하고 사진도 찍을 거예요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi sẽ bơi và chụp ảnh.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-고 … -았/었어요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;đuôi cuối câu là \\\u0026quot;đã\\\u0026quot; – chuyện đã qua\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;수영도 하고 사진도 찍었어요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi đã bơi và chụp ảnh.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;N하고 N (Bài 13)\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nối hai danh từ, không nối hai việc\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;칫솔하고 치약을 사요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi mua bàn chải và kem đánh răng.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[{\u0026quot;sai\u0026quot;:\u0026quot;수영도 할 거예요 사진도 찍을 거예요.\u0026quot;,\u0026quot;dung\u0026quot;:\u0026quot;수영도 하고 사진도 찍을 거예요.\u0026quot;,\u0026quot;viSao\u0026quot;:\u0026quot;Hai việc trong một câu: việc trước chỉ gắn 고, đuôi \\\u0026quot;sẽ\\\u0026quot; để ở cuối câu.\u0026quot;}]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan lang=\"ko\"\u003eV/A-고\u003c/span\u003e\u003c/strong\u003e: \u0026quot;… và …\u0026quot; – nối hai việc ngang hàng trong một câu; việc trước chỉ gắn 고, đuôi cuối câu quyết định chuyện sắp làm hay đã làm.\u003c/p\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eMọi gốc động từ / tính từ, có hay không patchim\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e고\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan lang=\"ko\"\u003e하다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e하고\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e찍다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e찍고\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e만나다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e만나고\u003c/span\u003e, \u003cspan lang=\"ko\"\u003e맛있다\u003c/span\u003e → \u003cspan lang=\"ko\"\u003e맛있고\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cul\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e안젤라 씨, 이번 휴가에 뭐 할 거예요?\u003c/span\u003e – Chị Angela, kỳ nghỉ này chị sẽ làm gì?\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e산에서 등산도 하고 캠핑도 할 거예요.\u003c/span\u003e – Tôi sẽ leo núi và cắm trại trên núi.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 주말에 보통 뭐 해요?\n나: 저는 장도 보고 운동도 해요.\u003c/span\u003e – A: Cuối tuần bạn thường làm gì?\nB: Tôi đi chợ và tập thể dục.\u003c/li\u003e\u003cli\u003e\u003cspan lang=\"ko\"\u003e가: 한국어 공부는 어때요?\n나: 한국어 공부는 쉽고 재미있습니다.\u003c/span\u003e – A: Học tiếng Hàn thế nào?\nB: Học tiếng Hàn vừa dễ vừa thú vị.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/figure\u003e\u003ch3\u003eThêm \u003cspan lang=\"ko\"\u003e-고요\u003c/span\u003e – “… nữa”\u003c/h3\u003e\n\u003cp\u003eCâu trước đã xong, muốn kể thêm một ý nữa thì câu sau kết thúc bằng \u003cspan lang=\"ko\"\u003e-고요\u003c/span\u003e.\u003c/p\u003e\n\u003cfigure class=\"lesson-island\" data-island=\"ngu-phap\" data-props=\"{\u0026quot;book\u0026quot;:\u0026quot;sejong-1\u0026quot;,\u0026quot;point\u0026quot;:{\u0026quot;id\u0026quot;:\u0026quot;goyo\u0026quot;,\u0026quot;pattern\u0026quot;:\u0026quot;V/A-고요\u0026quot;,\u0026quot;meaningKo\u0026quot;:\u0026quot;상대방이나 말하는 사람이 한 말에 어떤 내용을 계속 이어 말하거나 덧붙일 때 씁니다.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;\\\u0026quot;… nữa / còn … nữa\\\u0026quot;: dùng ở cuối câu khi nói tiếp hoặc bổ sung thêm nội dung vào điều mình hay người kia vừa nói. Gắn -고요 vào gốc động từ, không phân biệt có 받침 hay không.\u0026quot;,\u0026quot;table\u0026quot;:[[\u0026quot;받침 ○\u0026quot;,\u0026quot;먹다, 만들다\u0026quot;,\u0026quot;먹고요, 만들고요\u0026quot;],[\u0026quot;받침 ×\u0026quot;,\u0026quot;가다, 공부하다\u0026quot;,\u0026quot;가고요, 공부하고요\u0026quot;]],\u0026quot;examples\u0026quot;:[{\u0026quot;ko\u0026quot;:\u0026quot;고향에 갈 거예요. 부모님도 만나고요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi sẽ về quê. Sẽ gặp cả bố mẹ nữa.\u0026quot;},{\u0026quot;ko\u0026quot;:\u0026quot;주말에 집에서 쉬었어요. 낮잠도 자고요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Cuối tuần tôi đã nghỉ ở nhà. Còn ngủ trưa nữa.\u0026quot;}],\u0026quot;tranh\u0026quot;:\u0026quot;Trong quán cà phê có quầy pha chế và người pha chế râu quai nón phía sau, một cô gái tóc đen và một chàng trai áo xanh ngồi đối diện ở bàn trò chuyện, cạnh chậu cây.\u0026quot;},\u0026quot;khuon\u0026quot;:{\u0026quot;nghia\u0026quot;:\u0026quot;\\\u0026quot;… nữa\\\u0026quot; – nói thêm một ý vào câu vừa nói; 고요 không tự mang thì: câu trước \\\u0026quot;sẽ\\\u0026quot; thì ý thêm cũng \\\u0026quot;sẽ\\\u0026quot;, câu trước \\\u0026quot;đã\\\u0026quot; thì cũng \\\u0026quot;đã\\\u0026quot;.\u0026quot;,\u0026quot;ghep\u0026quot;:[{\u0026quot;dieuKien\u0026quot;:\u0026quot;Mọi gốc động từ / tính từ, có hay không patchim\u0026quot;,\u0026quot;them\u0026quot;:\u0026quot;고요\u0026quot;,\u0026quot;vd\u0026quot;:[{\u0026quot;goc\u0026quot;:\u0026quot;만나다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;만나고요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;자다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;자고요\u0026quot;},{\u0026quot;goc\u0026quot;:\u0026quot;맛있다\u0026quot;,\u0026quot;dang\u0026quot;:\u0026quot;맛있고요\u0026quot;}]}],\u0026quot;rutGon\u0026quot;:[],\u0026quot;batQuyTac\u0026quot;:[],\u0026quot;soSanh\u0026quot;:[{\u0026quot;mau\u0026quot;:\u0026quot;-고\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;nối hai việc ngay trong một câu\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;부모님도 만나고 친구도 만날 거예요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi sẽ gặp bố mẹ và gặp cả bạn bè.\u0026quot;},{\u0026quot;mau\u0026quot;:\u0026quot;-고요\u0026quot;,\u0026quot;khi\u0026quot;:\u0026quot;câu trước đã xong, nói thêm một ý\u0026quot;,\u0026quot;ko\u0026quot;:\u0026quot;고향에 갈 거예요. 부모님도 만나고요.\u0026quot;,\u0026quot;vi\u0026quot;:\u0026quot;Tôi sẽ về quê. Sẽ gặp cả bố mẹ nữa.\u0026quot;}],\u0026quot;loiSai\u0026quot;:[]}}\"\u003e\u003cdiv class=\"island-fallback\"\u003e\u003cp\u003e\u003c
